name: control-plane

on:
  push:
    branches: ["**"]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: control-plane

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          go mod tidy
          echo "--- go.mod ---"; cat go.mod
          echo "--- go.sum (first lines) ---"; head -20 go.sum || true

      - name: Upload go.sum
        uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: control-plane/go.sum
          if-no-files-found: warn

      - name: Detect dependency drift
        run: |
          set -euo pipefail
          # Once go.sum is committed, `go mod tidy` must be a no-op.
          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            if ! git diff --quiet -- go.mod go.sum; then
              echo "::error::go.mod/go.sum are not tidy. Commit the regenerated files."
              git --no-pager diff -- go.mod go.sum
              exit 1
            fi
          else
            echo "::warning::go.sum is not committed yet - download the go-sum artifact and commit it."
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  integration:
    name: integration against real postgres
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        # Same minor version the chart bundles, so claim semantics are tested
        # against what actually ships.
        image: postgres:17.11
        env:
          POSTGRES_USER: strange-company
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: strange-company
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strange-company"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://strange-company:ci-password@localhost:5432/strange-company?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go mod tidy
      - name: Store integration tests
        run: go test -race -v ./internal/store/...
