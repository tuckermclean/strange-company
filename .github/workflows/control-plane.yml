name: control-plane

on:
  push:
    branches: ["**"]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: control-plane

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          go mod tidy
          echo "--- go.mod ---"; cat go.mod
          echo "--- go.sum (first lines) ---"; head -20 go.sum || true

      - name: Upload go.sum
        uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: control-plane/go.sum
          if-no-files-found: warn

      - name: Detect dependency drift
        run: |
          set -euo pipefail
          # Once go.sum is committed, `go mod tidy` must be a no-op.
          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            if ! git diff --quiet -- go.mod go.sum; then
              echo "::error::go.mod/go.sum are not tidy. Commit the regenerated files."
              git --no-pager diff -- go.mod go.sum
              exit 1
            fi
          else
            echo "::warning::go.sum is not committed yet - download the go-sum artifact and commit it."
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  integration:
    name: integration against real postgres
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        # Same minor version the chart bundles, so claim semantics are tested
        # against what actually ships.
        image: postgres:17.11
        env:
          POSTGRES_USER: strange-company
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: strange-company
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strange-company"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://strange-company:ci-password@localhost:5432/strange-company?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go mod tidy
      - name: Store integration tests
        run: go test -race -v ./internal/store/...

      - name: 'M1 gate: ten workers race for one card, exactly one wins'
        # Called out as its own step so the milestone exit criterion is a named
        # green check rather than a line buried in test output.
        run: |
          set -euo pipefail
          go test -race -v -count=1 \
            -run 'TestTenConcurrentWorkersClaimExactlyOnce' \
            ./internal/store/... 2>&1 | tee /tmp/gate.txt
          grep -q -- "--- PASS: TestTenConcurrentWorkersClaimExactlyOnce" /tmp/gate.txt \
            || { echo "::error::the M1 exit test did not run"; exit 1; }

  image:
    name: build and publish the image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only when we are actually going to push.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/strange-company-control-plane
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push on main or a tag)
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image runs as non-root on a read-only filesystem
        run: |
          set -euo pipefail
          # The chart runs this image with runAsUser 65532 and
          # readOnlyRootFilesystem: true. Verify that here rather than
          # discovering it in a cluster.
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker build -t verify:local --build-arg VERSION=verify -f control-plane/Dockerfile control-plane
          uid=$(docker run --rm --entrypoint="" verify:local id -u 2>/dev/null || echo "no-shell")
          echo "image user check: $uid (distroless has no shell, so 'no-shell' is expected)"
          # A missing required variable must fail fast with a clear message.
          set +e
          out=$(docker run --rm --read-only --user 65532:65532 verify:local 2>&1)
          code=$?
          set -e
          echo "$out"
          [ $code -ne 0 ] || { echo "::error::starting with no configuration should have failed"; exit 1; }
          echo "$out" | grep -q "DATABASE_HOST" || { echo "::error::startup error should name the missing variables"; exit 1; }
          echo "fails fast and names the missing configuration"
