# Tier-E jobs (plan 52 section 8.4). On pull requests a path filter selects the jobs whose inputs changed;
# `e2e-gate` always runs and succeeds iff every selected job succeeded (no required check stuck in "expected").
# F03 jobs: `toolbox` (images and wrapper on Docker rootful), the engine matrix `toolbox-podman` and `toolbox-selinux`,
# `toolbox-pull-equivalence` (02-AC-4) and `e2e-k3d` (02-AC-12); `verify-e2e` runs make verify offline twice.
# F07 job: `worker-component` (the harness-fake image rules and the container-level worker suite, Docker and Podman);
# F08 adds `make test-integration` (06-AC-1, the S3 emulator and real tofu legs) to the same job.
# Scheduled runs skip a commit that already passed a scheduled run, using a cache marker keyed by the
# commit SHA rather than a query of earlier runs, so no permission beyond `contents: read` is needed (CD-52).
name: e2e

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      toolbox: ${{ steps.select.outputs.toolbox }}
      verify-e2e: ${{ steps.select.outputs.verify_e2e }}
      cluster: ${{ steps.select.outputs.e2e_k3d }}
      worker: ${{ steps.select.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A hit means this commit already passed a scheduled run (`skipped: unchanged`). Restore-only: this job
      # never saves the marker.
      - name: Look up the scheduled-run marker
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/e2e-scheduled
          key: e2e-scheduled-ok-${{ github.sha }}
          lookup-only: true

      # Fails closed: if `git diff` fails, the step (and so e2e-gate) fails instead of selecting nothing.
      - name: Select the tier-E jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UNCHANGED: ${{ steps.marker.outputs.cache-hit }}
        run: |
          toolbox=true
          verify_e2e=true
          e2e_k3d=true
          worker=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            toolbox=false
            verify_e2e=false
            e2e_k3d=false
            worker=false
            # toolbox also selects the engine matrix (toolbox-podman, toolbox-selinux) and toolbox-pull-equivalence.
            if grep -q -e '^toolbox/' -e '^bootstrap$' -e '^test/e2e/wrapper/' -e '^\.github/workflows/e2e\.yaml$' \
              -e '^test/e2e/selinux/' \
              -e '^Makefile$' -e '^mk/toolbox\.mk$' -e '^src/' -e '^\.dockerignore$' -e '^tools/stage0/requirements\.txt$' \
              <<<"$changed"; then
              toolbox=true
            fi
            if grep -q -e '^Makefile$' -e '^mk/' -e '^src/' -e '^toolbox/' -e '^bootstrap$' -e '^policy/' \
              -e '^test/e2e/verify/' -e '^versions/' -e '^gitops/' -e '^\.github/workflows/e2e\.yaml$' <<<"$changed"; then
              verify_e2e=true
            fi
            # Plan 52 section 8.4 e2e-k3d paths, plus the toolbox image it runs (02-AC-12).
            if [ "$toolbox" = true ] || grep -q -e '^charts/' -e '^gitops/' -e '^src/' -e '^policy/' \
              -e '^test/e2e/k3d/' <<<"$changed"; then
              e2e_k3d=true
            fi
            # F07 Layer 2: the harness images, the worker and fake-harness code, the suite and the ci image it uses.
            if grep -q -e '^harnesses/' -e '^src/' -e '^test/e2e/worker/' -e '^test/e2e/fake-target/' -e '^toolbox/' \
              -e '^bootstrap$' -e '^Makefile$' -e '^mk/worker\.mk$' -e '^mk/tofu\.mk$' -e '^infra/tofu/' -e '^\.dockerignore$' \
              -e '^\.github/workflows/e2e\.yaml$' <<<"$changed"; then
              worker=true
            fi
          elif [ "$EVENT" = schedule ] && [ "$UNCHANGED" = true ]; then
            toolbox=false
            verify_e2e=false
            e2e_k3d=false
            worker=false
            echo "skipped: unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "toolbox=$toolbox"
            echo "verify_e2e=$verify_e2e"
            echo "e2e_k3d=$e2e_k3d"
            echo "worker=$worker"
          } >> "$GITHUB_OUTPUT"

  toolbox:
    needs: changes
    if: needs.changes.outputs.toolbox == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      SC_CONTAINER_ENGINE: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The toolbox and ci images need about 10 GB with their build cache; the hosted image ships unused SDKs.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      # 02-AC-14, 02-AC-15 (build side), 02-AC-16 on Docker rootful.
      - name: Real-engine checks of the ci image and ./bootstrap exec
        run: sh test/e2e/wrapper/real-engine.sh

      # 02-AC-15 (static side): toolbox-check rejects a FROM without a digest.
      - name: Containerfile pin checks
        run: sh test/e2e/wrapper/check-pins.sh

      # 02-AC-1, 02-AC-2, 02-AC-3 (build side), 02-AC-8, 02-AC-9: make toolbox (both targets, --no-cache) on Docker.
      # SC_IMG_FLAG is empty, so the criteria's literal `./bootstrap exec --` commands run on the default toolbox image.
      - name: Toolbox and ci images
        env:
          SC_IMG_FLAG: ''
        run: sh test/e2e/wrapper/toolbox-image.sh

      # 02-AC-5 (Docker rootful leg), 02-AC-6, 02-AC-7, 02-AC-10, 02-AC-11, 02-AC-13 with the literal commands.
      - name: Wrapper contract on the toolbox image
        run: sh test/e2e/wrapper/wrapper-real.sh

  # 52-AC-5, 01-AC-6, 52-AC-8: two offline `make verify` runs with SC_FORBID_PAID=1, identical summaries.
  verify-e2e:
    needs: changes
    if: needs.changes.outputs.verify-e2e == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      SC_CONTAINER_ENGINE: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Offline, repeatable, no-paid make verify
        run: sh test/e2e/verify/run

      - name: Upload the two verify summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-e2e
          path: out/verify-e2e/
          if-no-files-found: ignore

  # 02-AC-5, rootless Podman on Ubuntu (plan 02 section 22 engine matrix).
  toolbox-podman:
    needs: changes
    if: needs.changes.outputs.toolbox == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      SC_CONTAINER_ENGINE: podman
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted image ships unused SDKs; the toolbox and ci images need about 10 GB with their build cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; rootless Podman needs them and a
      # subordinate id range for the runner user.
      - name: Enable rootless Podman
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          grep -q "^$(id -un):" /etc/subuid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Wrapper contract on rootless Podman
        run: sh test/e2e/wrapper/wrapper-real.sh

      - name: 02-AC-5 literal command
        run: sh test/e2e/wrapper/ac5-probe.sh

  # 02-AC-5, rootless Podman with SELinux enforcing: a Fedora Cloud VM under QEMU/KVM (D4).
  toolbox-selinux:
    needs: changes
    if: needs.changes.outputs.toolbox == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install qemu and cloud-image-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      # Hosted Linux runners expose /dev/kvm; the runner user needs access to it.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fedora VM with SELinux enforcing
        run: test/e2e/selinux/run

  # 02-AC-4, pull/build equivalence with a local registry standing in for GHCR (D3).
  toolbox-pull-equivalence:
    needs: changes
    if: needs.changes.outputs.toolbox == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      SC_CONTAINER_ENGINE: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted image ships unused SDKs; the toolbox and ci images need about 10 GB with their build cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Pulled and built toolbox images are equivalent
        run: sh test/e2e/wrapper/pull-equivalence.sh

  # 02-AC-12 (plan 52 e2e-k3d): the toolbox image as a PSA-restricted Pod.
  e2e-k3d:
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      SC_CONTAINER_ENGINE: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted image ships unused SDKs; the toolbox and ci images need about 10 GB with their build cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Toolbox image in a restricted Pod
        run: test/e2e/k3d/run

  # 28-AC-3 and the container-level worker evidence (27-AC-1, 27-AC-5, 27-AC-16, 27-AC-24, real ssh), F07 brief D3/D4.
  worker-component:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      SC_ENGINE: ${{ matrix.engine }}
      SC_CONTAINER_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted image ships unused SDKs; the ci and harness-fake images need about 10 GB with their build cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; rootless Podman needs them and a
      # subordinate id range for the runner user.
      - name: Enable rootless Podman
        if: matrix.engine == 'podman'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          grep -q "^$(id -un):" /etc/subuid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          podman system migrate
          podman info --format '{{.Host.Security.Rootless}}'

      - name: harness-fake image rules (28-AC-3)
        run: make harness-image-test IMAGE=harness-fake

      - name: Container-level worker suite
        run: make test-worker-component

      # 06-AC-1 (and the library legs of 06-AC-2/-3/-4/-8): the conformance suite C1-C8 and the encrypted-state checks
      # against the SeaweedFS emulator and the real tofu, both inside the ci image.
      - name: State library against the S3 emulator
        run: make test-integration

  e2e-gate:
    needs: [changes, toolbox, verify-e2e, toolbox-podman, toolbox-selinux, toolbox-pull-equivalence, e2e-k3d,
      worker-component]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Every selected job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          TOOLBOX: ${{ needs.toolbox.result }}
          VERIFY_E2E: ${{ needs.verify-e2e.result }}
          TOOLBOX_PODMAN: ${{ needs.toolbox-podman.result }}
          TOOLBOX_SELINUX: ${{ needs.toolbox-selinux.result }}
          PULL_EQUIVALENCE: ${{ needs.toolbox-pull-equivalence.result }}
          E2E_K3D: ${{ needs.e2e-k3d.result }}
          WORKER: ${{ needs.worker-component.result }}
        run: |
          echo "changes=$CHANGES toolbox=$TOOLBOX verify-e2e=$VERIFY_E2E toolbox-podman=$TOOLBOX_PODMAN"
          echo "toolbox-selinux=$TOOLBOX_SELINUX toolbox-pull-equivalence=$PULL_EQUIVALENCE e2e-k3d=$E2E_K3D"
          echo "worker-component=$WORKER"
          [ "$CHANGES" = success ] || exit 1
          for r in "$TOOLBOX" "$VERIFY_E2E" "$TOOLBOX_PODMAN" "$TOOLBOX_SELINUX" "$PULL_EQUIVALENCE" "$E2E_K3D" "$WORKER"; do
            case $r in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

      - name: Write the scheduled-run marker
        if: github.event_name == 'schedule'
        run: mkdir -p .cache/e2e-scheduled && echo "${GITHUB_SHA}" > .cache/e2e-scheduled/ok

      # Saved by the post step only when this job succeeds, so only a passing scheduled run marks the commit.
      - name: Record that this commit passed a scheduled run
        if: github.event_name == 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/e2e-scheduled
          key: e2e-scheduled-ok-${{ github.sha }}
