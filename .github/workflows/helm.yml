name: helm

on:
  push:
    branches: ["**"]
    paths:
      - "charts/**"
      - ".github/ci/**"
      - ".github/workflows/helm.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: charts/strange-company
  HELM_VERSION: v3.21.4
  HELM_UNITTEST_VERSION: "1.1.2"
  KUBECONFORM_VERSION: v0.8.0
  K3D_VERSION: v5.9.0
  K3S_IMAGE: rancher/k3s:v1.34.10-k3s1
  KUBERNETES_VERSION: "1.34.0"
  NS: strange-company
  RELEASE: strange-company
  # fullname helper collapses when release name contains the chart name
  FULLNAME: strange-company

jobs:
  lint:
    name: static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          if [ ! -f "$CHART/Chart.lock" ]; then
            echo "::warning::Chart.lock absent - generating it. Commit the uploaded artifact."
            helm dependency update "$CHART"
          fi
          helm dependency build "$CHART"
          echo "--- Chart.lock ---"
          cat "$CHART/Chart.lock"

      - name: Upload Chart.lock
        uses: actions/upload-artifact@v4
        with:
          name: chart-lock
          path: ${{ env.CHART }}/Chart.lock
          if-no-files-found: error

      - name: Detect dependency drift
        run: |
          set -euo pipefail
          # helm dependency build fails outright on a stale lock; this catches the
          # case where the lock was regenerated in-place by the bootstrap above.
          if ! git diff --quiet -- "$CHART/Chart.lock"; then
            echo "::error::Chart.lock does not match Chart.yaml. Commit the regenerated lock."
            git --no-pager diff -- "$CHART/Chart.lock"
            exit 1
          fi

      - name: helm lint (default values)
        run: helm lint "$CHART"

      - name: helm lint (all fixtures)
        run: |
          set -euo pipefail
          for f in "$CHART"/ci/values-*.yaml; do
            echo "::group::helm lint $f"
            helm lint "$CHART" -f "$f"
            echo "::endgroup::"
          done

      - name: Schema rejects materially invalid configuration
        run: |
          set -euo pipefail
          fail=0
          for f in "$CHART"/tests/invalid-values/*.yaml; do
            if helm template "$RELEASE" "$CHART" -n "$NS" -f "$f" >/dev/null 2>&1; then
              echo "::error::values.schema.json accepted invalid values: $f"
              fail=1
            else
              echo "rejected as expected: $(basename "$f")"
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Render and schema-validate every fixture
        run: |
          set -euo pipefail
          SCHEMA='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json'
          for f in "$CHART"/ci/values-*.yaml; do
            echo "::group::render $(basename "$f")"
            helm template "$RELEASE" "$CHART" -n "$NS" -f "$f" \
              | tee "/tmp/$(basename "$f" .yaml).rendered.yaml" \
              | kubeconform -strict -summary \
                  -kubernetes-version "$KUBERNETES_VERSION" \
                  -schema-location default \
                  -schema-location "$SCHEMA"
            echo "::endgroup::"
          done

      - name: Assert no chart-owned workload runs privileged or as root
        run: |
          set -euo pipefail
          for f in /tmp/*.rendered.yaml; do
            if grep -nE 'privileged: true|hostNetwork: true|hostPath:' "$f"; then
              echo "::error::security baseline violated in $f"
              exit 1
            fi
          done
          echo "security baseline OK"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/*.rendered.yaml

  unit:
    name: helm unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" \
            || helm plugin install https://github.com/helm-unittest/helm-unittest --version "v${HELM_UNITTEST_VERSION}"
          helm unittest --help >/dev/null

      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      - name: helm unittest
        run: helm unittest --strict --color "$CHART"

  integration:
    name: k3s integration and lifecycle
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install k3d
        run: |
          set -euo pipefail
          # Retried because this is a network fetch of a third-party script,
          # and a connection reset here reddens a pull request that has
          # nothing wrong with it. Same distinction the attempt ledger draws
          # in 12.1: an infrastructure failure is not a failed test.
          for attempt in 1 2 3 4 5; do
            # Both fetch and run are guarded by `if`: under `set -e` an
            # AND-list whose left side fails aborts the script, so
            # `install && exit 0` would exit on the first failure instead of
            # retrying -- the opposite of what this loop is for.
            if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --connect-timeout 10 \
                 "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
                 -o /tmp/k3d-install.sh; then
              if TAG="${K3D_VERSION}" bash /tmp/k3d-install.sh; then
                exit 0
              fi
            fi
            echo "k3d install attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not install k3d after 5 attempts"
          exit 1
          k3d version

      - name: Create K3s cluster
        run: |
          set -euo pipefail
          k3d cluster create strange-company-ci \
            --image "$K3S_IMAGE" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait --timeout 300s
          kubectl cluster-info
          kubectl get storageclass

      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      - name: Install (batteries included)
        run: |
          set -euo pipefail
          helm install "$RELEASE" "$CHART" \
            -n "$NS" --create-namespace \
            -f "$CHART/ci/values-batteries.yaml" \
            --wait --timeout 20m

      - name: Wait for readiness
        run: |
          set -euo pipefail
          kubectl -n "$NS" rollout status statefulset --timeout=300s --selector=app.kubernetes.io/instance="$RELEASE" || true
          kubectl -n "$NS" wait --for=condition=Available deployment --all --timeout=300s
          kubectl -n "$NS" wait --for=condition=Ready pod --all --timeout=300s
          kubectl -n "$NS" get all

      - name: Assert services have endpoints
        run: |
          set -euo pipefail
          for svc in "$FULLNAME-postgresql" "$FULLNAME-hermes" "$FULLNAME-control-plane" "$RELEASE-vikunja"; do
            echo "--- $svc ---"
            kubectl -n "$NS" get endpoints "$svc" -o yaml
            n=$(kubectl -n "$NS" get endpoints "$svc" -o jsonpath='{.subsets[*].addresses[*].ip}' | wc -w)
            [ "$n" -ge 1 ] || { echo "::error::$svc has no endpoints"; exit 1; }
          done

      - name: Database integration check
        run: |
          set -euo pipefail
          POD="$FULLNAME-postgresql-0"
          kubectl -n "$NS" exec "$POD" -- pg_isready -U strange-company
          echo "--- databases ---"
          kubectl -n "$NS" exec "$POD" -- psql -U strange-company -d strange-company -tAc "SELECT datname FROM pg_database ORDER BY 1" | tee /tmp/dbs.txt
          grep -qx "strange-company" /tmp/dbs.txt || { echo "::error::strange-company database missing"; exit 1; }
          grep -qx "vikunja" /tmp/dbs.txt || { echo "::error::vikunja database missing"; exit 1; }

      - name: Assert bundled Vikunja actually used the bundled database
        run: |
          set -euo pipefail
          POD="$FULLNAME-postgresql-0"
          # Vikunja migrates its schema on first start. Tables in the bundled
          # server prove it connected here, not merely that the pod is up.
          for i in $(seq 1 30); do
            n=$(kubectl -n "$NS" exec "$POD" -- psql -U strange-company -d vikunja -tAc \
                  "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tr -d '[:space:]')
            [ "${n:-0}" -gt 0 ] && break
            sleep 5
          done
          [ "${n:-0}" -gt 0 ] || { echo "::error::Vikunja created no tables in the bundled database"; exit 1; }
          echo "bundled Vikunja is using the bundled PostgreSQL ($n tables)"

      - name: helm test
        run: helm test "$RELEASE" -n "$NS" --logs --timeout 5m

      - name: Capture pre-upgrade state
        id: pre
        run: |
          set -euo pipefail
          echo "pgpass=$(kubectl -n "$NS" get secret "$FULLNAME-postgresql" -o jsonpath='{.data.password}')" >> "$GITHUB_OUTPUT"
          echo "pvcuid=$(kubectl -n "$NS" get pvc -l app.kubernetes.io/component=postgresql -o jsonpath='{.items[0].metadata.uid}')" >> "$GITHUB_OUTPUT"

      - name: Upgrade with a real value change
        run: |
          set -euo pipefail
          helm upgrade "$RELEASE" "$CHART" \
            -n "$NS" \
            -f "$CHART/ci/values-batteries.yaml" \
            --set controlPlane.replicas=2 \
            --wait --timeout 10m

      - name: Verify upgrade took effect and nothing rotated
        run: |
          set -euo pipefail
          replicas=$(kubectl -n "$NS" get deployment "$FULLNAME-control-plane" -o jsonpath='{.spec.replicas}')
          [ "$replicas" = "2" ] || { echo "::error::expected 2 replicas, got $replicas"; exit 1; }
          kubectl -n "$NS" wait --for=condition=Available deployment "$FULLNAME-control-plane" --timeout=180s

          post_pass=$(kubectl -n "$NS" get secret "$FULLNAME-postgresql" -o jsonpath='{.data.password}')
          [ "$post_pass" = "${{ steps.pre.outputs.pgpass }}" ] || { echo "::error::postgresql password rotated on upgrade"; exit 1; }

          post_uid=$(kubectl -n "$NS" get pvc -l app.kubernetes.io/component=postgresql -o jsonpath='{.items[0].metadata.uid}')
          [ "$post_uid" = "${{ steps.pre.outputs.pvcuid }}" ] || { echo "::error::postgresql PVC was replaced on upgrade"; exit 1; }

          kubectl -n "$NS" exec "$FULLNAME-postgresql-0" -- pg_isready -U strange-company
          echo "upgrade safe: replicas changed, credentials and storage intact"

      - name: Uninstall
        run: |
          set -euo pipefail
          helm uninstall "$RELEASE" -n "$NS" --wait --timeout 5m
          sleep 10
          echo "--- anything left in the namespace ---"
          kubectl -n "$NS" get all || true
          # Chart-owned workloads and services must be gone. The helm test pod
          # is a hook, not part of the release manifest, so it is not counted.
          left=$(kubectl -n "$NS" get deploy,statefulset,svc \
                   -l app.kubernetes.io/instance="$RELEASE" -o name | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::$left chart-owned resources survived uninstall"
            kubectl -n "$NS" get deploy,statefulset,svc -l app.kubernetes.io/instance="$RELEASE"
            exit 1
          fi
          echo "uninstall clean: no chart-owned workloads or services remain"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all -o wide || true
          kubectl -n "$NS" get pvc,secret,configmap || true
          kubectl -n "$NS" describe pods || true
          for p in $(kubectl -n "$NS" get pods -o name); do
            echo "::group::logs $p"
            kubectl -n "$NS" logs "$p" --all-containers --tail=200 || true
            kubectl -n "$NS" logs "$p" --all-containers --previous --tail=100 || true
            echo "::endgroup::"
          done
          kubectl -n "$NS" get events --sort-by=.lastTimestamp || true

      - name: Delete cluster
        if: always()
        run: k3d cluster delete strange-company-ci || true

  integration-hybrid:
    name: hybrid B against an external database
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install k3d
        run: |
          set -euo pipefail
          # Retried because this is a network fetch of a third-party script,
          # and a connection reset here reddens a pull request that has
          # nothing wrong with it. Same distinction the attempt ledger draws
          # in 12.1: an infrastructure failure is not a failed test.
          for attempt in 1 2 3 4 5; do
            # Both fetch and run are guarded by `if`: under `set -e` an
            # AND-list whose left side fails aborts the script, so
            # `install && exit 0` would exit on the first failure instead of
            # retrying -- the opposite of what this loop is for.
            if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --connect-timeout 10 \
                 "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
                 -o /tmp/k3d-install.sh; then
              if TAG="${K3D_VERSION}" bash /tmp/k3d-install.sh; then
                exit 0
              fi
            fi
            echo "k3d install attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not install k3d after 5 attempts"
          exit 1

      - name: Create K3s cluster
        run: |
          set -euo pipefail
          k3d cluster create strange-company-hybrid \
            --image "$K3S_IMAGE" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait --timeout 300s

      - name: Deploy a PostgreSQL this chart does not own
        run: |
          set -euo pipefail
          kubectl apply -f .github/ci/external-postgres.yaml
          kubectl -n external-deps rollout status statefulset/external-postgres --timeout=300s
          kubectl -n external-deps exec external-postgres-0 -- \
            psql -U strange-company -d strange-company -tAc "SELECT datname FROM pg_database ORDER BY 1"

      - name: Mirror the external credentials into the release namespace
        run: |
          set -euo pipefail
          kubectl create namespace "$NS"
          kubectl -n "$NS" create secret generic external-postgres \
            --from-literal=username=strange-company \
            --from-literal=password=ci-external-password

      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      - name: Install hybrid B
        run: |
          set -euo pipefail
          helm install "$RELEASE" "$CHART" \
            -n "$NS" \
            -f "$CHART/ci/values-hybrid-b.yaml" \
            --wait --timeout 20m

      - name: Assert no chart-owned PostgreSQL exists
        run: |
          set -euo pipefail
          if kubectl -n "$NS" get statefulset "$FULLNAME-postgresql" 2>/dev/null; then
            echo "::error::external mode still rendered a bundled PostgreSQL"; exit 1
          fi
          echo "no bundled PostgreSQL, as expected"

      - name: Assert bundled Vikunja actually used the external database
        run: |
          set -euo pipefail
          kubectl -n "$NS" wait --for=condition=Available deployment --all --timeout=300s
          # Vikunja creates its schema on first start; its tables must appear in
          # the external server, not in any chart-owned one.
          kubectl -n external-deps exec external-postgres-0 -- \
            psql -U strange-company -d vikunja -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tee /tmp/tables.txt
          n=$(tr -d '[:space:]' < /tmp/tables.txt)
          [ "$n" -gt 0 ] || { echo "::error::Vikunja created no tables in the external database"; exit 1; }
          echo "bundled Vikunja is using the external PostgreSQL ($n tables)"

      - name: Assert Hermes runs without a PVC
        run: |
          set -euo pipefail
          if kubectl -n "$NS" get pvc "$FULLNAME-hermes" 2>/dev/null; then
            echo "::error::hermes PVC rendered despite persistence being disabled"; exit 1
          fi
          kubectl -n "$NS" get deployment "$FULLNAME-hermes" \
            -o jsonpath='{.spec.template.spec.volumes[0].emptyDir}' | grep -q '{}'
          echo "hermes is running on ephemeral storage"

      - name: helm test
        run: helm test "$RELEASE" -n "$NS" --logs --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all -o wide || true
          kubectl -n external-deps get all -o wide || true
          kubectl -n "$NS" describe pods || true
          for p in $(kubectl -n "$NS" get pods -o name); do
            echo "::group::logs $p"
            kubectl -n "$NS" logs "$p" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
          kubectl -n "$NS" get events --sort-by=.lastTimestamp || true

      - name: Delete cluster
        if: always()
        run: k3d cluster delete strange-company-hybrid || true

  integration-hermes-managed:
    name: hermes managed scope outranks the container environment
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install k3d
        run: |
          set -euo pipefail
          # Retried because this is a network fetch of a third-party script,
          # and a connection reset here reddens a pull request that has
          # nothing wrong with it. Same distinction the attempt ledger draws
          # in 12.1: an infrastructure failure is not a failed test.
          for attempt in 1 2 3 4 5; do
            # Both fetch and run are guarded by `if`: under `set -e` an
            # AND-list whose left side fails aborts the script, so
            # `install && exit 0` would exit on the first failure instead of
            # retrying -- the opposite of what this loop is for.
            if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --connect-timeout 10 \
                 "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
                 -o /tmp/k3d-install.sh; then
              if TAG="${K3D_VERSION}" bash /tmp/k3d-install.sh; then
                exit 0
              fi
            fi
            echo "k3d install attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not install k3d after 5 attempts"
          exit 1

      - name: Create K3s cluster
        run: |
          set -euo pipefail
          k3d cluster create strange-company-hermes-managed \
            --image "$K3S_IMAGE" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait --timeout 300s

      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      # spec: docs/specs/hermes-managed-scope.md. The same variable is set two
      # ways: hermes.env is the container-environment tier the chart has
      # always had; hermes.managed.env is the new pinned tier that must win.
      # This is the only test in this workflow that proves the precedence
      # claim rather than restating a reading of upstream source -- see the
      # exec-based assertion below.
      #
      # Also covers docs/specs/single-source-credentials.md's behaviour
      # criterion: a `credentials` entry plus a `fromCredentials` mapping for
      # it, installed in the same release. sc-ci-probe-credentials is chosen
      # to collide with nothing this chart owns (Rule 3).
      - name: Install with a container env value, a conflicting managed-scope pin, and a credentials entry pinned via fromCredentials
        run: |
          set -euo pipefail
          helm install "$RELEASE" "$CHART" \
            -n "$NS" --create-namespace \
            -f "$CHART/ci/values-batteries.yaml" \
            --set hermes.env.HERMES_MANAGED_PROBE=from-container-env \
            --set hermes.managed.enabled=true \
            --set hermes.managed.env.HERMES_MANAGED_PROBE=from-managed-scope \
            --set credentials.sc-ci-probe-credentials.probe-key=integration-secret-value \
            --set hermes.managed.fromCredentials.HERMES_CREDENTIAL_PROBE=sc-ci-probe-credentials.probe-key \
            --wait --timeout 20m

      - name: Assert the managed Secret exists and is wired at HERMES_MANAGED_DIR
        run: |
          set -euo pipefail
          managed_dir=$(kubectl -n "$NS" get deployment "$FULLNAME-hermes" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="HERMES_MANAGED_DIR")].value}')
          [ "$managed_dir" = "/etc/hermes-managed" ] || {
            echo "::error::HERMES_MANAGED_DIR is '$managed_dir', not /etc/hermes-managed"
            exit 1
          }
          kubectl -n "$NS" get secret "$FULLNAME-hermes-managed" -o jsonpath='{.data}' | grep -q '\.env'
          echo "managed Secret exists and HERMES_MANAGED_DIR points at the mount"

      # spec: docs/specs/single-source-credentials.md. Both halves of a
      # `credentials` entry referenced via `fromCredentials` come from one
      # values entry -- assert the provider Secret side of it here; the
      # resolved-env-var side is asserted in the exec-based step below.
      - name: Assert the credentials Secret exists with the expected key
        run: |
          set -euo pipefail
          val=$(kubectl -n "$NS" get secret sc-ci-probe-credentials -o jsonpath='{.data.probe-key}' | base64 -d)
          [ "$val" = "integration-secret-value" ] || {
            echo "::error::sc-ci-probe-credentials/probe-key is '$val', not integration-secret-value"
            exit 1
          }
          echo "credentials Secret exists with the expected key"

      # spec: docs/specs/policy-selected-models.md, "Chart". The control
      # plane reads a provider credential from
      # <CREDENTIALS_DIR>/<secret>/<key> (control-plane/internal/credentials.
      # Dir.Read), so the projected volume must lay files out one
      # subdirectory per Secret, not flat -- a plain `secret:` volume would
      # render a perfectly valid Deployment that mounts fine and makes every
      # credential unreadable at runtime. So this proves the rendered volume
      # by actually reading a file back through it, not by reading the spec.
      #
      # Neither the fixture control-plane image used in this job
      # (traefik/whoami, per ci/values-batteries.yaml) nor the real one
      # (gcr.io/distroless/static-debian12, per control-plane/Dockerfile) has
      # a shell to `kubectl exec cat` into -- distroless by design, and
      # traefik/whoami is a single static binary on scratch. So this copies
      # the EXACT `volumes`/`volumeMounts` entries the chart rendered for
      # "credentials" onto a throwaway busybox pod -- same Secret, same
      # projected `items[].path` prefixes, same mount path -- and reads the
      # file through them there. Only the container image differs from what
      # the control plane itself runs; the volume definition under test is
      # the real one, copied verbatim from the live Deployment.
      - name: Assert the rendered credentials volume actually places the Secret's key at <mount>/<secret>/<key>
        run: |
          set -euo pipefail

          cred_dir=$(kubectl -n "$NS" get deployment "$FULLNAME-control-plane" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="control-plane")].env[?(@.name=="CREDENTIALS_DIR")].value}')
          [ "$cred_dir" = "/credentials" ] || {
            echo "::error::CREDENTIALS_DIR is '$cred_dir', not /credentials"
            exit 1
          }

          deploy_json=$(kubectl -n "$NS" get deployment "$FULLNAME-control-plane" -o json)
          volume=$(echo "$deploy_json" | jq -c '.spec.template.spec.volumes[] | select(.name=="credentials")')
          mount=$(echo "$deploy_json" | jq -c '.spec.template.spec.containers[] | select(.name=="control-plane") | .volumeMounts[] | select(.name=="credentials")')
          [ -n "$volume" ] || { echo "::error::no 'credentials' volume rendered on the control-plane Deployment"; exit 1; }
          [ -n "$mount" ] || { echo "::error::no 'credentials' volumeMount rendered on the control-plane container"; exit 1; }
          echo "rendered volume: $volume"
          echo "rendered mount: $mount"

          jq -n --argjson volume "$volume" --argjson mount "$mount" '{
            apiVersion: "v1",
            kind: "Pod",
            metadata: {name: "credentials-layout-probe"},
            spec: {
              restartPolicy: "Never",
              containers: [{
                name: "probe",
                image: "busybox:1.37.0",
                command: ["cat", ($mount.mountPath + "/sc-ci-probe-credentials/probe-key")],
                volumeMounts: [$mount]
              }],
              volumes: [$volume]
            }
          }' | tee /tmp/credentials-layout-probe.json | kubectl -n "$NS" apply -f -

          phase=""
          for i in $(seq 1 30); do
            phase=$(kubectl -n "$NS" get pod credentials-layout-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ]; then
              break
            fi
            sleep 2
          done

          result=$(kubectl -n "$NS" logs pod/credentials-layout-probe 2>/dev/null || true)
          if [ "$phase" != "Succeeded" ] || [ "$result" != "integration-secret-value" ]; then
            echo "::error::expected to read 'integration-secret-value' via the rendered volume, got phase='$phase' output='$result'"
            kubectl -n "$NS" describe pod/credentials-layout-probe || true
            exit 1
          fi
          echo "the rendered credentials volume places sc-ci-probe-credentials/probe-key at $cred_dir/sc-ci-probe-credentials/probe-key and it reads back correctly"

          kubectl -n "$NS" delete pod credentials-layout-probe --ignore-not-found

      # `kubectl exec ... env` cannot answer this. hermes_cli merges its tiers
      # into its own process's os.environ at startup, and neither a freshly
      # exec'd shell nor /proc/<pid>/environ (a snapshot taken at exec time)
      # can see that merge. So run Hermes's own public loader,
      # hermes_cli.env_loader.load_hermes_dotenv(), in a fresh interpreter in
      # the pod and read back what it resolved. That function ends by calling
      # _apply_managed_env() -> managed_scope.get_managed_dir(), so this
      # exercises the chart's actual wiring -- the HERMES_MANAGED_DIR value,
      # the mount path, the `.env` filename and upstream's own precedence --
      # rather than a reading of it. Calling a private helper with a path this
      # step constructed itself would bypass exactly the resolution under test.
      - name: Assert Hermes itself resolves the managed value and the fromCredentials pin
        run: |
          set -euo pipefail
          POD=$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=hermes -o jsonpath='{.items[0].metadata.name}')

          # The `hermes` entrypoint in this image is a shell script, not a
          # Python console-script, so its shebang is /bin/sh and says nothing
          # about the interpreter. Ask instead which candidate can import
          # hermes_cli -- that is the only property this step needs, and a
          # wrong guess fails here with the list rather than as a syntax error
          # further down.
          PYBIN=$(kubectl -n "$NS" exec "$POD" -c hermes -- sh -c '
            for p in /opt/hermes/bin/python3 /opt/hermes/bin/python \
                     "$(command -v python3 || true)" "$(command -v python || true)"; do
              [ -n "$p" ] && [ -x "$p" ] || continue
              if "$p" -c "import hermes_cli" >/dev/null 2>&1; then echo "$p"; exit 0; fi
            done
            echo "no interpreter on this image could import hermes_cli" >&2
            exit 1
          ')
          echo "python interpreter: $PYBIN"

          resolved=$(kubectl -n "$NS" exec -i "$POD" -c hermes -- sh -c "$PYBIN -" <<'PYEOF'
          import os, sys
          from hermes_cli.env_loader import load_hermes_dotenv

          print(f"HERMES_MANAGED_DIR={os.environ.get('HERMES_MANAGED_DIR')!r}", file=sys.stderr)
          print(f"before_probe={os.environ.get('HERMES_MANAGED_PROBE')!r}", file=sys.stderr)
          print(f"before_cred={os.environ.get('HERMES_CREDENTIAL_PROBE')!r}", file=sys.stderr)
          load_hermes_dotenv()
          after_probe = os.environ.get("HERMES_MANAGED_PROBE")
          after_cred = os.environ.get("HERMES_CREDENTIAL_PROBE")
          print(f"after_probe={after_probe!r}", file=sys.stderr)
          print(f"after_cred={after_cred!r}", file=sys.stderr)
          print(f"{after_probe or ''}|{after_cred or ''}")
          PYEOF
          )
          echo "resolved HERMES_MANAGED_PROBE|HERMES_CREDENTIAL_PROBE = $resolved"
          resolved_probe="${resolved%%|*}"
          resolved_cred="${resolved#*|}"
          [ "$resolved_probe" = "from-managed-scope" ] || {
            echo "::error::expected the managed scope to win (from-managed-scope), got '$resolved_probe'"
            exit 1
          }
          echo "managed scope correctly overrides the container environment"
          # spec: docs/specs/single-source-credentials.md. Same literal that
          # went into the credentials Secret above, now resolved through
          # fromCredentials -- both halves came from one values entry.
          [ "$resolved_cred" = "integration-secret-value" ] || {
            echo "::error::expected fromCredentials to resolve to integration-secret-value, got '$resolved_cred'"
            exit 1
          }
          echo "fromCredentials correctly pinned the credentials Secret's value"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=hermes --all-containers --tail=200 || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp || true

      - name: Delete cluster
        if: always()
        run: k3d cluster delete strange-company-hermes-managed || true

  integration-real-control-plane:
    name: chart with the real control-plane image
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install k3d
        run: |
          set -euo pipefail
          # Retried because this is a network fetch of a third-party script,
          # and a connection reset here reddens a pull request that has
          # nothing wrong with it. Same distinction the attempt ledger draws
          # in 12.1: an infrastructure failure is not a failed test.
          for attempt in 1 2 3 4 5; do
            # Both fetch and run are guarded by `if`: under `set -e` an
            # AND-list whose left side fails aborts the script, so
            # `install && exit 0` would exit on the first failure instead of
            # retrying -- the opposite of what this loop is for.
            if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --connect-timeout 10 \
                 "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
                 -o /tmp/k3d-install.sh; then
              if TAG="${K3D_VERSION}" bash /tmp/k3d-install.sh; then
                exit 0
              fi
            fi
            echo "k3d install attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not install k3d after 5 attempts"
          exit 1

      - name: Build the control-plane image
        run: docker build -t strange-company-control-plane:ci --build-arg VERSION=ci control-plane

      - name: Create K3s cluster
        run: |
          set -euo pipefail
          k3d cluster create strange-company-cp \
            --image "$K3S_IMAGE" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait --timeout 300s

      - name: Import the image into the cluster
        # Imported rather than pushed, so this proves the chart and the image
        # work together on a branch without publishing a package for every commit.
        #
        # The import is verified rather than assumed: it has silently not landed
        # before, and with pullPolicy=Never that surfaces 20 minutes later as an
        # opaque ErrImageNeverPull instead of a clear failure here.
        run: |
          set -euo pipefail
          node="k3d-strange-company-cp-server-0"
          for attempt in 1 2 3; do
            k3d image import strange-company-control-plane:ci -c strange-company-cp || true
            if docker exec "$node" crictl images 2>/dev/null | grep -q "strange-company-control-plane"; then
              echo "image present in the node's container runtime (attempt $attempt)"
              docker exec "$node" crictl images | grep strange-company-control-plane
              exit 0
            fi
            echo "::warning::image not visible after import attempt $attempt, retrying"
            sleep 10
          done
          echo "::error::the control-plane image never became visible to the kubelet"
          docker exec "$node" crictl images || true
          exit 1

      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      - name: Install with the real control plane
        run: |
          set -euo pipefail
          helm install "$RELEASE" "$CHART" \
            -n "$NS" --create-namespace \
            -f "$CHART/ci/values-batteries.yaml" \
            --set controlPlane.image.repository=strange-company-control-plane \
            --set controlPlane.image.tag=ci \
            --set controlPlane.image.pullPolicy=Never \
            --set-json 'controlPlane.args=[]' \
            --wait --timeout 20m

      - name: Readiness must mean real dependency connectivity
        run: |
          set -euo pipefail
          kubectl -n "$NS" wait --for=condition=Available deployment --all --timeout=300s

          # A 200 here is a stronger claim than the whoami fixture ever made:
          # the control plane only reports ready once it has actually reached
          # PostgreSQL, Vikunja and the Hermes gateway.
          kubectl -n "$NS" run readyprobe --rm -i --restart=Never --image=busybox:1.37.0 -- \
            wget -q -O- "http://$FULLNAME-control-plane:8080/readyz" | tee /tmp/readyz.json
          grep -q '"ready":true' /tmp/readyz.json || { echo "::error::control plane is not ready"; exit 1; }
          for dep in postgres vikunja hermes-gateway; do
            grep -q "\"name\":\"$dep\"" /tmp/readyz.json || { echo "::error::$dep missing from readiness report"; exit 1; }
          done

      - name: The control plane must provision its own Vikunja token
        run: |
          set -euo pipefail
          # The supervisor retries until Vikunja is up, so this waits rather
          # than sampling once.
          ok=""
          for i in $(seq 1 36); do
            if kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=500 2>/dev/null \
                 | grep -qE '"msg":"(bootstrapped a Vikunja API token|using the supplied Vikunja token)"'; then
              ok=yes; break
            fi
            sleep 10
          done
          [ -n "$ok" ] || {
            echo "::error::the control plane never provisioned a Vikunja API token"
            kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=100 || true
            exit 1
          }
          echo "the control plane minted and stored its own Vikunja token"

      - name: The control plane must have built its Kanban board
        run: |
          set -euo pipefail
          # Proves EnsureBoard against real Vikunja: the project, its Kanban view
          # and all seven state buckets. Non-fatal in the app by design, so it is
          # asserted here rather than assumed.
          ok=""
          for i in $(seq 1 30); do
            if kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=500 2>/dev/null \
                 | grep -q '"msg":"vikunja board ready"'; then ok=yes; break; fi
            sleep 10
          done
          kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=50 || true
          [ -n "$ok" ] || { echo "::error::the control plane never reported a ready Vikunja board"; exit 1; }
          kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=500 \
            | grep -o '"msg":"vikunja board ready"[^}]*' | head -1
          echo "board built against real Vikunja"

      - name: The config endpoint must not leak secrets
        run: |
          set -euo pipefail
          kubectl -n "$NS" run confprobe --rm -i --restart=Never --image=busybox:1.37.0 -- \
            wget -q -O- "http://$FULLNAME-control-plane:8080/config" | tee /tmp/config.json
          pw=$(kubectl -n "$NS" get secret "$FULLNAME-postgresql" -o jsonpath='{.data.password}' | base64 -d)
          if grep -qF "$pw" /tmp/config.json; then
            echo "::error::/config leaked the database password"; exit 1
          fi
          echo "/config is redacted"

      - name: helm test
        run: helm test "$RELEASE" -n "$NS" --logs --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=control-plane --tail=200 || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp || true

      - name: Delete cluster
        if: always()
        run: k3d cluster delete strange-company-cp || true

  package:
    name: package and install the tarball
    runs-on: ubuntu-latest
    needs: [integration, integration-hybrid]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install k3d
        run: |
          set -euo pipefail
          # Retried because this is a network fetch of a third-party script,
          # and a connection reset here reddens a pull request that has
          # nothing wrong with it. Same distinction the attempt ledger draws
          # in 12.1: an infrastructure failure is not a failed test.
          for attempt in 1 2 3 4 5; do
            # Both fetch and run are guarded by `if`: under `set -e` an
            # AND-list whose left side fails aborts the script, so
            # `install && exit 0` would exit on the first failure instead of
            # retrying -- the opposite of what this loop is for.
            if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --connect-timeout 10 \
                 "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
                 -o /tmp/k3d-install.sh; then
              if TAG="${K3D_VERSION}" bash /tmp/k3d-install.sh; then
                exit 0
              fi
            fi
            echo "k3d install attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not install k3d after 5 attempts"
          exit 1

      - name: Resolve dependencies and package
        run: |
          set -euo pipefail
          helm dependency build "$CHART"
          helm package "$CHART" -d /tmp/dist
          ls -la /tmp/dist
          echo "TGZ=$(ls /tmp/dist/strange-company-*.tgz)" >> "$GITHUB_ENV"

      - name: Render the packaged chart in external mode
        run: |
          set -euo pipefail
          helm template "$RELEASE" "$TGZ" -n "$NS" -f "$CHART/ci/values-external.yaml" > /tmp/tgz-external.yaml
          test -s /tmp/tgz-external.yaml
          grep -q "kind: Deployment" /tmp/tgz-external.yaml

      - name: Install the packaged tarball into a fresh K3s cluster
        run: |
          set -euo pipefail
          k3d cluster create strange-company-pkg \
            --image "$K3S_IMAGE" \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --wait --timeout 300s
          helm install "$RELEASE" "$TGZ" \
            -n "$NS" --create-namespace \
            -f "$CHART/ci/values-batteries.yaml" \
            --wait --timeout 20m
          kubectl -n "$NS" wait --for=condition=Available deployment --all --timeout=300s
          helm test "$RELEASE" -n "$NS" --logs --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all -o wide || true
          kubectl -n "$NS" describe pods || true

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: strange-company-chart
          path: /tmp/dist/*.tgz

      - name: Delete cluster
        if: always()
        run: k3d cluster delete strange-company-pkg || true
