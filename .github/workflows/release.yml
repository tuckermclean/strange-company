name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to package and push
        required: true

permissions:
  contents: read
  packages: write

env:
  CHART: charts/strange-company
  HELM_VERSION: v3.21.4
  OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    name: package and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify the tag matches the chart version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart=$(helm show chart "$CHART" | awk '/^version:/ {print $2}')
          if [ "$tag" != "$chart" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Chart.yaml version $chart"
            exit 1
          fi
          echo "releasing $chart"

      # A chart whose appVersion names an image that was never built installs
      # into ImagePullBackOff, and the failure surfaces in the operator's
      # cluster rather than here. The image is built by control-plane.yml on
      # the same tag; this is the check that the two actually agree.
      - name: Resolve dependencies
        run: helm dependency build "$CHART"

      - name: Package
        run: |
          set -euo pipefail
          helm package "$CHART" -d dist
          ls -la dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify the control-plane image exists for this appVersion
        run: |
          set -euo pipefail
          appversion=$(helm show chart "$CHART" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')
          image="ghcr.io/${{ github.repository_owner }}/strange-company-control-plane:${appversion}"

          # The image job runs in parallel with this one, so wait rather than
          # racing it. Ten minutes is well past a normal Go build and push.
          deadline=$(( $(date +%s) + 600 ))
          until docker manifest inspect "$image" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$image was never published; the chart would install into ImagePullBackOff"
              exit 1
            fi
            echo "waiting for $image ..."
            sleep 20
          done
          echo "$image is published"

      # The chart's default runnerImage.tag follows appVersion too, so the
      # runner needs the same check: a chart that installs cleanly and then
      # cannot start a coding Job has failed later and less legibly than one
      # that never shipped.
      - name: Verify the runner image exists for this appVersion
        run: |
          set -euo pipefail
          appversion=$(helm show chart "$CHART" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')
          image="ghcr.io/${{ github.repository_owner }}/strange-company-runner:${appversion}"

          deadline=$(( $(date +%s) + 900 ))
          until docker manifest inspect "$image" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$image was never published; coding Jobs would fail to pull"
              exit 1
            fi
            echo "waiting for $image ..."
            sleep 20
          done
          echo "$image is published"

      - name: Push
        run: |
          set -euo pipefail
          for tgz in dist/*.tgz; do
            helm push "$tgz" "$OCI_REGISTRY"
          done

      - name: Verify the published artifact is consumable
        run: |
          set -euo pipefail
          version=$(helm show chart "$CHART" | awk '/^version:/ {print $2}')
          helm show chart "${OCI_REGISTRY}/strange-company" --version "$version"
          # Prove it renders straight from the registry, the way a consumer or a
          # parent chart would pull it.
          helm template strange-company "${OCI_REGISTRY}/strange-company" \
            --version "$version" \
            -f "$CHART/ci/values-external.yaml" > /tmp/from-oci.yaml
          test -s /tmp/from-oci.yaml
          echo "published and verified: ${OCI_REGISTRY}/strange-company:$version"

      - name: Verify a parent chart can consume it as a dependency
        run: |
          set -euo pipefail
          version=$(helm show chart "$CHART" | awk '/^version:/ {print $2}')
          # Point the example parent at the version just published, then resolve
          # it the way a real consumer would.
          sed -i "s|version: \".*\"|version: \"$version\"|" examples/parent-chart/Chart.yaml
          helm dependency build examples/parent-chart
          ls -la examples/parent-chart/charts
          test -f "examples/parent-chart/charts/strange-company-$version.tgz"
          helm template acme examples/parent-chart > /tmp/parent.yaml
          grep -q "kind: Deployment" /tmp/parent.yaml
          echo "parent chart resolved and rendered strange-company $version from OCI"

      - uses: actions/upload-artifact@v4
        with:
          name: strange-company-release
          path: dist/*.tgz
