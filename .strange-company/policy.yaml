# Repository policy of this repository (plan 01 section 7.3; plan 22; ADR-0017).
# protectedPaths equals plan 01 section 13.2 (asserted by 01-AC-11).
apiVersion: strange.company/v1alpha1
kind: RepositoryPolicy
metadata:
  name: strange-company
spec:
  testPaths:
    - "**/*_test.go"
    - "test/integration/**"
    - "src/**/testdata/**"
  fixturePaths:
    - "test/fixtures/**"
    - "**/testdata/**"
  testInfraPaths:
    - "src/internal/testutil/**"
  stubPaths:
    - "src/**/*.go"
  protectedPaths:
    - "SPEC.md"
    - "PLAN.md"
    - "STATUS.md"
    - "LICENSE"
    - "AGENTS.md"
    - "**/AGENTS.md"
    - "CLAUDE.md"
    - "**/CLAUDE.md"
    - ".claude/**"
    - "**/.claude/**"
    - ".codex/**"
    - "**/.codex/**"
    - ".opencode/**"
    - "**/.opencode/**"
    - "CODEOWNERS"
    - "**/CODEOWNERS"
    - ".forgejo/**"
    - ".gitea/**"
    - ".gitmodules"
    - "**/*.sops.yaml"
    - ".strange-company/**"
    - ".woodpecker/**"
    - ".github/**"
    - ".sops.yaml"
    - ".gitattributes"
    - ".gitignore"
    - "Makefile"
    - "mk/**"
    - "bootstrap"
    - "bootstrap.env.example"
    - "contracts/**"
    - "policy/**"
    - "context/company/**"
    - "plans/**"
    - "procedures/**"
    - "adr/**"
    - "versions/**"
    - "toolbox/**"
    - "harnesses/**"
    - "forge/**"
    - "tools/stage0/**"
    - "infra/tofu/**"
    - "infra/catalog/**"
    - "infra/profiles/**"
    - "infra/bootstrap/**"
    - "infra/objstore/**"
    - "gitops/clusters/**"
    - "gitops/layers/**"
    - "gitops/components/**"
    - "gitops/profiles/**"
    - "gitops/platform/strange-company/generated/**"
    - "gitops/platform/admission/**"
    - "gitops/clusters/*/flux-system/**"
    - "secrets/**"
    - "security/**"
    - "src/.golangci.yaml"
    - "test/fixtures/secrets-scan/**"
    - "test/fixtures/age/**"
    - "test/contracts/**"
  protectedBranches:
    - "main"
    - "release/*"
  reservedBranchPrefixes:
    - "agent/"
    - "bootstrap/"
    - "renovate/"
    - "sc-verify/"
    - "release/"
  testProtection:
    existingTestModification: deny
  merge:
    elevatedPaths:
      - "src/internal/verify/**"
      - "src/internal/statemachine/**"
      - "src/internal/policy/**"
      - "src/cmd/sc-verify/**"
      - "src/cmd/sc-ci-config/**"
      - "src/internal/runner/**"
      - "src/cmd/agent-runner/**"
      - "src/internal/forge/**"
      - "src/cmd/sc-worker/**"
      - "src/internal/worker/**"
      - "src/internal/gateway/**"
      - "src/cmd/model-gateway/**"
      - "src/internal/ledger/**"
      - "src/internal/lint/**"
      - "src/cmd/sc-lint/**"
      - "src/internal/scrub/**"
      - "src/internal/gitops/**"
      - "src/cmd/sc-gitops/**"
      - "src/internal/jobs/**"
      - "src/cmd/egress-proxy/**"
      - "src/cmd/sc-release/**"
      - "src/cmd/sc-e2e/**"
      - "test/e2e/**"
