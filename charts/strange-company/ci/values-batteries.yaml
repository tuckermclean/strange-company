# All four components bundled. Small CI-sized resources, no ingress, and a
# fixture control plane so chart development does not depend on the real
# application image. No AI provider credentials anywhere.
postgresql:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

vikunja:
  enabled: true
  vikunja:
    persistence:
      data:
        enabled: true
        size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }

hermes:
  enabled: true
  # Persistence stays ON here so the integration job proves Hermes runs with a
  # PVC. values-hybrid-b.yaml proves it also runs without one.
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }

controlPlane:
  enabled: true
  image:
    repository: traefik/whoami
    tag: "v1.12.0"
  # whoami answers 200 on every path, which satisfies /healthz and /readyz.
  args: ["--port", "8080"]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
