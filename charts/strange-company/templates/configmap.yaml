{{- /* Rendered unconditionally so seam validation always runs. */ -}}
{{- include "strange-company.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strange-company.configMapName" . }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
  {{- with (include "strange-company.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  # Non-secret half of the control-plane contract. Identical keys in every
  # deployment topology; only the values differ.
  DATABASE_HOST: {{ include "strange-company.databaseHost" . | quote }}
  DATABASE_PORT: {{ include "strange-company.databasePort" . | quote }}
  DATABASE_NAME: {{ include "strange-company.databaseName" . | quote }}
  VIKUNJA_URL: {{ include "strange-company.vikunjaUrl" . | quote }}
  {{- if .Values.controlPlane.agentRuns.enabled }}
  # Spec 16: coding runs are isolated Jobs in this namespace. Both values are
  # required for the coding phases to run at all; without them the control
  # plane says so at boot and everything up to Ready still works.
  AGENT_RUNS_NAMESPACE: {{ .Values.controlPlane.agentRuns.namespace | quote }}
  RUNNER_IMAGE: {{ printf "%s:%s" .Values.controlPlane.agentRuns.runnerImage.repository (default .Chart.AppVersion .Values.controlPlane.agentRuns.runnerImage.tag) | quote }}
  {{- end }}
  # Spec 25: an issue carrying this label becomes a card. With no repositories
  # listed, nothing can create a card at all and the board stays empty.
  GITHUB_API_URL: {{ .Values.github.apiUrl | quote }}
  GITHUB_REPOSITORIES: {{ join "," .Values.github.repositories | quote }}
  GITHUB_INGEST_LABEL: {{ .Values.github.label | quote }}
  {{- if .Values.controlPlane.gitCredential.secret }}
  # The credential a coding Job pushes its agent branch with. Give it
  # contents:write and NOT workflows:write -- an agent that can rewrite CI can
  # weaken the gates that verify it.
  GIT_TOKEN_SECRET: {{ .Values.controlPlane.gitCredential.secret | quote }}
  GIT_TOKEN_KEY: {{ .Values.controlPlane.gitCredential.key | quote }}
  {{- end }}
  GIT_AUTHOR_NAME: {{ .Values.controlPlane.gitCredential.authorName | quote }}
  GIT_AUTHOR_EMAIL: {{ .Values.controlPlane.gitCredential.authorEmail | quote }}
  # Which backend answers the red and green gates. "github-actions" reads the
  # checks the repository's own workflows produced; "test-command" runs
  # .strange-company/test-command in a Job, for repositories with no CI.
  VERIFICATION_MODE: {{ .Values.controlPlane.verification.mode | quote }}
  # Spec 10.2: a human approves a specification by adding this label to the
  # card in Vikunja. The board is a surface no model can reach, which is what
  # makes the label a human decision rather than an assertion.
  SPEC_APPROVAL_LABEL: {{ .Values.vikunja.board.approvalLabel | quote }}
  AUTONOMY: {{ .Values.controlPlane.autonomy | quote }}
  # Without at least one username here the board belongs to the bootstrap
  # user alone and no human can see the cards.
  VIKUNJA_BOARD_SHARE_WITH: {{ join "," .Values.vikunja.board.shareWith | quote }}
  # 0 read, 1 read & write, 2 admin. Read & write by default: a human moving a
  # card is a real input (spec 4.3), and read-only silently breaks it.
  VIKUNJA_BOARD_PERMISSION: {{ .Values.vikunja.board.permission | quote }}
  HERMES_GATEWAY_URL: {{ include "strange-company.hermesGatewayUrl" . | quote }}
  {{- with (include "strange-company.hermesDashboardUrl" .) }}
  HERMES_DASHBOARD_URL: {{ . | quote }}
  {{- end }}
