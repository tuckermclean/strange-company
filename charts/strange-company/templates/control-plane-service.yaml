{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "strange-company.controlPlane.fullname" . }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "strange-company.selectorLabels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
{{- end }}
