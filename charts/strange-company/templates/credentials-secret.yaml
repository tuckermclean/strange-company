{{- /*
  Spec: docs/specs/single-source-credentials.md. One Secret per populated
  `credentials` entry, named and keyed exactly as
  control-plane/internal/policy/defaults/providers.yaml (or an operator's own
  providers.yaml) expects.

  `credentials` is a free-form map: any entry name and any keys are accepted,
  not just the four documented defaults. This chart never invents a
  credential -- an entry whose values are all empty renders no Secret at all
  (Rule 1), and an individual empty key within an otherwise-populated entry is
  simply omitted (Rule 2). A Secret holding an empty string would resolve and
  authenticate with nothing, which is a worse failure than a missing Secret:
  it surfaces as a provider error instead of as missing configuration.

  Validation runs unconditionally, before the loop below, so a colliding name
  fails the render even if that particular entry would otherwise be empty.
*/ -}}
{{- include "strange-company.credentialsValidate" . -}}
{{- $ctx := . -}}
{{- range $name, $entry := .Values.credentials }}
{{- $filtered := dict -}}
{{- range $k, $v := $entry }}
{{- if ne $v "" }}
{{- $_ := set $filtered $k $v }}
{{- end }}
{{- end }}
{{- if $filtered }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ctx "component" "credentials") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $filtered }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- /*
  The same credentials, again, in the namespace coding Jobs run in.

  A Job references its provider's Secret by name, and a Secret reference is
  resolved in the POD's namespace -- not the release's. Rendering these only in
  the release namespace left every coding pod in CreateContainerConfigError
  with `secret "deepseek-credentials" not found`, which is where the first real
  end-to-end run stopped.

  Rendered by the chart rather than copied at run time by the control plane on
  purpose: copying would need `secrets: [create]` in the run namespace's Role,
  and a control plane that can mint Secrets in the namespace where untrusted
  code executes is a much larger grant than one that cannot (spec §29).

  Skipped when the two namespaces are the same, or Helm would render the same
  object twice.
*/ -}}
{{- if and .Values.controlPlane.enabled .Values.controlPlane.agentRuns.enabled }}
{{- $runNS := .Values.controlPlane.agentRuns.namespace }}
{{- if ne $runNS .Release.Namespace }}
{{- range $name, $entry := .Values.credentials }}
{{- $filtered := dict -}}
{{- range $k, $v := $entry }}
{{- if ne $v "" }}
{{- $_ := set $filtered $k $v }}
{{- end }}
{{- end }}
{{- if $filtered }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $runNS }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "agent-runs") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $filtered }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
