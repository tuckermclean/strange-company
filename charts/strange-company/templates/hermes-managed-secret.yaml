{{- /*
  Operator-pinned managed scope for the bundled Hermes (spec:
  docs/specs/hermes-managed-scope.md). Unlike hermes.env / hermes.secrets,
  values pinned here win over whatever a human types into the Hermes
  dashboard, on every restart -- see
  docs/reference/hermes-integration-notes.md, "Credentials must arrive as
  secrets, not as dashboard input".

  hermes.managed.fromCredentials (spec: docs/specs/single-source-credentials.md)
  feeds the same generated .env as hermes.managed.env below, resolving each
  "<secretName>.<key>" reference against the `credentials` block so the same
  value backs both the provider Secret and the managed pin.

  Validation runs unconditionally, before the enabled/existingSecret gate
  below, so it still fires on the existingSecret branch where this template
  goes on to render nothing.
*/ -}}
{{- include "strange-company.hermesManagedValidate" . -}}
{{- if and .Values.hermes.enabled .Values.hermes.managed.enabled (not .Values.hermes.managed.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strange-company.hermesManagedSecretName" . }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "hermes") | nindent 4 }}
type: Opaque
stringData:
  {{- if or .Values.hermes.managed.env .Values.hermes.managed.fromCredentials }}
  .env: |
    {{- range $k, $v := .Values.hermes.managed.env }}
    {{ $k }}={{ $v }}
    {{- end }}
    {{- range $k, $ref := .Values.hermes.managed.fromCredentials }}
    {{ $k }}={{ include "strange-company.resolveCredential" (dict "ctx" $ "ref" $ref) }}
    {{- end }}
  {{- end }}
  {{- if .Values.hermes.managed.config }}
  config.yaml: |
    {{- toYaml .Values.hermes.managed.config | nindent 4 }}
  {{- end }}
{{- end }}
