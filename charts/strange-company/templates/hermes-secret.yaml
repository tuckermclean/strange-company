{{- if and .Values.hermes.enabled .Values.hermes.secrets }}
{{- /*
  Development convenience only. Real installs should set hermes.existingSecret
  and keep provider credentials out of values files entirely.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strange-company.hermes.fullname" . }}-env
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "hermes") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.hermes.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
