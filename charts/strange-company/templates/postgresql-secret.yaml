{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- /* Resolve the password exactly once: two calls would generate two values. */ -}}
{{- $password := include "strange-company.postgresql.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strange-company.postgresql.fullname" . }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.auth.usernameKey }}: {{ .Values.postgresql.auth.username | quote }}
  {{ .Values.postgresql.auth.passwordKey }}: {{ $password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
{{- if .Values.vikunja.enabled }}
---
{{- /*
  The upstream Vikunja chart cannot template a secretKeyRef name, so it reads a
  fixed literal. This Secret carries that literal name and the same credentials.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vikunja.databaseSecretName }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "vikunja") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgresql.vikunjaDatabase | quote }}
{{- end }}
{{- end }}
