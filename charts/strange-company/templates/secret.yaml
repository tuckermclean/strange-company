{{- /*
  Chart-owned credentials.

  Generated values are read back from the cluster on every subsequent render,
  so `helm upgrade` never rotates them. None of these are AI provider
  credentials -- they are the chart's own plumbing secrets.
*/ -}}
{{- $secretName := include "strange-company.secretName" . -}}
{{- $hermesUsesChartSecret := eq (include "strange-company.hermesSecretName" .) $secretName -}}
{{- $vikunjaUsesChartSecret := eq (include "strange-company.vikunjaSecretName" .) $secretName -}}
{{- $needVikunjaToken := and .Values.controlPlane.enabled $vikunjaUsesChartSecret -}}
{{- $needVikunjaBootstrap := and .Values.controlPlane.enabled .Values.vikunja.bootstrap.enabled (not .Values.vikunja.token) -}}
{{- $needApiKey := and $hermesUsesChartSecret (or .Values.controlPlane.enabled .Values.hermes.enabled) -}}
{{- $needDashboard := and .Values.hermes.enabled .Values.hermes.dashboard.enabled (not .Values.hermes.existingSecret) -}}
{{- if or $needVikunjaToken $needVikunjaBootstrap $needApiKey $needDashboard }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
type: Opaque
stringData:
  {{- if $needVikunjaToken }}
  vikunja-token: {{ .Values.vikunja.token | quote }}
  {{- end }}
  {{- if $needVikunjaBootstrap }}
  vikunja-bootstrap-password: {{ include "strange-company.preserved" (dict "ctx" $ "key" "vikunja-bootstrap-password" "value" .Values.vikunja.bootstrap.password "length" 24) | quote }}
  {{- end }}
  {{- if $needApiKey }}
  hermes-api-key: {{ include "strange-company.preserved" (dict "ctx" $ "key" "hermes-api-key" "value" .Values.hermes.apiKey "length" 40) | quote }}
  {{- end }}
  {{- if $needDashboard }}
  hermes-dashboard-password: {{ include "strange-company.preserved" (dict "ctx" $ "key" "hermes-dashboard-password" "value" .Values.hermes.dashboard.password "length" 24) | quote }}
  {{- end }}
{{- end }}
