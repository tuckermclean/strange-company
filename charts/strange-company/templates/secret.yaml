{{- /*
  Chart-owned credentials for the control plane.

  Values are taken verbatim from values.yaml -- nothing is randomly generated
  here, so `helm upgrade` can never rotate them.
*/ -}}
{{- $secretName := include "strange-company.secretName" . -}}
{{- $needVikunja := eq (include "strange-company.vikunjaSecretName" .) $secretName -}}
{{- $needHermes := eq (include "strange-company.hermesSecretName" .) $secretName -}}
{{- if and .Values.controlPlane.enabled (or $needVikunja $needHermes) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
type: Opaque
stringData:
  {{- if $needVikunja }}
  vikunja-token: {{ .Values.vikunja.token | quote }}
  {{- end }}
  {{- if $needHermes }}
  hermes-api-key: {{ .Values.hermes.apiKey | quote }}
  {{- end }}
{{- end }}
