{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "strange-company.serviceAccountName" . }}
  labels:
    {{- include "strange-company.labels" (dict "ctx" $ "component" "control-plane") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  No Role or RoleBinding is created. The control plane does not talk to the
  Kubernetes API in this phase, so it gets no token and no permissions.
*/}}
automountServiceAccountToken: false
{{- end }}
