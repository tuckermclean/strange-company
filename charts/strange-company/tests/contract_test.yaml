# The control plane must receive the same logical variables in every topology.
# Only the values differ.
suite: stable control-plane configuration contract
release:
  name: strange-company
  namespace: strange-company
templates:
  - templates/control-plane-deployment.yaml
tests:
  - it: batteries mode wires the contract through configmap plus secret refs
    values: [../ci/values-batteries.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: strange-company-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: strange-company-postgresql
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: strange-company-postgresql
                key: password

  - it: external mode exposes the same variable names
    values: [../ci/values-external.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: strange-company-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: strange-company-db
                key: username

  - it: hybrid A exposes the same variable names
    values: [../ci/values-hybrid-a.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: strange-company-config

  - it: hybrid B exposes the same variable names
    values: [../ci/values-hybrid-b.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: strange-company-config

  - it: probes use the documented control plane paths
    values: [../ci/values-batteries.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  # Without this, a control plane waiting on a slow PostgreSQL is killed by
  # liveness before it can finish booting.
  - it: gives the control plane a startup grace period
    values: [../ci/values-batteries.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  # Spec 2.5: models may read policy and propose changes to it, but must never
  # silently rewrite it. A writable mount would make that a convention rather
  # than a guarantee.
  - it: mounts operator-supplied policy read-only
    values: [../ci/values-batteries.yaml]
    set:
      policy.models: "phases: {}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: policy
            mountPath: /policy
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLICY_DIR
            value: /policy

  - it: mounts no policy volume when the operator supplies none
    values: [../ci/values-batteries.yaml]
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLICY_DIR
            value: /policy

  - it: honours a replica count change
    values: [../ci/values-batteries.yaml]
    set:
      controlPlane.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: batteries mode wires the Vikunja bootstrap credentials through
    values: [../ci/values-batteries.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_BOOTSTRAP_USERNAME
            value: strange-company-bootstrap
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: strange-company-secrets
                key: vikunja-bootstrap-password

  - it: an explicit vikunja token suppresses the bootstrap credentials
    values: [../ci/values-batteries.yaml]
    set:
      vikunja.token: abc
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_BOOTSTRAP_USERNAME
            value: strange-company-bootstrap
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VIKUNJA_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: strange-company-secrets
                key: vikunja-bootstrap-password
