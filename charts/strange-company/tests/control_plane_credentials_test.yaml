# Spec: docs/specs/policy-selected-models.md, "Chart". Each `it:` names the
# acceptance criterion it covers.
#
# The `credentials` block itself (one Secret per populated entry, and the
# emptiness filtering that decides which entries produce one) is covered by
# tests/credentials_test.yaml against templates/credentials-secret.yaml. This
# suite covers the separate half of the same spec: how those Secrets are
# projected into the control-plane pod so control-plane/internal/credentials
# can read <CREDENTIALS_DIR>/<secret>/<key>.
suite: control-plane credentials projection
release:
  name: strange-company
  namespace: strange-company
templates:
  - templates/control-plane-deployment.yaml
tests:
  # ---- default values (all `credentials` entries empty): exactly as today ----
  - it: adds no credentials volume, mount or CREDENTIALS_DIR with default values
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIALS_DIR
            value: /credentials

  # Same claim, but forced through a branch where volumes/volumeMounts DO
  # exist (policy is mounted), so this is a genuine exact-list comparison
  # proving an all-empty `credentials` block contributes nothing to either
  # list -- stronger than a `notContains` presence check, which would not
  # catch a stray entry sitting anywhere else in the array.
  - it: contributes nothing to volumes or volumeMounts when credentials are all empty, even alongside a mounted policy
    set:
      policy.models: "phases: {}"
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: policy
              configMap:
                name: strange-company-policy
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: policy
              mountPath: /policy
              readOnly: true

  # ---- one populated entry ----
  - it: projects a single populated credentials entry read-only under its own subdirectory
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: credentials
              projected:
                sources:
                  - secret:
                      name: my-provider-credentials
                      items:
                        - key: api-key
                          path: my-provider-credentials/api-key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: credentials
              mountPath: /credentials
              readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIALS_DIR
            value: /credentials

  # ---- two populated entries: both projected, each under its own subdirectory ----
  # Go's text/template sorts map keys when ranging, so rendering order is
  # deterministic: "another-provider-credentials" sorts before
  # "my-provider-credentials".
  - it: projects two populated credentials entries, each under its own subdirectory
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
        another-provider-credentials:
          token: sk-other
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: credentials
              projected:
                sources:
                  - secret:
                      name: another-provider-credentials
                      items:
                        - key: token
                          path: another-provider-credentials/token
                  - secret:
                      name: my-provider-credentials
                      items:
                        - key: api-key
                          path: my-provider-credentials/api-key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: credentials
              mountPath: /credentials
              readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIALS_DIR
            value: /credentials

  # ---- a populated and an empty entry together: only the populated one is projected ----
  - it: projects only the populated entry when another entry stays fully empty
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
        another-provider-credentials:
          api-key: ""
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: credentials
              projected:
                sources:
                  - secret:
                      name: my-provider-credentials
                      items:
                        - key: api-key
                          path: my-provider-credentials/api-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIALS_DIR
            value: /credentials

  # ---- an individual empty key within an otherwise-populated entry is omitted ----
  # Mirrors templates/credentials-secret.yaml's own per-key filtering (Rule
  # 2): a Secret never holds an empty-string key, so the projection must not
  # reference one either -- a projected `items[].key` naming a key the Secret
  # does not have fails the pod at mount time.
  - it: omits an individual empty key within an otherwise-populated entry
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
          unused-key: ""
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: credentials
              projected:
                sources:
                  - secret:
                      name: my-provider-credentials
                      items:
                        - key: api-key
                          path: my-provider-credentials/api-key

  # ---- custom mountPath flows through to both the mount and CREDENTIALS_DIR ----
  - it: honours a custom controlPlane.credentials.mountPath
    set:
      controlPlane.credentials.mountPath: /etc/strange-company-credentials
      credentials:
        my-provider-credentials:
          api-key: sk-populated
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credentials
            mountPath: /etc/strange-company-credentials
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIALS_DIR
            value: /etc/strange-company-credentials
