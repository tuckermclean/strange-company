# Spec: docs/specs/single-source-credentials.md. Each `it:` names the
# acceptance criterion it covers.
#
# `hermes.managed.fromCredentials` -- the half of this spec that feeds the
# managed `.env` -- is exercised in tests/hermes_managed_test.yaml instead,
# against templates/hermes-managed-secret.yaml, which that suite already
# declares.
suite: single-source credentials
release:
  name: strange-company
  namespace: strange-company
templates:
  - templates/credentials-secret.yaml
tests:
  # ---- default values: no credential Secrets at all ----
  - it: renders no credential secrets at all with default values
    template: templates/credentials-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ---- one populated entry: exactly one Secret, only the non-empty keys ----
  - it: renders exactly one secret for a single populated entry, with only the non-empty keys
    template: templates/credentials-secret.yaml
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
          unused-key: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-provider-credentials
      - equal:
          path: stringData
          value:
            api-key: sk-populated

  # ---- a populated and an empty entry together: only the populated one renders ----
  - it: renders only the populated entry when another entry stays fully empty
    template: templates/credentials-secret.yaml
    set:
      credentials:
        my-provider-credentials:
          api-key: sk-populated
        another-provider-credentials:
          api-key: ""
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: my-provider-credentials

  # ---- Rule 3: a name colliding with a chart-owned Secret fails, naming both ----
  - it: rejects a credentials entry named after the Vikunja database secret
    template: templates/credentials-secret.yaml
    set:
      credentials:
        vikunja-db:
          api-key: sk-populated
    asserts:
      - failedTemplate:
          errorPattern: "credentials\\.vikunja-db collides with the Vikunja database Secret"

  - it: rejects a credentials entry named after the chart's own secrets Secret
    template: templates/credentials-secret.yaml
    set:
      credentials:
        strange-company-secrets:
          api-key: sk-populated
    asserts:
      - failedTemplate:
          errorPattern: "credentials\\.strange-company-secrets collides with the chart's own credentials Secret"

  - it: rejects a credentials entry named after the bundled PostgreSQL secret
    template: templates/credentials-secret.yaml
    set:
      credentials:
        strange-company-postgresql:
          api-key: sk-populated
    asserts:
      - failedTemplate:
          errorPattern: "credentials\\.strange-company-postgresql collides with the bundled PostgreSQL Secret"
