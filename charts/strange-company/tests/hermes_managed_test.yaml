# Spec: docs/specs/hermes-managed-scope.md. Each `it:` names the acceptance
# criterion it covers.
#
# Each test declares its own `template:`, chosen from the suite-level
# `templates:` allowlist below -- a test cannot select a template the suite
# did not declare.
#
# The `fromCredentials` tests below cover docs/specs/single-source-credentials.md
# instead -- the half of that spec that feeds this file's managed `.env`. The
# `credentials` block itself (one Secret per populated entry) is covered by
# tests/credentials_test.yaml against templates/credentials-secret.yaml.
suite: hermes managed scope
release:
  name: strange-company
  namespace: strange-company
templates:
  - templates/hermes-deployment.yaml
  - templates/hermes-managed-secret.yaml
tests:
  # ---- default: enabled: false renders exactly what the chart renders today ----
  - it: renders no managed secret by default
    template: templates/hermes-managed-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: adds no managed volume, mount or HERMES_MANAGED_DIR by default
    template: templates/hermes-deployment.yaml
    asserts:
      # Exact-list equality (not just presence) so an accidental extra volume
      # or mount cannot slip through unnoticed.
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: data
              persistentVolumeClaim:
                claimName: strange-company-hermes
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: data
              mountPath: /opt/data
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HERMES_MANAGED_DIR
            value: /etc/hermes-managed

  # ---- enabled: true with env ----
  - it: pins env vars into a generated secret as KEY=value lines
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.env:
        ANTHROPIC_API_KEY: sk-pinned-123
        FOO_BAR: baz
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: strange-company-hermes-managed
      - matchRegex:
          path: stringData[".env"]
          pattern: "(^|\n)ANTHROPIC_API_KEY=sk-pinned-123(\n|$)"
      - matchRegex:
          path: stringData[".env"]
          pattern: "(^|\n)FOO_BAR=baz(\n|$)"
      - notExists:
          path: stringData["config.yaml"]

  - it: mounts the generated secret at mountPath read-only and sets HERMES_MANAGED_DIR
    template: templates/hermes-deployment.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.mountPath: /etc/hermes-managed-custom
      hermes.managed.env:
        ANTHROPIC_API_KEY: sk-pinned-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: hermes-managed
            mountPath: /etc/hermes-managed-custom
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HERMES_MANAGED_DIR
            value: /etc/hermes-managed-custom
      - contains:
          path: spec.template.spec.volumes
          content:
            name: hermes-managed
            secret:
              secretName: strange-company-hermes-managed

  # ---- enabled: true with config ----
  - it: pins config.yaml into a generated secret from a free-form mapping
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.config:
        model:
          default: anthropic/claude-test
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "model:"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "default: anthropic/claude-test"
      - notExists:
          path: stringData[".env"]

  # ---- existingSecret ----
  - it: an existingSecret suppresses the generated secret
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the existingSecret using the configured key names
    template: templates/hermes-deployment.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
      hermes.managed.existingSecretKeys:
        env: creds-env
        config: creds-config.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: hermes-managed
            mountPath: /etc/hermes-managed
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: hermes-managed
            secret:
              secretName: my-hermes-managed
              items:
                - key: creds-env
                  path: .env
                - key: creds-config.yaml
                  path: config.yaml

  # ---- Rule 2: existingSecret and inline values are mutually exclusive ----
  - it: rejects existingSecret combined with inline env
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
      hermes.managed.env:
        FOO: bar
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.existingSecret.*hermes\\.managed\\.env.*mutually exclusive"

  - it: rejects existingSecret combined with inline config
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
      hermes.managed.config:
        model:
          default: x
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.existingSecret.*hermes\\.managed\\.config.*mutually exclusive"

  # ---- Rule 3: an empty managed scope is always a mistake ----
  - it: rejects an enabled managed scope with nothing pinned
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "empty managed scope pins nothing"

  # ---- Rule 5: env_loader silently skips lines it cannot parse ----
  - it: rejects an env key that is not a valid environment variable name
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.env:
        FOO-BAR: baz
    asserts:
      - failedTemplate:
          errorPattern: "not a valid environment variable name"

  # ---- existingSecret projection: renaming is all-or-nothing ----
  # A secret volume projects either every key under its own name, or only the
  # keys listed under `items`. Emitting `items` unconditionally would demand
  # both files exist and leave the pod unable to mount when an operator pins
  # only credentials -- so with no key names given, no items are emitted.
  - it: projects an existingSecret under its own key names when none are given
    template: templates/hermes-deployment.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: hermes-managed
            secret:
              secretName: my-hermes-managed

  # Validation lives in hermes-managed-secret.yaml, which includes the guard
  # unconditionally -- so it fires even on the existingSecret branch where that
  # template renders nothing. Rules 2, 3 and 5 above are asserted the same way.
  - it: rejects renaming only one of the two managed files
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
      hermes.managed.existingSecretKeys:
        env: creds-env
    asserts:
      - failedTemplate:
          errorPattern: "names \"creds-env\" but not both keys"

  # ===================================================================
  # docs/specs/single-source-credentials.md: hermes.managed.fromCredentials
  # ===================================================================

  # ---- a resolving reference puts KEY=value in the managed .env ----
  - it: resolves fromCredentials into a KEY=value line in the managed .env
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      credentials.my-provider-credentials.api-key: sk-resolved
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: stringData[".env"]
          pattern: "(^|\n)ANTHROPIC_API_KEY=sk-resolved(\n|$)"

  # ---- Rule 5: fromCredentials composes with the existing managed.env ----
  - it: composes fromCredentials with inline managed.env in the same .env
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.env.FOO: bar
      credentials.my-provider-credentials.api-key: sk-resolved
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - matchRegex:
          path: stringData[".env"]
          pattern: "(^|\n)FOO=bar(\n|$)"
      - matchRegex:
          path: stringData[".env"]
          pattern: "(^|\n)ANTHROPIC_API_KEY=sk-resolved(\n|$)"

  # ---- Rule 4: an unresolvable or empty reference fails, naming the reference ----
  - it: rejects fromCredentials naming a credentials entry that does not exist
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: does-not-exist.api-key
    asserts:
      - failedTemplate:
          errorPattern: "fromCredentials\\.ANTHROPIC_API_KEY references \"does-not-exist\\.api-key\""

  - it: rejects fromCredentials naming a key that does not exist in the entry
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      credentials.my-provider-credentials.api-key: sk-real
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.missing-key
    asserts:
      - failedTemplate:
          errorPattern: "fromCredentials\\.ANTHROPIC_API_KEY references \"my-provider-credentials\\.missing-key\""

  - it: rejects fromCredentials resolving to an empty value
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      credentials.my-provider-credentials.api-key: ""
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - failedTemplate:
          errorPattern: "fromCredentials\\.ANTHROPIC_API_KEY references \"my-provider-credentials\\.api-key\""

  # ---- Rule 6: fromCredentials requires managed scope to be enabled ----
  - it: rejects fromCredentials when hermes.managed.enabled is false
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: false
      credentials.my-provider-credentials.api-key: sk-real
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.fromCredentials is set but hermes\\.managed\\.enabled is false"

  # ---- Rule 5: a key set in both managed.env and fromCredentials must fail ----
  - it: rejects a key present in both managed.env and fromCredentials
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.env.ANTHROPIC_API_KEY: sk-from-env
      credentials.my-provider-credentials.api-key: sk-from-credentials
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.env and hermes\\.managed\\.fromCredentials both set \"ANTHROPIC_API_KEY\""

  # ---- extension of hermes-managed-scope.md Rule 2: existingSecret has no
  # generated .env for fromCredentials to land in, so it is just as mutually
  # exclusive as inline env/config -- otherwise the pin would silently pin
  # nothing, exactly what Rule 4 exists to prevent. ----
  - it: rejects existingSecret combined with fromCredentials
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      hermes.managed.existingSecret: my-hermes-managed
      credentials.my-provider-credentials.api-key: sk-real
      hermes.managed.fromCredentials.ANTHROPIC_API_KEY: my-provider-credentials.api-key
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.existingSecret.*hermes\\.managed\\.fromCredentials.*mutually exclusive"

  # ---- extension of hermes-managed-scope.md Rule 5: fromCredentials keys feed
  # the same .env as managed.env, so the same env-var-name constraint applies. ----
  - it: rejects a fromCredentials key that is not a valid environment variable name
    template: templates/hermes-managed-secret.yaml
    set:
      hermes.managed.enabled: true
      credentials.my-provider-credentials.api-key: sk-real
      hermes.managed.fromCredentials:
        FOO-BAR: my-provider-credentials.api-key
    asserts:
      - failedTemplate:
          errorPattern: "hermes\\.managed\\.fromCredentials key \"FOO-BAR\" is not a valid environment variable name"
