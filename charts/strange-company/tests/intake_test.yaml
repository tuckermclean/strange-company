# Spec 25: a GitHub issue carrying the label becomes a card. With nothing
# configured here there is no way to create a card at all.
suite: work intake
release:
  name: strange-company
  namespace: strange-company
templates:
  - templates/configmap.yaml
  - templates/control-plane-deployment.yaml
tests:
  - it: ingests from nowhere by default
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.GITHUB_REPOSITORIES
          value: ""
      - equal:
          path: data.GITHUB_INGEST_LABEL
          value: "agent-ready"
      - equal:
          path: data.GITHUB_API_URL
          value: "https://api.github.com"

  - it: passes repositories through as a comma-separated list
    template: templates/configmap.yaml
    set:
      github.repositories:
        - example/one
        - example/two
    asserts:
      - equal:
          path: data.GITHUB_REPOSITORIES
          value: "example/one,example/two"

  - it: points at a GitHub Enterprise API by configuration
    template: templates/configmap.yaml
    set:
      github.apiUrl: https://github.example.com/api/v3
    asserts:
      - equal:
          path: data.GITHUB_API_URL
          value: "https://github.example.com/api/v3"

  # Optional on purpose: no token disables ingestion with a log line, rather
  # than leaving the pod unable to start.
  - it: reads the token from the chart secret, optionally
    template: templates/control-plane-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: strange-company-secrets
                key: github-token
                optional: true
