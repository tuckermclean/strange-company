# An external Vikunja named by secret but not by URL is incoherent: the
# credential says "use that board" and nothing says which one.
#
# The bare `vikunja.enabled: false` case is NOT invalid any more -- it is how an
# install retires the board and runs on the control plane's own console.
vikunja:
  enabled: false
  external:
    existingSecret: someone-elses-vikunja
    url: ""
