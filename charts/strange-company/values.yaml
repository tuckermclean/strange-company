# strange-company
#
# Batteries-optional infrastructure. Each dependency below can be either
# *bundled* (rendered by this chart) or *external* (an endpoint you already run).
# The switches are independent: `postgresql.enabled` says nothing about
# `vikunja.enabled`. There is deliberately no global "mode" flag.
#
# Whatever you choose, the control plane always receives the same environment
# contract (see docs/USAGE.md):
#
#   DATABASE_HOST  DATABASE_PORT  DATABASE_NAME  DATABASE_USER  DATABASE_PASSWORD
#   VIKUNJA_URL    VIKUNJA_TOKEN
#   [VIKUNJA_BOOTSTRAP_USERNAME]  [VIKUNJA_BOOTSTRAP_PASSWORD]
#   HERMES_GATEWAY_URL  HERMES_API_KEY  [HERMES_DASHBOARD_URL]

# -- Settings shared by every chart-owned workload.
global:
  # -- Pull secrets applied to all chart-owned pods.
  imagePullSecrets: []

# -- Override the generated chart name (affects every resource name).
nameOverride: ""
# -- Override the generated release fullname (affects every resource name).
fullnameOverride: ""

# -- Common labels/annotations added to every chart-owned resource.
commonLabels: {}
commonAnnotations: {}

serviceAccount:
  # -- Create a ServiceAccount for the control plane. No RBAC is attached: the
  # control plane does not talk to the Kubernetes API in this phase.
  create: true
  # -- Use an existing ServiceAccount instead of creating one.
  name: ""
  annotations: {}

# -- Optional, default-off NetworkPolicy that confines chart-owned pods.
networkPolicy:
  enabled: false
  # -- Extra ingress rules appended to the generated policy.
  extraIngress: []
  # -- Extra egress rules appended to the generated policy.
  extraEgress: []

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
# Bundled PostgreSQL is a single StatefulSet running the official image. It is
# meant for CI, development, demos, homelabs and small single-cluster installs.
# It is NOT highly available. Point `postgresql.external` at a managed database
# for anything that matters.
postgresql:
  # -- Render a chart-owned PostgreSQL StatefulSet, Service and Secret.
  enabled: true

  image:
    repository: postgres
    # -- Pinned. Do not float this to `latest`.
    tag: "17.11"
    pullPolicy: IfNotPresent

  auth:
    # -- Application user created by the container entrypoint.
    username: strange-company
    # -- Primary application database.
    database: strange-company
    # -- Explicit password. Leave empty to generate one on first install; the
    # generated value is then preserved across upgrades via a Secret lookup.
    password: ""
    # -- Use a pre-existing Secret instead of a chart-created one.
    existingSecret: ""
    usernameKey: username
    passwordKey: password

  # -- Second logical database created at init time so Vikunja does not share
  # schemas with the control plane. One server, two databases (spec §11).
  vikunjaDatabase: vikunja

  service:
    port: 5432

  persistence:
    # -- When false, PostgreSQL uses an emptyDir. Suitable only for CI.
    enabled: true
    size: 8Gi
    # -- Empty means "use the cluster default StorageClass". Never hard-coded.
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- uid/gid 999 is `postgres` in the official Debian-based image.
  podSecurityContext:
    fsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Used only when `postgresql.enabled: false`.
  external:
    host: ""
    port: 5432
    database: strange-company
    # -- Secret holding the credentials for the external server. Required.
    existingSecret: ""
    usernameKey: username
    passwordKey: password

# ---------------------------------------------------------------------------
# Vikunja (Kanban)
# ---------------------------------------------------------------------------
# Bundled Vikunja comes from the official upstream chart, declared as a
# conditional dependency in Chart.yaml. Note the doubled key: `vikunja.enabled`
# and `vikunja.external` belong to THIS chart, while `vikunja.vikunja.*` is
# passed through to the upstream chart.
vikunja:
  # -- Who can see the generated board. The control plane creates the project
  # as its own bootstrap user, so with nobody listed here the board is private
  # to a service account and no human sees the cards.
  board:
    # -- Vikunja usernames granted access.
    shareWith: []
    # -- 0 read, 1 read & write, 2 admin. Read & write by default: a human
    # moving a card is a real input, and read-only silently breaks it.
    permission: 1
    # -- Add this label to a card in Vikunja to approve its specification
    # (spec 10.2). The control plane applies the approval and removes the
    # label, so it never approves a later edit nobody consented to.
    approvalLabel: spec-approved

  # -- Render the upstream Vikunja dependency.
  enabled: true

  # -- Name of the Secret holding Vikunja's database password.
  #
  # This must be a literal: the upstream chart does not run `tpl` over
  # `secretKeyRef` names, so it cannot be templated per-release. When PostgreSQL
  # is bundled this chart creates the Secret for you. When PostgreSQL is
  # external, point this AND the `secretKeyRef` below at your own Secret.
  # Keep the two in sync -- the chart fails the render if they disagree.
  databaseSecretName: vikunja-db

  # NOTE: do not add a `vikunja.ingress` key here. Everything under `vikunja:`
  # that is not `vikunja.vikunja` is merged into the upstream chart's own root
  # values, and it iterates `ingress` as a map of named ingresses -- a plain
  # `enabled:` boolean there crashes its renderer. Configure Vikunja's Ingress at
  # `vikunja.vikunja.ingress.main` instead. The chart enforces this.

  # Used only when `vikunja.enabled: false`.
  external:
    url: ""
    existingSecret: ""
    tokenKey: token

  # -- API token handed to the control plane as VIKUNJA_TOKEN. Leave empty (the
  # default) and the control plane provisions its own token on first boot using
  # `bootstrap` below; set this explicitly to skip that entirely (for example
  # when the target Vikunja instance has registration disabled).
  token: ""

  # -- Credentials the control plane uses to bootstrap its own API token on
  # first boot. Leave the password empty to generate one that is preserved
  # across upgrades. Ignored entirely when `vikunja.token` is set.
  bootstrap:
    enabled: true
    username: strange-company-bootstrap
    password: ""

  # ---- values below are passed verbatim to the upstream Vikunja chart ----
  vikunja:
    image:
      repository: vikunja/vikunja
      tag: "2.5.0"

    # Point Vikunja at whichever PostgreSQL this release resolved to.
    #
    # String values here are run through `tpl` by the upstream chart, but that
    # happens in the SUBCHART's template scope: this chart's helpers are not
    # reachable from here. The release-name logic is therefore inlined using
    # built-ins only. This chart re-derives the same string at render time and
    # fails the render if the two disagree, so the duplication cannot rot.
    env:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: '{{ if contains "strange-company" .Release.Name }}{{ .Release.Name }}{{ else }}{{ printf "%s-strange-company" .Release.Name }}{{ end }}-postgresql:5432'
      VIKUNJA_DATABASE_USER: strange-company
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_SSLMODE: disable
      VIKUNJA_DATABASE_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: vikunja-db
            key: password
      VIKUNJA_SERVICE_PUBLICURL: 'http://{{ if contains "vikunja" .Release.Name }}{{ .Release.Name }}{{ else }}{{ printf "%s-vikunja" .Release.Name }}{{ end }}:3456'

    persistence:
      # Uploaded files.
      data:
        enabled: true
        size: 2Gi
      # SQLite database volume -- not needed, we use PostgreSQL.
      database:
        enabled: false

    ingress:
      main:
        enabled: false

    # Vikunja does not need Kubernetes API access.
    automountServiceAccountToken: false

    resources: {}

# ---------------------------------------------------------------------------
# Hermes Agent
# ---------------------------------------------------------------------------
hermes:
  # -- Render a chart-owned Hermes Deployment, Service and PVC.
  enabled: true

  image:
    repository: nousresearch/hermes-agent
    # -- Pinned. Do not float this to `latest`.
    tag: "v2026.8.19"
    pullPolicy: IfNotPresent

  # -- The container's CMD is the "main program": when it exits, the container
  # exits. `hermes` with no arguments is the interactive TUI, which quits
  # immediately without a TTY ("Input is not a terminal") and crash-loops.
  # `gateway` runs the OpenAI-compatible API server instead.
  args: ["gateway"]

  gateway:
    # -- Bound as API_SERVER_PORT. The API server refuses to start without an
    # API_SERVER_KEY, so the chart always supplies one; see `apiKey` below.
    port: 8642
  dashboard:
    # -- Runs as a supervised service alongside the gateway, gated on
    # HERMES_DASHBOARD.
    enabled: true
    port: 9119
    # -- The dashboard's auth gate engages on any non-loopback bind and fails
    # closed without an auth provider, so a credential is required for it to
    # listen at all. Basic auth is generated here because it needs no external
    # infrastructure and works on a fresh install.
    #
    # To put the dashboard behind your own identity provider instead, no chart
    # feature is needed: set `hermes.existingSecret` (which suppresses the
    # basic-auth variables below) and pass the provider settings through
    # `hermes.env`. The chart deliberately does not model OIDC itself -- that
    # would be a worse version of what these two values already do.
    #
    # Leave the password empty to generate one and preserve it across upgrades.
    username: hermes
    password: ""

  persistence:
    # -- Hermes state lives at /opt/data (HERMES_HOME in the upstream image).
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # -- Secret providing AI provider credentials, mounted with envFrom.
  # Strongly preferred over `hermes.secrets` for real installs. No credentials
  # of any kind are required to render or to pass CI.
  existingSecret: ""
  # -- Key within `existingSecret` holding the value passed to the control plane
  # as HERMES_API_KEY.
  apiKeyKey: api-key

  # -- Non-secret environment variables.
  env: {}
  # -- Secret environment variables. Rendering these creates a chart-owned
  # Secret; prefer `existingSecret` outside of development.
  secrets: {}

  command: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- The upstream Hermes image runs an s6-overlay init as root, which chowns
  # /opt/data and then drops the application to the unprivileged `hermes` user
  # (uid 10000). So the container starts as root by design and runAsNonRoot is
  # not forced -- but the workload itself does not end up running as root.
  #
  # s6 needs five capabilities to do that hand-off. With `drop: [ALL]` alone it
  # fails with "s6-applyuidgid: unable to set supplementary group list" and
  # crash-loops. Everything else is still dropped and privilege escalation is
  # still denied.
  podSecurityContext:
    fsGroup: 10000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add:
        - CHOWN        # chown /opt/data to the hermes user
        - DAC_OVERRIDE # write into directories it has just re-owned
        - FOWNER       # chown files it does not already own
        - SETGID       # s6-applyuidgid: set the supplementary group list
        - SETUID       # s6-applyuidgid: drop from root to uid 10000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # -- Single host shortcut; `hosts` takes precedence when both are set.
    host: ""
    hosts: []
    tls: []

  # Used only when `hermes.enabled: false`.
  external:
    gatewayUrl: ""
    dashboardUrl: ""
    existingSecret: ""
    apiKeyKey: api-key

  # -- Shared secret for the Hermes API server. It is both API_SERVER_KEY on
  # the Hermes container and HERMES_API_KEY on the control plane, so the two
  # always agree. This is a chart-owned credential, not an AI provider
  # credential: nothing here requires an Anthropic/OpenAI/DeepSeek key.
  # Leave empty to generate one and preserve it across upgrades.
  apiKey: ""

  # -- `hermes.env` is not authoritative for credentials: a value typed into
  # the Hermes dashboard is written to the PVC and beats it on every restart.
  # `managed` is a pinned layer that wins instead -- see
  # docs/specs/hermes-managed-scope.md.
  managed:
    # -- Default off: an existing install renders unchanged on upgrade.
    enabled: false
    mountPath: /etc/hermes-managed
    # -- map[string]string, written verbatim as `.env`, one `KEY=value` line
    # per entry. Keys must match `^[A-Za-z_][A-Za-z0-9_]*$`.
    env: {}
    # -- Free-form mapping, rendered as `config.yaml`. Any leaf key can be
    # pinned, e.g. `model.default` alongside `model.api_key`.
    config: {}
    # -- BYO secret holding the same two files, under the keys named by
    # `existingSecretKeys` below. Mutually exclusive with inline `env`/`config`.
    existingSecret: ""
    # -- Only needed when the existing secret stores these files under other
    # key names. Empty means "already named `.env` / `config.yaml`", which
    # projects whichever of the two the secret actually has. A rename replaces
    # the projection wholesale, so if you name one you must name both.
    existingSecretKeys:
      env: ""
      config: ""
    # -- Env var -> "<secretName>.<key>" naming an entry in `credentials`
    # below. The literal value is pinned into the managed scope, so this and
    # the provider Secret can never drift apart. Requires
    # `hermes.managed.enabled: true`; composes with `env` above, but the same
    # key must not be set in both. See docs/specs/single-source-credentials.md.
    fromCredentials: {}
      # ANTHROPIC_API_KEY: anthropic-api-credentials.api-key

# ---------------------------------------------------------------------------
# Provider credentials
# ---------------------------------------------------------------------------
# One place to put AI provider credentials so a fresh install actually works.
# Each entry becomes a Secret whose name and keys are exactly what
# control-plane/internal/policy/defaults/providers.yaml references. This chart
# never invents a credential: an empty value renders no Secret at all, so an
# unset provider fails closed rather than authenticating with "". The four
# entries below are documented defaults matching the shipped providers.yaml,
# not an allowlist -- add any other entry to create a Secret for a provider
# this chart has never heard of. See docs/specs/single-source-credentials.md.
credentials:
  anthropic-api-credentials:
    api-key: ""
  anthropic-oauth-credentials:
    oauth-token: ""
  deepseek-credentials:
    api-key: ""
  openai-credentials:
    api-key: ""

# ---------------------------------------------------------------------------
# Work intake
# ---------------------------------------------------------------------------
# Spec 25: a GitHub issue carrying `label` becomes a board card. With no
# repositories listed there is no way to create a card at all, so the board
# stays empty however healthy everything else is.
github:
  # -- API root. Point at a GitHub Enterprise install by changing this.
  apiUrl: https://api.github.com
  # -- Repositories to ingest from, each "owner/name".
  repositories: []
  # -- Only issues carrying this label are eligible.
  label: agent-ready
  # -- Token with read access to those repositories' issues. Rendered into the
  # chart's Secret; leave empty and set `existingSecret` to bring your own.
  token: ""

# ---------------------------------------------------------------------------
# Model and provider policy
# ---------------------------------------------------------------------------
# Which vendor runs which phase is a configuration decision, never a code
# change. The control plane ships a working default, so leaving both of these
# empty is normal and correct.
#
# Supply either to override. Both are raw YAML documents; see
# control-plane/internal/policy/defaults/ for the shipped ones. Credentials are
# referenced by Secret name and key -- the chart never invents provider
# credentials, so create those Secrets yourself.
policy:
  # -- Contents of providers.yaml: harness, credentials and base URL per provider.
  providers: ""
  # -- Contents of models.yaml: phase -> ordered ladder of model aliases.
  models: ""
  # -- Contents of actions.yaml: the permitted-actions allowlist stamped onto
  # every card at creation (spec 5, 24). Optional even when providers and
  # models are supplied -- an operator who only wanted to change a model keeps
  # the shipped allowlist rather than having to restate it.
  actions: ""

# ---------------------------------------------------------------------------
# Control plane
# ---------------------------------------------------------------------------
# This chart deploys the control-plane image; it does not implement it.
controlPlane:
  enabled: true

  image:
    repository: ghcr.io/tuckermclean/strange-company-control-plane
    # -- Empty falls back to .Chart.appVersion, so no release ever ships
    # `latest`. Override with a fixture image in CI.
    tag: ""
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 8080

  # -- Extra Secret merged in with envFrom. The nine contract variables are
  # resolved by the chart and are not overridden by this Secret.
  existingSecret: ""

  # -- Where the `credentials` block above (see "Provider credentials") is
  # projected into this pod, one subdirectory per populated Secret:
  # <mountPath>/<secret>/<key>. Matches control-plane/internal/config's
  # CREDENTIALS_DIR default of /credentials; the chart sets CREDENTIALS_DIR to
  # this value whenever at least one `credentials` entry is populated, and
  # renders no volume, no mount and no CREDENTIALS_DIR at all otherwise. See
  # docs/specs/policy-selected-models.md, "Chart".
  credentials:
    mountPath: /credentials

  # -- Non-secret environment variables, added on top of the contract.
  env: {}

  command: []
  args: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  probes:
    # -- Kubernetes suppresses liveness and readiness until the startup probe
    # succeeds. Without it, a control plane waiting on a slow PostgreSQL gets
    # killed by liveness before it ever finishes booting.
    startup:
      enabled: true
      path: /healthz
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    hosts: []
    tls: []

  # -- The credential coding Jobs push their agent branch with.
  #
  # A DIFFERENT token from the one used for day-0 repository setup. This one is
  # handed to a coding agent, so give it contents:write and NOT
  # workflows:write: an agent able to rewrite CI can weaken the very checks
  # that verify it, and the runner refuses such a commit for the same reason.
  #
  # Deliberately NOT defaulted to the chart's own github-token. That token is
  # the operator's, and if it ever carries workflows:write for day-0 setup the
  # agent would silently inherit it. Name a Secret you created for this.
  gitCredential:
    secret: ""
    key: github-token
    authorName: strange-company agent
    authorEmail: agent@strange-company.invalid

  # -- How the red and green gates decide whether a ref's tests pass.
  #
  # `github-actions` reads the checks the repository's own workflows produced.
  # It is the default because a repository with CI has already declared its
  # tests, and a second declaration inside the repository is the one that
  # drifts. Your workflows must trigger on `agent/**` branches, or the agent
  # branch produces no checks at all -- which the control plane refuses rather
  # than reading as a pass.
  #
  # `test-command` instead runs an executable `.strange-company/test-command`
  # committed at the base ref, for repositories with no CI to read.
  verification:
    mode: github-actions

  # -- Permission to run coding agents as isolated Kubernetes Jobs.
  #
  # Default off. Enabling this is the ONLY thing in this chart that gives the
  # control plane any Kubernetes API access at all, so it is opt-in and scoped
  # to a single namespace. The Jobs it creates get no API access themselves.
  agentRuns:
    enabled: false
    # -- Namespace the coding Jobs run in. Must already exist, or set create.
    namespace: agent-runs
    # -- Create the namespace as part of this release.
    createNamespace: false
    # -- The image coding Jobs run. Empty tag follows the chart appVersion, so
    # a release never ships a runner pinned to `latest`.
    runnerImage:
      repository: ghcr.io/tuckermclean/strange-company-runner
      tag: ""

# ---------------------------------------------------------------------------
# Helm test pod
# ---------------------------------------------------------------------------
tests:
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
  # -- Cluster DNS domain, used to build fully qualified Service names in the
  # helm test pod. Only override this on clusters not using cluster.local.
  clusterDomain: cluster.local
