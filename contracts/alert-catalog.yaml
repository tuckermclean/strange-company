        expr: 'max(sc_runner_emergency_stop_level{source="effective"}) != max(sc_emergency_stop_level{source="effective"})'
        for: 2m
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "33"
      runbook: procedures/budget-emergency-stop.md
      specRefs: ["§81"]
    - alertname: SCBudgetHourlyCapReached
      summary: The global hourly spend cap is reached. New autonomous spending is denied until the hour rolls over.
      category: budget
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'max(sc_budget_exhausted{scope_kind="global_hour"}) == 1'
        for: 0s
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "33"
      runbook: procedures/budget-emergency-stop.md
      specRefs: ["§81"]
    - alertname: SCBudgetDispatchRefused
      summary: The Runner refused dispatch with BUDGET_EXCEEDED on a shared budget scope within the last 15 minutes; tasks wait for headroom (plan 33 §14.5, COST-7).
      category: budget
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum(increase(sc_runner_dispatch_refusals_total{code="BUDGET_EXCEEDED"}[15m])) > 0'
        for: 15m
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "33"
      runbook: procedures/budget-emergency-stop.md
      specRefs: ["§81", "§97"]
    - alertname: SCBudgetMetricsStale
      summary: Budget gauges have not been refreshed for 5 minutes. Budget dashboards and alerts are blind (enforcement is unaffected).
      category: budget
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'time() - max(sc_budget_metrics_updated_timestamp_seconds) > 300'
        for: 5m
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "33"
      runbook: procedures/gateway-failure.md
      specRefs: ["§81"]
    - alertname: SCAnomalousSpend
      summary: Model spend in the last 15 minutes exceeds 4x the 7-day p95 window (and $0.50), or exceeds $8.00 (plan 33 §14.8; thresholds rendered from policy/budgets.yaml).
      category: spend
      severity: critical
      notifyClass: page
      alwaysNotify: budget-stop
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: '(sc:model_spend_micro_usd:increase15m > 4 * quantile_over_time(0.95, sc:model_spend_micro_usd:increase15m[7d] offset 15m) and sc:model_spend_micro_usd:increase15m > 500000) or sc:model_spend_micro_usd:increase15m > 8000000'
        for: 0s
        recordingRulesUsed: ["sc:model_spend_micro_usd:increase15m"]
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "33"
      runbook: procedures/budget-emergency-stop.md
      specRefs: ["§81", "§96"]
      aliases: [AnomalousModelSpend]
    - alertname: SCGatewayBoundViolation
      summary: Reported provider usage exceeded the Gateway computed bound; the request cost more than reserved and the model is quarantined until acknowledged (plan 53 §14.4a, CD-28).
      category: spend
      severity: critical
      notifyClass: page
      alwaysNotify: budget-stop
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum by (provider, model) (increase(sc_gateway_bound_violations_total[15m])) > 0'
        for: 0s
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "53"
      runbook: procedures/gateway-failure.md
      specRefs: ["§81", "§97"]

    # ------------------------------------------------------------------ notification test
    - alertname: SCNotificationTest
      summary: Synthetic notification test. Carries a nonce the operator confirms.
      category: notification-test
      severity: info
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: external-post, posters: [bootstrap, operator], ttl: 15m, refreshInterval: 15m}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "42"
      runbook: procedures/notification-failure.md
      specRefs: ["§97"]
