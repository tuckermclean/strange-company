# Strange Company alert catalogue (SPEC §96, §97; ADR-0009; plan 42).
# Validated by contracts/alert-catalog.schema.yaml and by `make lint-alerts`.
# Expressions are sketches with exact metric names. Plan 42 renders them
# into PrometheusRule objects and pins them with promtool unit tests. Recording
# rules named sc:* are defined in plan 42 §8.3.
apiVersion: strange.company/v1alpha1
kind: AlertCatalog
metadata:
  name: strange-company
spec:
  alwaysNotifyReasons:
    - needs-human
    - budget-stop
    - failed-backup
    - critical-outage
    - failed-mirror
    - black-start-threat
    - security-audit

  notificationClasses:
    page:
      description: Immediate delivery to every configured transport, at high priority where the transport supports it.
      external: true
      groupWait: 30s
      groupInterval: 5m
      repeatInterval: 4h
      sendResolved: true
    notify:
      description: Delivery to every configured transport at normal priority.
      external: true
      groupWait: 2m
      groupInterval: 10m
      repeatInterval: 24h
      sendResolved: true
    silent:
      description: Not delivered externally. Visible in Alertmanager and on the Grafana "Firing alerts" panels.
      external: false
      groupWait: 5m
      groupInterval: 30m
      repeatInterval: 7d
      sendResolved: false
    heartbeat:
      description: Dead-man's switch. Watchdog goes to the operator's external heartbeat URL.
      external: true
      groupWait: 0s
      groupInterval: 1m
      repeatInterval: 1m
      sendResolved: false

  routing:
    groupBy: [alertname, category]
    severityFallback:
      critical: page
      warning: notify
      info: silent
      none: silent
    inhibitRules:
      - name: notifications-failing-stops-heartbeat
        sourceMatchers: ['alertname="SCAlertmanagerNotificationsFailing"']
        targetMatchers: ['alertname="Watchdog"']
        equal: []
        rationale: >
          If Alertmanager cannot deliver to any transport, the operator's external
          monitor must notice. Suppressing the heartbeat makes it fire.
      - name: node-down-inhibits-node-symptoms
        sourceMatchers: ['alertname="SCNodeDown"']
        targetMatchers: ['always_notify="none"']
        equal: [node]
        rationale: A dead node explains its filesystem, memory and scrape symptoms.
      - name: forgejo-down-inhibits-forgejo-symptoms
        sourceMatchers: ['alertname="SCForgejoDown"']
        targetMatchers: ['always_notify="none"', 'alertname=~"SCForgejoPublicEndpointDown|SCForgejoSSHDown|SCFluxReconciliationFailing"']
        equal: []
        rationale: Forgejo being down explains edge, SSH and Flux source failures.
      - name: edge-down-inhibits-public-endpoints
        sourceMatchers: ['alertname="SCEdgeDown"']
        targetMatchers: ['always_notify="none"', 'alertname=~"SC.*PublicEndpointDown"']
        equal: []
        rationale: One edge outage, one notification.
      - name: critical-inhibits-warning-same-alert
        sourceMatchers: ['severity="critical"']
        targetMatchers: ['severity="warning"', 'always_notify="none"']
        equal: [alertname, namespace]
        rationale: Upstream kube-prometheus convention, restricted to non-always-notify targets.
      - name: warning-inhibits-info-same-alert
        sourceMatchers: ['severity="warning"']
        targetMatchers: ['severity="info"', 'always_notify="none"']
        equal: [alertname, namespace]
        rationale: Upstream kube-prometheus convention.
      - name: info-inhibitor
        sourceMatchers: ['alertname="InfoInhibitor"']
        targetMatchers: ['severity="info"', 'always_notify="none"']
        equal: [namespace]
        rationale: Upstream kube-prometheus InfoInhibitor pattern.

  upstreamRules:
    chart: kube-prometheus-stack
    addedLabels:
      source: upstream
    keepGroups:
      - alertmanager.rules
      - config-reloaders
      - etcd
      - general.rules
      - k8s.rules
      - kube-apiserver-availability.rules
      - kube-apiserver-burnrate.rules
      - kube-apiserver-histogram.rules
      - kube-apiserver-slos
      - kube-prometheus-general.rules
      - kube-prometheus-node-recording.rules
      - kube-state-metrics
      - kubelet.rules
      - kubernetes-apps
      - kubernetes-resources
      - kubernetes-storage
      - kubernetes-system
      - kubernetes-system-apiserver
      - kubernetes-system-kubelet
      - node-exporter
      - node-exporter.rules
      - node-network
      - node.rules
      - prometheus
      - prometheus-operator
    disableGroups:
      - group: kubernetes-system-controller-manager
        reason: k3s embeds the controller-manager. Its metrics are served from the shared k3s registry through the apiserver scrape (plan 38 §7.3), so the separate up-check would always fire.
      - group: kubernetes-system-scheduler
        reason: Same as controller-manager.
      - group: kube-scheduler.rules
        reason: No separate scheduler job on k3s.
      - group: kubernetes-system-kube-proxy
        reason: kube-proxy is embedded in k3s and not scraped.
      - group: windows.node.rules
        reason: No Windows nodes.
      - group: windows.pod.rules
        reason: No Windows nodes.
    disableAlerts:
      - alertname: KubeJobFailed
        reason: Worker and CI Jobs fail by design (merit failures). Replaced by a platform-namespace-scoped rule.
        replacedBy: SCPlatformJobFailed
      - alertname: KubeCPUOvercommit
        reason: On one node any request counts as overcommit (the rule subtracts the largest node).
        profiles: [self-hosting-minimum]
      - alertname: KubeMemoryOvercommit
        reason: Same as KubeCPUOvercommit.
        profiles: [self-hosting-minimum]
      - alertname: CPUThrottlingHigh
        reason: Noisy on small nodes where workers run at their limits by design. Throttling is a dashboard signal.
      - alertname: etcdHighNumberofFailedGRPCRequests
        reason: Known false positives on embedded etcd (verify on the implementation k3s version).
      - alertname: Watchdog
        reason: The upstream general.rules group defines its own Watchdog; the catalogue Watchdog (routed to the heartbeat) replaces it so exactly one Watchdog series fires (GC-12).
        replacedBy: Watchdog
      - alertname: KubeNodeNotReady
        reason: Replaced by SCNodeDown, which has a shorter `for` and a defined route.
        replacedBy: SCNodeDown

  alerts:
    # ------------------------------------------------------------------ monitoring meta
    - alertname: Watchdog
      summary: Always-firing heartbeat. Delivered to the external dead-man's switch.
      category: monitoring
      severity: info
      notifyClass: heartbeat
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: "vector(1)", for: 0s}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§96", "§97"]
    - alertname: SCDeadMansSwitchNotConfigured
      summary: No external heartbeat URL is configured, so a total outage would go unnoticed.
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: black-start-threat
      blackStartThreat: true
      source: {kind: prometheus-rule, expr: "sc_notification_heartbeat_configured == 0", for: 1h}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "42"
      runbook: procedures/notification-failure.md
      specRefs: ["§97"]
    - alertname: SCAlertmanagerNotificationsFailing
      summary: Alertmanager has been failing to deliver notifications on an integration for 10 minutes.
      category: monitoring
      severity: critical
      notifyClass: page
      alwaysNotify: critical-outage
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum by (integration) (rate(alertmanager_notifications_failed_total[10m])) > 0'
        for: 10m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/notification-failure.md
      specRefs: ["§97"]
    - alertname: SCRunnerNotificationPostFailing
      summary: The Agent Runner cannot post organizational notifications to Alertmanager.
      category: monitoring
      severity: critical
      notifyClass: page
      alwaysNotify: needs-human
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum(increase(sc_runner_alert_posts_total{result="failure"}[10m])) > 0 and sum(increase(sc_runner_alert_posts_total{result="success"}[10m])) == 0'
        for: 10m
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "26"
      runbook: procedures/notification-failure.md
      specRefs: ["§97"]
    - alertname: SCSilencePolicyViolation
      summary: An Alertmanager silence covers an always-notify alert for more than 72 hours or has no issue reference (plan 42 §9.4).
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: check-cronjob
        cronjob: silence-audit
        namespace: monitoring
        maxAge: 2h
        failAfter: 30m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "42"
      runbook: procedures/notification-failure.md
      specRefs: ["§97"]
    - alertname: SCBreakGlassAlertSilenced
      summary: An active Alertmanager silence matches a break-glass detection alert (security-audit class). Break-glass use could go unnoticed.
      category: security
      severity: critical
      notifyClass: page
      alwaysNotify: security-audit
      blackStartThreat: false
      source:
        kind: check-cronjob
        cronjob: silence-audit-breakglass
        namespace: monitoring
        maxAge: 30m
        failAfter: 15m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "42"
      runbook: procedures/break-glass-access.md
      specRefs: ["§22"]
    - alertname: SCPrometheusCardinalityHigh
      summary: Prometheus head series exceed the cardinality budget.
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: "max(prometheus_tsdb_head_series) > 250000", for: 30m}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§90", "§91"]
    - alertname: SCPrometheusStorageNearCap
      summary: Prometheus TSDB is above 90% of its retention size cap. Retention is shorter than configured.
      category: monitoring
      severity: info
      notifyClass: silent
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: "max(prometheus_tsdb_storage_blocks_bytes + prometheus_tsdb_wal_storage_size_bytes) / max(sc_prometheus_retention_size_bytes) > 0.9"
        for: 1h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§107"]
    - alertname: SCPrometheusRetentionShort
      summary: Effective Prometheus retention is below 8 days. The anomalous-spend baseline (plan 33) is incomplete.
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: '(time() - min(prometheus_tsdb_lowest_timestamp_seconds)) < 8 * 86400 and on() (time() - min(kube_persistentvolumeclaim_created{namespace="monitoring",persistentvolumeclaim=~"prometheus-kps-prometheus-db-.*"})) > 9 * 86400'
        for: 1h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§107"]
    - alertname: SCMonitoringTargetDown
      summary: A Strange Company scrape target has been down for 10 minutes.
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'up{job=~"cnpg|longhorn|forgejo|authentik|flux|woodpecker|agent-runner|model-gateway|otel-collector|grafana|blackbox|cert-manager|traefik|cloudflared|kube-etcd|kube-state-metrics|node-exporter"} == 0'
        for: 10m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§91"]
    - alertname: SCOTelCollectorDown
      summary: The OpenTelemetry Collector is down. Spans and span metrics are being lost.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: 'absent(up{job="otel-collector"} == 1)', for: 10m}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "40"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§93"]
    - alertname: SCOTelCollectorRefusingData
      summary: The OpenTelemetry Collector is refusing or failing to export telemetry.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: "sum(rate(otelcol_receiver_refused_spans_total[10m])) + sum(rate(otelcol_exporter_send_failed_spans_total[10m])) > 0"
        for: 15m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "40"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§93"]
    - alertname: SCTelemetryForbiddenAttributeDropped
      summary: Telemetry carrying a forbidden attribute or a secret-pattern value was redacted. An emitter is leaking content.
      category: security
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: "sum(increase(sc_span_redactions_total[1h])) > 0", for: 0s}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "40"
      runbook: procedures/credential-compromise.md
      specRefs: ["§94"]
    - alertname: SCTelemetryDebugCaptureActive
      summary: A telemetry debug-capture grant is active, so content capture is enabled for its scope.
      category: security
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: "max(sc_telemetry_debug_grants_active) > 0", for: 0s}
      profiles: [self-hosting-minimum, small-ha]
      gate: C11
      ownerPlan: "42"
      signalOwnerPlan: "40"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§94"]
    - alertname: SCGrafanaDown
      summary: Grafana has been unreachable in-cluster for 10 minutes.
      category: monitoring
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: 'probe_success{probe="grafana"} == 0', for: 10m}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "39"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§92"]
    - alertname: SCLokiDown
      summary: Loki is unavailable. Logs are not being stored.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: 'absent(up{job="loki"} == 1)', for: 15m}
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95"]
    - alertname: SCTempoDown
      summary: Tempo is unavailable. Traces are not being stored.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: 'absent(up{job="tempo"} == 1)', for: 15m}
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95"]
    - alertname: SCLogAgentDown
      summary: A node has no running log agent, so its logs are not collected.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'kube_daemonset_status_number_available{namespace="monitoring-node",daemonset="otel-agent"} < kube_daemonset_status_desired_number_scheduled{namespace="monitoring-node",daemonset="otel-agent"}'
        for: 15m
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95"]
    - alertname: SCLogIngestionErrors
      summary: Loki is rejecting or dropping log lines.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: "sum(rate(loki_discarded_samples_total[15m])) > 0", for: 30m}
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95"]
    - alertname: SCTelemetryStorageWriteFailing
      summary: Loki or Tempo cannot write to the S3 telemetry bucket. Logs or traces are buffered on local WAL and will be lost if it fills.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum(rate(loki_ingester_chunks_flush_failures_total[15m])) > 0 or sum(rate(tempodb_backend_request_duration_seconds_count{status_code=~"5..|error"}[15m])) > 0'
        for: 30m
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95", "§107"]
    - alertname: SCLokiCompactorFailing
      summary: The Loki compactor has not completed a successful run (including retention deletes) for 3 hours.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'time() - max(loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds) > 10800 or absent(loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds)'
        for: 1h
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95", "§107"]
    - alertname: SCTempoCompactorFailing
      summary: The Tempo compactor reports failures or has not compacted for 3 hours. Retention may not be enforced.
      category: telemetry
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sum(increase(tempodb_compaction_errors_total[1h])) > 0 or (time() - max(tempodb_blocklist_poll_last_successful_timestamp_seconds) > 10800)'
        for: 1h
      profiles: [small-ha]
      gate: H03
      ownerPlan: "42"
      signalOwnerPlan: "41"
      runbook: procedures/monitoring-failure.md
      specRefs: ["§95", "§107"]

    # ------------------------------------------------------------------ nodes / disks
    - alertname: SCNodeDown
      summary: A Kubernetes node is NotReady or its node-exporter is unreachable.
      category: node
      severity: critical
      notifyClass: page
      alwaysNotify: critical-outage
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 0) or max by (node) (label_replace(up{job="node-exporter"}, "node", "$1", "instance", "(.*)") == 0)'
        for: 5m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/lost-node.md
      specRefs: ["§96"]
      aliases: [NodeDown, KubeNodeNotReady]
    - alertname: SCNodeDiskPressure
      summary: The kubelet reports DiskPressure. Evictions are imminent or in progress.
      category: node
      severity: critical
      notifyClass: page
      alwaysNotify: critical-outage
      blackStartThreat: false
      source: {kind: prometheus-rule, expr: 'kube_node_status_condition{condition="DiskPressure",status="true"} == 1', for: 2m}
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/disk-pressure.md
      specRefs: ["§96", "§107"]
    - alertname: SCNodeRootDiskLow
      summary: A node root filesystem is more than 75% used (plan 11 §12 warning threshold).
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.25'
        for: 10m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/disk-pressure.md
      specRefs: ["§96", "§107"]
    - alertname: SCNodeRootDiskCritical
      summary: A node root filesystem is more than 85% used. kubelet hard eviction starts at 10% free (plan 07 eviction-hard nodefs.available<10%).
      category: node
      severity: critical
      notifyClass: page
      alwaysNotify: critical-outage
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15'
        for: 5m
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "38"
      runbook: procedures/disk-pressure.md
      specRefs: ["§96", "§107"]
    - alertname: SCNodeRootDiskFillingUp
      summary: A node root filesystem is predicted to drop below 10% free within 24 hours.
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0.10 * node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}'
        for: 1h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "43"
      runbook: procedures/disk-pressure.md
      specRefs: ["§107"]
    - alertname: SCNodeJournalOversize
      summary: journald uses more than 1.1 GiB on a node.
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sc_node_journald_bytes > 1.1 * 1073741824'
        for: 1h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "43"
      runbook: procedures/disk-pressure.md
      specRefs: ["§107"]
    - alertname: SCRetentionEtcdSnapshotsExcess
      summary: More than 38 local etcd snapshots exist on a node.
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sc_etcd_snapshot_count{location="local"} > 38'
        for: 6h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "43"
      runbook: procedures/disk-pressure.md
      specRefs: ["§107", "§110"]
    - alertname: SCEtcdSnapshotDirLarge
      summary: The local etcd snapshot directory exceeds 2 GiB or snapshot pruning has not run for 2 days.
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
        expr: 'sc_etcd_snapshot_dir_bytes > 2 * 1073741824 or (time() - sc_etcd_snapshot_prune_last_run_timestamp_seconds) > 2 * 86400'
        for: 1h
      profiles: [self-hosting-minimum, small-ha]
      gate: P09
      ownerPlan: "42"
      signalOwnerPlan: "08"
      runbook: procedures/disk-pressure.md
      specRefs: ["§107", "§110"]
    - alertname: SCK3sUpgradeIncomplete
      summary: Nodes have run different k3s versions for 6 hours during or after an upgrade.
      category: node
      severity: warning
      notifyClass: notify
      alwaysNotify: none
      blackStartThreat: false
      source:
        kind: prometheus-rule
