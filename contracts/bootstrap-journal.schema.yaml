      s3_version_id: 3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY
      created_at: '2026-10-13T10:05:00Z'
      confirmed_at: '2026-10-13T10:12:30Z'
    pipelines:
      - pipeline: install
        generation: 1
        status: running
        started_at: '2026-10-13T10:00:00Z'
        finished_at: null
        phases:
          - name: preflight
            status: succeeded
            attempt: 2
            input_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
            started_at: '2026-10-13T10:38:00Z'
            finished_at: '2026-10-13T10:39:10Z'
            last_run_id: 20261013T103800Z-a1b2
            output_refs:
              - kind: file
                ref: .bootstrap/runs/20261013T103800Z-a1b2/preflight.json
                sha256: sha256:2222222222222222222222222222222222222222222222222222222222222222
            steps: []
            error: null
          - name: plan
            status: succeeded
            attempt: 1
            input_digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
            started_at: '2026-10-13T10:02:00Z'
            finished_at: '2026-10-13T10:20:00Z'
            last_run_id: 20261013T100000Z-9f8e
            output_refs:
              - kind: git-commit
                ref: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
            steps:
              - name: plan.install-identity
                status: succeeded
                attempt: 1
                started_at: '2026-10-13T10:02:00Z'
                finished_at: '2026-10-13T10:05:00Z'
                output_refs:
                  - kind: file
                    ref: /blackstart/prod/bundles/sc-recovery-prod-v1.tar.age
                error: null
              - name: plan.storage-apply
                status: succeeded
                attempt: 1
                output_refs:
                  - kind: tofu-state
                    ref: s3://sc-prod-tofu-state/prod/storage/terraform.tfstate
              - name: plan.confirm
                status: succeeded
                attempt: 1
            error: null
          - name: provision
            status: failed
            attempt: 1
            input_digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
            started_at: '2026-10-13T10:20:05Z'
            finished_at: '2026-10-13T10:41:12Z'
            last_run_id: 20261013T100000Z-9f8e
            output_refs: []
            steps:
              - name: provision.apply
                status: failed
                attempt: 1
                error:
                  code: PROVIDER_DELIVERY_TIMEOUT
                  message: ovh_vps order delivered no service within 20m
                  retryable: true
                  procedure: procedures/bootstrap-resume.md#provision
            error:
              code: PROVIDER_DELIVERY_TIMEOUT
              message: ovh_vps order delivered no service within 20m
              retryable: true
              procedure: procedures/bootstrap-resume.md#provision
    runs:
      - run_id: 20261013T100000Z-9f8e
        command: run
        started_at: '2026-10-13T10:00:00Z'
        finished_at: '2026-10-13T10:41:12Z'
        outcome: failed
        exit_code: 1
        operator: {user: alice, host: laptop}
        sc_bootstrap_version: v0.1.0
        toolbox:
          image_digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
          source: pulled
        git_head: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
    confirmations:
      - kind: paid-footprint
        subject_digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
        confirmed_at: '2026-10-13T10:19:40Z'
        run_id: 20261013T100000Z-9f8e
        method: interactive
x-invalid-examples:
  - reason: unknown phase name
    value:
      schema_version: v1alpha1
      record_type: bootstrap_journal
      journal_seq: 1
      cluster: prod
      install_uid: 6f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
      created_at: '2026-10-13T10:00:00Z'
      updated_at: '2026-10-13T10:00:00Z'
      installation: {state: new, provider: ovh, profile: self-hosting-minimum, config_digest: 'sha256:aa11bb22cc33dd44ee55ff6600112233445566778899aabbccddeeff00112233'}
      recovery_bundle: {status: absent, generation: 0}
      pipelines:
        - pipeline: install
          generation: 1
          status: running
          started_at: '2026-10-13T10:00:00Z'
          finished_at: null
          phases:
            - {name: helm-install, status: pending, attempt: 0, input_digest: null, started_at: null, finished_at: null, output_refs: [], steps: []}
      runs: []
      confirmations: []
  - reason: journal_seq must be >= 1
    value:
      schema_version: v1alpha1
      record_type: bootstrap_journal
      journal_seq: 0
      cluster: prod
      install_uid: 6f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
      created_at: '2026-10-13T10:00:00Z'
      updated_at: '2026-10-13T10:00:00Z'
