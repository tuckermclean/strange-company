      recovery_bundle: {status: absent, generation: 0}
      pipelines: []
      runs: []
      confirmations: []
  - reason: secret-looking free field is not allowed (closed object)
    value:
      schema_version: v1alpha1
      record_type: bootstrap_journal
      journal_seq: 3
      cluster: prod
      install_uid: 6f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
