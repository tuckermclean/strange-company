      sc_token_version: 1
      token_kind: orchestrator
      task_id: null
      execution_id: null
      attempt: null
      worker_id: hermes
      role: implementer
      harness: hermes
      phase: orchestration
      repository: null
      project: _platform
      tier_requested: null
      tier_effective: null
      allowed_models: []
      budget_scopes: [orchestration]
      max_concurrent_requests: 4
      policy_revision: 0123456789abcdef0123456789abcdef01234567
  - reason: Extra claim carrying a provider key (tokens never carry provider credentials).
    value:
      iss: sc-agent-runner
      aud: sc-model-gateway
      sub: orchestrator:hermes
      iat: 1792000000
      nbf: 1792000000
      exp: 1794678400
      jti: 9a7b0c11-2d3e-4f50-8a61-7b8c9d0e1f23
      sc_token_version: 1
      token_kind: orchestrator
      task_id: null
