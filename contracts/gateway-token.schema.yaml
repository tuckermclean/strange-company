    sc_token_version: 1
    token_kind: orchestrator
    task_id: null
    execution_id: null
    attempt: null
    worker_id: hermes
    role: orchestrator
    harness: hermes
    phase: orchestration
    repository: null
    project: _platform
    tier_requested: standard
    tier_effective: standard
    allowed_models:
      - {provider: deepseek, api_family: openai-chat-completions, model: deepseek-v4-pro, purpose: primary}
    budget_scopes: [orchestration]
    max_concurrent_requests: 4
    policy_revision: 0123456789abcdef0123456789abcdef01234567
  - iss: sc-agent-runner
    aud: sc-model-gateway
    sub: execution:sc-0-x7
    iat: 1792000000
    nbf: 1792000000
    exp: 1792000300
    jti: 0b5e2c41-7a6d-4e2f-9c13-5d7e8f9a0b1c
    sc_token_version: 1
    token_kind: execution
    task_id: sc-0
    execution_id: sc-0-x7
    attempt: 1
    worker_id: sc-0-x7
    role: tester
    harness: fake-success
    phase: specification
    repository: strange-company/strange-company
    project: _platform
    tier_requested: clerical
    tier_effective: clerical
    allowed_models:
      - {provider: fake, api_family: fake, model: fake-model, purpose: primary}
    budget_scopes: ["execution:sc-0-x7"]
    max_concurrent_requests: 1
    policy_revision: 0123456789abcdef0123456789abcdef01234567
x-invalid-examples:
  - reason: Wrong audience (a Runner task token presented to the Gateway).
    value:
      iss: sc-agent-runner
      aud: sc-agent-runner
      sub: execution:sc-184-x3
      iat: 1792000000
      nbf: 1792000000
      exp: 1792002100
      jti: 4f1c2a9e-3b7d-4c51-9a0e-6d2f8b7c1e44
      sc_token_version: 1
      token_kind: execution
      task_id: sc-184
      execution_id: sc-184-x3
      attempt: 1
      worker_id: sc-184-x3
      role: implementer
      harness: claude
      phase: implementation
      repository: strange-company/strange-company
      project: strange-company
      tier_requested: bargain
      tier_effective: bargain
      allowed_models:
        - {provider: anthropic, api_family: anthropic-messages, model: claude-sonnet-x, purpose: primary}
      budget_scopes: ["execution:sc-184-x3", "task:sc-184"]
      max_concurrent_requests: 4
      policy_revision: 0123456789abcdef0123456789abcdef01234567
  - reason: Execution token without task attribution (SPEC §78 requires task/execution/attempt).
    value:
      iss: sc-agent-runner
      aud: sc-model-gateway
      sub: execution:sc-184-x3
      iat: 1792000000
      nbf: 1792000000
      exp: 1792002100
      jti: 4f1c2a9e-3b7d-4c51-9a0e-6d2f8b7c1e44
      sc_token_version: 1
      token_kind: execution
      task_id: null
      execution_id: null
      attempt: null
