      evidence:
        - {phase: red, result: expected_failure, pipeline: 412, commit: 89abcdef0123456789abcdef0123456789abcdef, digest: "sha256:abababababababababababababababababababababababababababababababab", recorded_at: "2026-10-13T12:20:00Z"}
