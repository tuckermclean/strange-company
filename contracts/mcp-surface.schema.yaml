x-invalid-examples:
  - reason: base_ref names a Runner quarantine tag (trust anchor would be attacker-controlled; RA-1).
    value:
      tool: agent_start
      input:
        idempotency_key: hermes-bad-base-0001
        task:
          title: Bad base
          objective: Try to anchor policy on a quarantined commit.
          repository: projects/example
          base_ref: sc-quarantine/sc-170-x2
          source: {kind: hermes}
          acceptance_criteria: [{id: AC-1, text: Something observable.}]
          verification: {mode: test-first}
        role: tester
        harness: claude
        profile: tests
        model_tier: standard
      output:
        task_id: sc-1
        task_state: TEST_AUTHORING
        created_task: true
        execution_id: sc-1-x1
        execution_state: QUEUED
        attempt: 1
        resolved: {base_commit: 0123456789abcdef0123456789abcdef01234567, start_commit: 0123456789abcdef0123456789abcdef01234567, branch: agent/sc-1, harness: claude, harness_image_digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111", profile: tests, model_tier: standard, provider: anthropic, model: m, policy_revision: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
        idempotent_replay: false
  - reason: agent_start specifying an image and namespace (SPEC §62).
    value:
      tool: agent_start
      input: {idempotency_key: abcdefgh1234, task_id: sc-1, role: implementer, harness: claude, profile: implementation, model_tier: bargain, image: "evil/image:latest", namespace: kube-system}
      error: {code: FORBIDDEN_FIELD, message: x, retryable: false}
  - reason: agent_start with both task_id and an embedded task.
    value:
      tool: agent_start
      input:
        idempotency_key: abcdefgh1234
        task_id: sc-1
        task: {title: abc, objective: abcdefghijk, repository: a/b, base_ref: main, source: {kind: human}, acceptance_criteria: [{id: AC-1, text: abcde}], verification: {mode: test-first}}
        role: tester
        harness: claude
        profile: tests
        model_tier: standard
      error: {code: VALIDATION_FAILED, message: x, retryable: false}
  - reason: agent_start with raw resource values instead of a profile name.
    value:
      tool: agent_start
      input: {idempotency_key: abcdefgh1234, task_id: sc-1, role: implementer, harness: claude, profile: implementation, model_tier: bargain, resources: {limits: {memory: 64Gi}}}
      error: {code: FORBIDDEN_FIELD, message: x, retryable: false}
  - reason: agent_logs tail beyond the bound.
    value:
      tool: agent_logs
      input: {task_id: sc-1, tail_lines: 100000}
      error: {code: VALIDATION_FAILED, message: x, retryable: false}
  - reason: Invocation record with neither output nor error.
    value:
      tool: agent_status
      input: {task_id: sc-1}
  - reason: Unknown tool (no admin tools on the MCP surface).
    value:
      tool: agent_transition
      input: {task_id: sc-1, to: DONE}
      output: {}
