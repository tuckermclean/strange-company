x-defs-examples:
  InfraPriceCatalog:
    - apiVersion: strange.company/v1alpha1
      kind: InfraPriceCatalog
      metadata:
        name: ovh
        version: 2026.10.01
      spec:
        provider: ovh
        currency: EUR
        entries:
          - productId: ovh-vps-6c-12g-100nvme
            productLine: vps
            resourceType: ovh_vps
            planCode: vps-2025-model2
            displayName: VPS-2 (2025 range, verify)
            specs: {cpu: 6, memory: 12Gi, storage: {size: 100GB, class: nvme}}
            regions: [GRA, SBG, RBX, WAW, DE, UK]
            monthlyPrice: '9.99'
            setupFee: '0'
            commitment: P1M
            taxIncluded: false
            effectiveFrom: '2026-10-01'
            verifiedAt: '2026-10-01'
            sourceUrl: https://www.ovhcloud.com/en-ie/vps/
  TofuPlanGuard:
    - apiVersion: strange.company/v1alpha1
      kind: TofuPlanGuard
      metadata:
        name: ovh-vps
      spec:
        rootModule: infra/tofu/compute/ovh-vps
        allowedProviders: [registry.opentofu.org/ovh/ovh]
        forbidReplace: true
        resources:
          - type: ovh_vps
            paid: true
            allowedActions: [no-op, read, create, update]
            maxCount: expectedNodeCount
            priceProductFrom: plan[0].plan_code
