            - SHA256:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU
        hardware:
          cpu_count: 6
          memory_bytes: 12541607936
          disks:
            - name: sda
              size_bytes: 107374182400
              class: nvme
              class_source: provider-catalog
              role: root
