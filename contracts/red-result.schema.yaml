      reasons: []
      ac_results:
        - {ac_id: AC-1, kind: change, tests: ["unit::example.com/x/internal/httpx.TestRedirect307PreservesMethod"], outcome: failing_assertion}
      new_tests: ["unit::example.com/x/internal/httpx.TestRedirect307PreservesMethod"]
      computed_by: runner
      computed_at: "2026-10-13T12:20:00Z"
      policy_revision: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      verifier_lib_version: 0.1.0
