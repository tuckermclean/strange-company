        - {id: "unit::example.com/x/internal/httpx.TestRedirect302Unchanged", suite: unit, status_base: absent, status_head: passed}
      tests_truncated: false
      observed_at: "2026-10-13T12:19:40Z"
  - schema_version: v1alpha1
    document: red-result
    stage: classified
    observed:
      task_id: sc-184
      repository: projects/example
      phase: red
      subject: tests
      intent_id: vi-7f3a
      base_sha: 0123456789abcdef0123456789abcdef01234567
      head_sha: 89abcdef0123456789abcdef0123456789abcdef
      verifier: {version: 0.1.0, binary_sha256: "sha256:5555555555555555555555555555555555555555555555555555555555555555"}
      validation_blob: 7d1a0c3e9b2f4a6c8e0d1f3a5b7c9e1d3f5a7b9c
      toolchain_image: "git.example.org/strange-company/ci@sha256:6666666666666666666666666666666666666666666666666666666666666666"
      runs:
        - {tree: head, commit: 89abcdef0123456789abcdef0123456789abcdef, suite: unit, adapter: go-test-json, exit_code: 1, duration_ms: 43000, timed_out: false, build_failed: false, report_found: true, counts: {total: 215, passed: 212, failed_assertion: 1, failed_error: 0, stub_unimplemented: 0, skipped: 2}}
      tests:
        - {id: "unit::example.com/x/internal/httpx.TestRedirect307PreservesMethod", suite: unit, status_base: absent, status_head: failed_assertion}
      tests_truncated: false
      observed_at: "2026-10-13T12:19:40Z"
    scope:
      generation: 1
      generation_start_commit: 0123456789abcdef0123456789abcdef01234567
      changed_files:
        - {path: internal/httpx/redirect_test.go, change: added, class: test, blob_sha: 3b18e512dba79e4c8300dd08aeb37f8e728b8dad}
      stubs: []
      static_findings: []
    pipeline: {number: 412, intent_id: vi-7f3a, created_by: sc-runner, config_revision: 0123456789abcdef0123456789abcdef01234567, config_sha256: "7777777777777777777777777777777777777777777777777777777777777777", evidence_sha256: "8888888888888888888888888888888888888888888888888888888888888888"}
    classification:
