$schema: https://json-schema.org/draft/2020-12/schema
$id: https://strange.company/contracts/secret-classes/v1alpha1
title: SecretClassRegister
description: |
  Machine-readable register of every secret class in Strange Company (SPEC §98, §99;
  ADR-0012; owning plan: plans/35-secrets.md). The data file `contracts/secret-classes.yaml`
  is a document of this kind. Every class records its creator, consumers, storage locations,
  rotation, recovery and compromise response. The register holds METADATA ONLY. A secret
  value never appears in it.

  Semantic rules that JSON Schema cannot express are enforced by the F02 contract check
  (plan 52) and by `make secrets-lint` (plan 35):
  - class `id`s are unique, and instance names are unique within a class;
  - every `procedure` reference resolves to an existing file under `procedures/`;
  - every Kubernetes Secret rendered from Git carries the label `strange.company/secret-class`
    whose value is an `id` in this register (plus `strange.company/secret-instance` when the
    class has instances);
  - every class with `inRecoveryBundle: true` appears as an entry in the recovery-bundle
    manifest produced by `sc-bootstrap recovery-bundle create`.
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion:
    const: strange.company/v1alpha1
  kind:
    const: SecretClassRegister
  metadata:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9-]{1,62}$"
      description:
        type: string
  spec:
    type: object
    additionalProperties: false
    required: [classes]
    properties:
      classes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/SecretClass"
$defs:
  ClassId:
    type: string
    pattern: "^SC-[A-Z0-9]+(-[A-Z0-9]+)*$"
  PlanRef:
    type: string
    pattern: "^[0-9]{2}$"
  ProcedureRef:
    type: string
    pattern: "^procedures/[a-z0-9-]+\\.md(#[a-z0-9-]+)?$"
  Duration:
    description: ISO-8601 duration subset (e.g. P90D, P1Y, PT1H, PT45M).
    type: string
    pattern: "^P(?!$)([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$"
  InstanceName:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  Location:
    description: One place where the secret (or its authoritative source) lives.
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind:
        type: string
        enum:
          - sops-git           # SOPS-encrypted file in the strange-company repo, two recipients
          - offcluster-sops    # SOPS-encrypted file under secrets/offcluster/, recovery recipient only
          - k8s-secret         # in-cluster Kubernetes Secret
          - recovery-bundle    # passphrase-encrypted recovery bundle (local + S3 <prefix>-recovery)
          - operator-offline   # held only by the operator (paper, password manager, hardware token)
          - bootstrap-env      # operator-supplied bootstrap.env on the operator machine
          - local-bootstrap-dir  # .bootstrap/<install>/ on the operator machine (mode 0600)
          - node-file          # file on a cluster node's disk (root-only)
          - woodpecker-secret  # Woodpecker repository secret (stored in woodpecker-pg)
          - forgejo-db         # stored (hashed or encrypted) by Forgejo in forgejo-pg
          - sc-pg              # Strange Company database (hash, public key or revocation record only)
          - external-service   # held by a third party (provider console, GitHub, Cloudflare)
          - process-memory     # only in the memory of the issuing/consuming process
          - ephemeral-k8s-secret # per-execution Secret deleted at execution end
          - pvc-file           # file on a PersistentVolume (and therefore in that volume's backups)
          - pod-spec-env       # literal value in a Pod spec env (stored unencrypted in etcd and etcd snapshots)
      path:
        description: Repository-relative path (pattern) or node path.
        type: string
      namespace:
        type: string
        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      name:
        description: Object name or name pattern.
        type: string
      keys:
        type: array
        items:
          type: string
      authoritative:
        description: True for the location that is the source of truth for recovery.
        type: boolean
      notes:
        type: string
    allOf:
      - if:
          properties:
            kind:
              enum: [sops-git, offcluster-sops, node-file, local-bootstrap-dir]
        then:
          required: [path]
      - if:
          properties:
            kind:
              enum: [k8s-secret, ephemeral-k8s-secret, pvc-file, pod-spec-env]
        then:
          required: [namespace, name]
  Consumer:
    type: object
    additionalProperties: false
    required: [component]
    properties:
      component:
        type: string
        minLength: 2
      namespace:
        type: string
      access:
        type: string
        enum: [use, verify, decrypt, admin]
        default: use
      notes:
        type: string
  Instance:
    description: A concrete credential inside a class family (per bucket, per bot, per cluster, per provider).
    type: object
    additionalProperties: false
    required: [name, description]
    properties:
      name:
        $ref: "#/$defs/InstanceName"
      description:
        type: string
      scope:
        description: The narrowest grant this instance holds (e.g. bucket and permissions, token scopes).
        type: string
      consumers:
        type: array
        items:
          $ref: "#/$defs/Consumer"
      storage:
        type: array
        items:
          $ref: "#/$defs/Location"
      inRecoveryBundle:
        type: boolean
  Rotation:
    type: object
    additionalProperties: false
    required: [mode, procedure, blastRadius, downtime]
    properties:
      mode:
        type: string
        enum:
          - scheduled        # rotated at least every maxAge
          - on-compromise    # rotated only on compromise or role change (rotation is disruptive)
          - per-use          # ephemeral; a new value per execution/use
          - automatic        # rotated by the owning software (e.g. cert-manager renewal)
      maxAge:
        $ref: "#/$defs/Duration"
      triggers:
        type: array
        items:
          type: string
          enum: [schedule, compromise-suspected, operator-change, after-use, provider-forced, key-expiry, recovery-drill, policy-change]
      procedure:
        $ref: "#/$defs/ProcedureRef"
      blastRadius:
        type: string
        minLength: 5
      downtime:
        type: string
        minLength: 2
      bundleUpdateRequired:
        description: True when rotating this class requires a new recovery-bundle version.
        type: boolean
    allOf:
      - if:
          properties:
            mode:
              const: scheduled
        then:
          required: [maxAge]
  Recovery:
    type: object
    additionalProperties: false
    required: [from]
    properties:
      from:
        type: array
        minItems: 1
        items:
          type: string
          enum: [recovery-bundle, offline-recovery-identity, sops-git, regenerate, provider-console, operator, cnpg-restore, forgejo-restore, etcd-snapshot, not-recoverable-by-design]
      procedure:
        $ref: "#/$defs/ProcedureRef"
      notes:
        type: string
  Compromise:
    type: object
    additionalProperties: false
    required: [severity, procedure, actions]
    properties:
      severity:
        type: string
        enum: [sev1, sev2, sev3]
      procedure:
        $ref: "#/$defs/ProcedureRef"
      actions:
        type: array
        minItems: 1
        items:
          type: string
  SecretGenerationLedger:
    description: |
      Per-installation rotation ledger stored at s3://<prefix>-recovery/<cluster>/generations.json
      (plan 35 §14.9). snake_case record. Never contains secret values or digests of values.
      Append-only in content: every write contains all previous entries.
    type: object
    additionalProperties: false
    required: [install_id, updated_at, entries]
    properties:
      install_id:
        type: string
        pattern: "^[a-z][a-z0-9-]{1,30}$"
      updated_at:
        type: string
        format: date-time
      entries:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [class, generation, rotated_at, actor, reason]
          properties:
            class:
              $ref: "#/$defs/ClassId"
            instance:
              $ref: "#/$defs/InstanceName"
            generation:
              type: integer
              minimum: 1
            rotated_at:
              type: string
              format: date-time
            actor:
              description: "human:<name> or tool identity (e.g. sc-bootstrap)"
              type: string
              pattern: "^(human:[A-Za-z0-9._-]+|sc-bootstrap|agent-runner)$"
            reason:
              type: string
              enum: [initial, schedule, compromise, operator-change, recovery-drill, black-start, provider-forced, lost]
            bundle_version:
              type: integer
              minimum: 1
            commit:
              type: string
              pattern: "^[a-f0-9]{40}$"
  SecretClass:
    type: object
    additionalProperties: false
    required: [id, title, description, ownerPlan, sensitivity, lifetime, format, creator, consumers, storage, inRecoveryBundle, rotation, recovery, compromise]
    properties:
      id:
        $ref: "#/$defs/ClassId"
      title:
        type: string
        minLength: 3
      description:
        type: string
        minLength: 10
      ownerPlan:
        $ref: "#/$defs/PlanRef"
      relatedPlans:
        type: array
        items:
          $ref: "#/$defs/PlanRef"
      sensitivity:
        type: string
        enum: [critical, high, medium, low]
      lifetime:
        type: string
        enum: [long-lived, ephemeral]
      ttl:
        description: Maximum lifetime of one value (required for ephemeral classes).
        $ref: "#/$defs/Duration"
      format:
        type: string
        enum: [random-token, password, passphrase, age-identity, ssh-keypair, x509-ca, x509-client-cert, kubeconfig, oauth-client, api-token, jwt-signing-key, jwt, s3-access-key, cosign-keypair, hmac-key, secret-url, provider-credentials, app-secret-set]
      creator:
        type: object
        additionalProperties: false
        required: [actor, when]
        properties:
          actor:
            type: string
            minLength: 2
          when:
            type: string
            minLength: 2
      consumers:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Consumer"
      storage:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Location"
      instances:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Instance"
      inRecoveryBundle:
        type: boolean
      forbiddenIn:
        description: Places this class must never reach (checked by admission, scrubbing and scanning).
        type: array
        items:
          type: string
          enum: [git-plaintext, logs, telemetry, task-records, worker-pods, ci-verification-pipelines, hermes, operator-laptop-at-rest]
      rotation:
        $ref: "#/$defs/Rotation"
      recovery:
        $ref: "#/$defs/Recovery"
      compromise:
        $ref: "#/$defs/Compromise"
    allOf:
      - if:
          properties:
            lifetime:
              const: ephemeral
        then:
          required: [ttl]
          properties:
            rotation:
              properties:
                mode:
                  const: per-use
      - if:
          properties:
            inRecoveryBundle:
              const: true
        then:
          properties:
            storage:
              contains:
                type: object
                properties:
                  kind:
                    const: recovery-bundle
                required: [kind]
examples:
  - apiVersion: strange.company/v1alpha1
    kind: SecretClassRegister
    metadata:
      name: example
    spec:
      classes:
        - id: SC-K3S-TOKEN
          title: k3s cluster join token
          description: Shared secret that authenticates k3s servers and agents joining the cluster and encrypts k3s bootstrap data in etcd.
          ownerPlan: "07"
          sensitivity: critical
          lifetime: long-lived
          format: random-token
          creator: {actor: sc-bootstrap (configure phase), when: first k3s server install}
          consumers:
            - {component: k3s server and agents, access: use}
          storage:
            - {kind: node-file, path: /var/lib/rancher/k3s/server/token}
            - {kind: offcluster-sops, path: "secrets/offcluster/<install>/k3s-token.sops.yaml", authoritative: true}
            - {kind: recovery-bundle}
          inRecoveryBundle: true
          forbiddenIn: [git-plaintext, logs, worker-pods]
          rotation:
            mode: on-compromise
            triggers: [compromise-suspected, operator-change]
            procedure: procedures/rotate-secrets.md#sc-k3s-token
            blastRadius: Node join and etcd snapshot restore; running workloads unaffected.
            downtime: none (rolling k3s restart)
            bundleUpdateRequired: true
          recovery:
            from: [recovery-bundle, offline-recovery-identity]
            procedure: procedures/total-cluster-loss.md
          compromise:
            severity: sev1
            procedure: procedures/credential-compromise.md#cluster-and-node
            actions: [Rotate the token with k3s token rotate, Rebuild the bundle]
        - id: SC-WORKER-DEPLOY-KEY
          title: Per-execution Forgejo deploy key
          description: Ed25519 key registered as a deploy key on exactly one repository for one worker execution (ADR-0007).
          ownerPlan: "26"
          sensitivity: medium
          lifetime: ephemeral
          ttl: PT1H30M
          format: ssh-keypair
          creator: {actor: agent-runner, when: execution dispatch}
          consumers:
            - {component: worker Job, namespace: agent-jobs}
          storage:
            - {kind: ephemeral-k8s-secret, namespace: agent-jobs, name: "sc-exec-<execution-id>"}
            - {kind: forgejo-db, notes: public half only}
          inRecoveryBundle: false
          rotation:
            mode: per-use
            procedure: procedures/rotate-secrets.md#sc-worker-deploy-key
            blastRadius: One repository, unprotected refs only, for one execution window.
            downtime: none
          recovery:
            from: [not-recoverable-by-design]
          compromise:
            severity: sev3
            procedure: procedures/credential-compromise.md#ephemeral-execution-credentials
            actions: [Cancel the execution, Delete the deploy key, Quarantine refs pushed with the key]
x-invalid-examples:
  - reason: Ephemeral class without a ttl.
    value:
      apiVersion: strange.company/v1alpha1
      kind: SecretClassRegister
      metadata: {name: bad}
      spec:
        classes:
          - id: SC-GATEWAY-TOKEN
            title: Gateway token
            description: Per-execution model gateway token without a TTL.
            ownerPlan: "53"
            sensitivity: medium
            lifetime: ephemeral
            format: jwt
            creator: {actor: agent-runner, when: dispatch}
            consumers: [{component: worker}]
            storage: [{kind: process-memory}]
            inRecoveryBundle: false
            rotation: {mode: per-use, procedure: procedures/rotate-secrets.md, blastRadius: one execution, downtime: none}
            recovery: {from: [not-recoverable-by-design]}
            compromise: {severity: sev3, procedure: procedures/credential-compromise.md, actions: [revoke]}
  - reason: inRecoveryBundle is true but no recovery-bundle storage location is listed.
    value:
      apiVersion: strange.company/v1alpha1
      kind: SecretClassRegister
      metadata: {name: bad}
      spec:
        classes:
          - id: SC-TOFU-ENCRYPTION
            title: OpenTofu state passphrase
            description: Passphrase for OpenTofu state encryption.
            ownerPlan: "06"
            sensitivity: critical
            lifetime: long-lived
            format: passphrase
            creator: {actor: sc-bootstrap, when: preflight}
            consumers: [{component: OpenTofu}]
            storage: [{kind: local-bootstrap-dir, path: .bootstrap/x/tofu.pass}]
            inRecoveryBundle: true
            rotation: {mode: on-compromise, procedure: procedures/rotate-secrets.md, blastRadius: state, downtime: none}
            recovery: {from: [recovery-bundle]}
            compromise: {severity: sev1, procedure: procedures/credential-compromise.md, actions: [rotate]}
  - reason: Class id is not upper-case SC- form.
    value:
      apiVersion: strange.company/v1alpha1
      kind: SecretClassRegister
      metadata: {name: bad}
      spec:
        classes:
          - id: sc-lowercase
            title: Bad id
            description: Identifier is not in register form.
            ownerPlan: "35"
            sensitivity: low
            lifetime: long-lived
            format: random-token
            creator: {actor: x, when: y}
            consumers: [{component: x}]
            storage: [{kind: process-memory}]
            inRecoveryBundle: false
            rotation: {mode: on-compromise, procedure: procedures/rotate-secrets.md, blastRadius: none really, downtime: none}
            recovery: {from: [regenerate]}
            compromise: {severity: sev3, procedure: procedures/credential-compromise.md, actions: [rotate]}
  - reason: Scheduled rotation without maxAge.
    value:
      apiVersion: strange.company/v1alpha1
      kind: SecretClassRegister
      metadata: {name: bad}
      spec:
        classes:
          - id: SC-RENOVATE
            title: Renovate token
            description: Forgejo token for the Renovate bot.
            ownerPlan: "23"
            sensitivity: medium
            lifetime: long-lived
            format: api-token
            creator: {actor: sc-bootstrap, when: P11}
            consumers: [{component: renovate}]
            storage: [{kind: sops-git, path: gitops/clusters/x/secrets/renovate/renovate-token.sops.yaml}]
            inRecoveryBundle: false
            rotation: {mode: scheduled, procedure: procedures/rotate-secrets.md, blastRadius: Renovate PRs, downtime: none}
            recovery: {from: [sops-git]}
            compromise: {severity: sev2, procedure: procedures/credential-compromise.md, actions: [revoke token]}
  - reason: A sops-git location without a path.
    value:
      apiVersion: strange.company/v1alpha1
      kind: SecretClassRegister
      metadata: {name: bad}
      spec:
        classes:
          - id: SC-GRAFANA-ADMIN
            title: Grafana admin
            description: Grafana local admin password.
            ownerPlan: "39"
            sensitivity: medium
            lifetime: long-lived
            format: password
            creator: {actor: sc-bootstrap, when: seal}
            consumers: [{component: grafana}]
            storage: [{kind: sops-git}]
            inRecoveryBundle: false
            rotation: {mode: on-compromise, procedure: procedures/rotate-secrets.md, blastRadius: grafana, downtime: none}
            recovery: {from: [sops-git]}
            compromise: {severity: sev3, procedure: procedures/credential-compromise.md, actions: [rotate]}
