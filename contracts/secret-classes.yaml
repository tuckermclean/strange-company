        procedure: procedures/credential-compromise.md#observability-and-notification
        actions: [Rotate]

    - id: SC-BREAK-GLASS-INFRA
      title: Infrastructure break-glass (provider console)
      description: Provider account console login with MFA recovery codes, held by the operator. The rest of the infrastructure break-glass toolkit is the bundled SC-INFRA-PROVIDER, SC-DNS-API, SC-DNS-TUNNEL, SC-OBJECT-STORAGE/admin and SC-TOFU-ENCRYPTION (plan 15 §14.4).
      ownerPlan: "15"
      relatedPlans: ["03", "08", "35"]
      sensitivity: critical
      lifetime: long-lived
      format: provider-credentials
      creator: {actor: operator (provider console), when: before bootstrap}
      consumers:
        - {component: "operator during break-glass (console, rescue mode)"}
      storage:
        - {kind: operator-offline, authoritative: true}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
