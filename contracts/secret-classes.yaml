      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P90D
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-runner
        blastRadius: Trigger pipelines as sc-runner (the Runner rejects evidence from pipelines without a served intent, ADR-0302).
        downtime: seconds
      recovery: {from: [sops-git, regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
        actions: [Revoke, Mark evidence from pipelines created after exposure for re-verification]

    - id: SC-WOODPECKER-MAINT
      title: Woodpecker maintenance token
      description: Woodpecker personal token of sc-woodpecker used by the sc-ci-maint CronJob (log pruning, drift checks, plan 20 §8.7) and by sc-ci-config's 60-second agent audit loop, which deletes the release secrets on a build-lane agent mismatch (plan 20, review SEC-8).
      ownerPlan: "20"
      relatedPlans: ["43"]
      sensitivity: medium
      lifetime: long-lived
      format: api-token
      creator: {actor: sc-bootstrap ci-init, when: P08}
      consumers:
        - {component: sc-ci-maint CronJob, namespace: woodpecker}
        - {component: sc-ci-config (agent audit loop; deletes release secrets on mismatch), namespace: woodpecker}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/woodpecker/sc-ci-maint-token.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: woodpecker, name: sc-ci-maint-token}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P180D
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-maint
        blastRadius: "Repository-admin actions in Woodpecker on activated repositories (settings, logs, repository secrets); a holder can read pipeline metadata, change settings and delete or overwrite the release secrets (denial of releases; overwriting would let a forged secret value reach the next release, caught by signature verification against trusted keys). Held by two components (sc-ci-maint, sc-ci-config)."
        downtime: one CronJob run
      recovery: {from: [sops-git, regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
        actions: [Revoke, Audit repository settings and crons (sc-ci-maint drift report)]

    - id: SC-CI-INTENTS
      title: CI verification-intent bearer
      description: Shared bearer between sc-ci-config (client) and the Runner hooks listener (server) for GET /v1/ci/intents and POST /v1/ci/intents/{id}/served (plan 20, ADR-0302).
      ownerPlan: "20"
      relatedPlans: ["26", "22"]
      sensitivity: high
      lifetime: long-lived
      format: random-token
      creator: {actor: "sc-bootstrap pre-seed (32 random bytes, base64url)", when: plan.install-identity}
