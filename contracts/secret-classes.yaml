    # ------------------------------------------------------------------ control plane
    - id: SC-RUNNER-SIGNING
      title: Runner token-issuer signing key
      description: Ed25519 JWT signing key (with kid) used by the Runner to mint SC-WORKER-TASK-TOKEN (aud sc-agent-runner-worker for token_use runner, sc-egress-proxy for token_use egress; contracts/task-token.schema.yaml) and SC-GATEWAY-TOKEN (aud sc-model-gateway; contracts/gateway-token.schema.yaml). Verifiers receive only the public JWKS (ConfigMap sc-runner-jwks, Git-rendered by the chart from the committed JWKS; the Runner never writes it).
      ownerPlan: "26"
      relatedPlans: ["53", "35"]
      sensitivity: critical
      lifetime: long-lived
      format: jwt-signing-key
      creator: {actor: sc-bootstrap secrets generate (toolbox), when: before C01 (PR)}
      consumers:
        - {component: agent-runner (sign), namespace: strange-company}
        - {component: model-gateway and agent-runner (public JWKS only), namespace: strange-company, access: verify}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/agent-runner-signing.sops.yaml", authoritative: true, notes: "keys private.pem, kid (current) and previous.pem, previous_kid during overlap"}
        - {kind: k8s-secret, namespace: strange-company, name: agent-runner-signing}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P180D
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-runner-signing
        blastRadius: Anyone holding it can mint task and gateway tokens (gateway tokens additionally need DB registration, ADR-0451).
        downtime: "none (two kids published for ≥ 24 h, longer than the worker token TTL; the Hermes gateway token is re-minted at the kid switch, COST-16)"
      recovery: {from: [sops-git, regenerate]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#control-plane-tokens
        actions: [Engage emergency stop level workers, Rotate without keeping the previous kid, Cancel running executions, Review the ledger for unknown jtis]

    - id: SC-RUNNER-HERMES
      title: Hermes to Runner MCP credential
      description: Bearer credential Hermes presents to the Runner MCP listener (ADR-0003). Generated and rotated by the Runner (ADR-0401) and written into the Hermes managed scope; the Runner stores only its sha256.
      ownerPlan: "26"
      relatedPlans: ["24"]
      sensitivity: high
      lifetime: long-lived
      format: random-token
      creator: {actor: agent-runner token issuer (ADR-0401), when: first Runner start and every rotation}
      consumers:
        - {component: Hermes (managed scope), namespace: hermes}
        - {component: agent-runner (constant-time hash compare), namespace: strange-company, access: verify}
      storage:
        - {kind: k8s-secret, namespace: hermes, name: hermes-managed-env, authoritative: true}
        - {kind: sc-pg, notes: sha256 in runner.tokens (kind hermes_mcp)}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, ci-verification-pipelines]
      rotation:
        mode: automatic
        maxAge: P30D
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-runner-hermes
        blastRadius: Start/cancel tasks within budget and policy limits.
        downtime: "< 1 min (Hermes rollout; 24 h overlap)"
      recovery: {from: [regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#control-plane-tokens
        actions: [Force rotation without overlap, Review tasks started since exposure]

    - id: SC-RUNNER-ADMIN
      title: Runner break-glass admin token
      description: Bearer token for the Runner loopback admin API (human-only transitions, quarantine, emergency stop), reachable only through kubectl port-forward (ADR-0400). The cluster stores only its sha256.
      ownerPlan: "26"
      relatedPlans: ["33", "15"]
      sensitivity: high
      lifetime: long-lived
      format: random-token
      creator: {actor: "sc-bootstrap (32 random bytes, base64url)", when: plan.install-identity}
      consumers:
        - {component: operator via port-forward (plan 50 CLI wrappers), access: admin}
        - {component: agent-runner (hash compare), namespace: strange-company, access: verify}
      storage:
        - {kind: recovery-bundle, authoritative: true}
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/runner-admin.sops.yaml"}
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/agent-runner-admin.sops.yaml", notes: sha256 only (token-sha256)}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, after-use, compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-runner-admin
        blastRadius: Human-only task transitions, quarantine and emergency stop (requires port-forward, i.e. cluster credentials).
        downtime: none (Runner reloads the hash file within 60 s)
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, offline-recovery-identity, regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#control-plane-tokens
        actions: [Rotate, Review SCRunnerAdminAccess alerts and transitions with actor human:*]

    - id: SC-WORKER-TASK-TOKEN
      title: Per-execution Runner task token
      description: JWT (EdDSA, kid) per contracts/task-token.schema.yaml with claims task_id, execution_id, attempt, token_use, aud (sc-agent-runner-worker for runner, sc-egress-proxy for egress), exp = Job deadline + 300 s. The runner instance lets the sc-worker container fetch its packet, heartbeat and post its result; the egress instance authenticates the harness to the egress proxy.
      ownerPlan: "26"
      relatedPlans: ["27"]
      sensitivity: medium
      lifetime: ephemeral
      ttl: PT1H20M
      format: jwt
      creator: {actor: agent-runner, when: execution dispatch}
      consumers:
        - {component: worker Job, namespace: agent-jobs}
        - {component: agent-runner worker API, namespace: strange-company, access: verify}
      storage:
        - {kind: ephemeral-k8s-secret, namespace: agent-jobs, name: "<execution-id>", keys: [task-token, egress-token]}
        - {kind: sc-pg, notes: jti and revocation state only}
      instances:
        - name: runner
          description: "token_use runner, aud sc-agent-runner-worker (key task-token): packet, heartbeat, result on the Runner worker listener; mounted only in the sc-worker container (plan 26 two-container isolation)."
        - name: egress
          description: "token_use egress, aud sc-egress-proxy (key egress-token): Basic-auth credential for the egress proxy's per-execution allowlist (ADR-0150, contracts/task-token.schema.yaml); mounted only in the harness container; rejected on the worker listener (26-AC-35)."
          consumers: [{component: harness container (worker Job), namespace: agent-jobs}, {component: egress-proxy listener agent (verifies), namespace: strange-company, access: verify}]
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, task-records, hermes]
      rotation:
        mode: per-use
        triggers: [after-use]
        procedure: procedures/rotate-secrets.md#sc-worker-task-token
        blastRadius: One execution's result channel.
        downtime: none
      recovery: {from: [not-recoverable-by-design]}
      compromise:
        severity: sev3
        procedure: procedures/credential-compromise.md#ephemeral-execution-credentials
        actions: [Cancel the execution (revokes the jti)]

    - id: SC-GATEWAY-TOKEN
      title: Model Gateway caller token
      description: JWT binding task, execution, attempt, role, harness, allowed provider/model set and budget scope (ADR-0004, ADR-0451; claims in gateway-token.schema.yaml). Per execution for workers; a long-lived revocable orchestrator instance for Hermes, minted and rotated by the Runner.
      ownerPlan: "53"
      relatedPlans: ["26", "24"]
      sensitivity: high
      lifetime: ephemeral
      ttl: PT1H20M
      format: jwt
      creator: {actor: agent-runner, when: execution dispatch (workers); Runner rotation timer (Hermes instance)}
      consumers:
        - {component: worker harness, namespace: agent-jobs}
        - {component: model-gateway, namespace: strange-company, access: verify}
      storage:
        - {kind: ephemeral-k8s-secret, namespace: agent-jobs, name: "<execution-id>", keys: [gateway-token]}
        - {kind: sc-pg, notes: "ledger.gateway_tokens jti, claims digest and revocation state"}
      instances:
        - name: worker
          description: Per-execution token, exp = deadline + 5 m startup grace + 10 m.
        - name: hermes
          description: Hermes orchestrator token (lifetime ≤ 31 days = one 30-day rotation plus overlap, revocable), delivered via the Hermes managed scope by the Runner (ADR-0401). The Runner re-mints it whenever the SC-RUNNER-SIGNING key id changes, so it never outlives its signing key's JWKS presence (review COST-16).
          storage: [{kind: k8s-secret, namespace: hermes, name: hermes-managed-env, authoritative: true}]
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, task-records]
      rotation:
        mode: per-use
        triggers: [after-use, schedule, compromise-suspected]
        procedure: procedures/rotate-model-credentials.md
        blastRadius: Model spend within the token's budget scope and model allowlist.
        downtime: none
      recovery: {from: [regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#model-provider-keys
        actions: [Revoke the jti, For the Hermes instance force rotation and restart Hermes]

