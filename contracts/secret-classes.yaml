        triggers: [after-use]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-admin
        blastRadius: Woodpecker administration for at most one hour.
        downtime: none
      recovery: {from: [regenerate]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
