        blastRadius: Read pending verification intents and attest served configs (forged attestations are cross-checked by the Runner's own config digest, plan 20 I5).
        downtime: "< 5 min (both copies in one PR; verification pauses)"
      recovery: {from: [sops-git]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
        actions: [Rotate both copies in one PR, Re-verify evidence accepted since exposure]

    - id: SC-WOODPECKER-ADMIN
      title: Short-lived Woodpecker admin token
      description: Token of a Woodpecker admin user obtained on demand by sc-bootstrap to configure repository settings, crons and agents. Never persisted.
      ownerPlan: "20"
      relatedPlans: ["23", "50"]
      sensitivity: high
      lifetime: ephemeral
