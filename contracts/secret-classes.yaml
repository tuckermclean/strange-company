      recovery: {from: [sops-git, provider-console]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#model-provider-keys
        actions: [Engage emergency stop, Revoke at the provider, Compare provider usage to the Gateway ledger, Rotate]

    - id: SC-HERMES-API
      title: Hermes gateway API key
      description: API_SERVER_KEY that Hermes' own gateway API requires (L-1). Generated and rotated by the Runner (ADR-0401); used by operators and integrations to talk to Hermes.
      ownerPlan: "24"
      relatedPlans: ["26"]
      sensitivity: medium
      lifetime: long-lived
      format: random-token
      creator: {actor: agent-runner token issuer (ADR-0401), when: first Runner start and every rotation}
      consumers:
        - {component: Hermes gateway, namespace: hermes}
      storage:
        - {kind: k8s-secret, namespace: hermes, name: hermes-managed-env, authoritative: true}
