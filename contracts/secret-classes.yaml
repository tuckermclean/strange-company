        - {kind: sops-git, path: "gitops/clusters/{cluster}/forgejo/forgejo-metrics-token.sops.yaml", authoritative: true}
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/monitoring/forgejo-metrics-token.sops.yaml", notes: "same value"}
      inRecoveryBundle: false
