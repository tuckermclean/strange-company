    - id: SC-WOODPECKER-SIGNING
      title: Woodpecker server signing key
      description: ed25519 key that the Woodpecker server generates on first start and uses to sign configuration-extension and webhook requests (ADR-0301); sc-ci-config verifies with the public key from /api/signature/public-key. Named here pending plan 20 (which describes it as the "server signing key").
      ownerPlan: "20"
      relatedPlans: ["23", "35"]
      sensitivity: high
      lifetime: long-lived
      format: jwt-signing-key
      creator: {actor: Woodpecker server, when: first start (P08)}
