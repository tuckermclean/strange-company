    # ------------------------------------------------------------------ forge
    - id: SC-FORGEJO-ADMIN
      title: Forgejo automation site administrator
      description: Password of the local site-admin account sc-admin created at seed (chart init) and used by forge-init and `forge apply`. Distinct from the break-glass account. Also the source of the platform-probes admin read token (SC-FORGEJO-BOT-TOKENS/platform-probes).
      ownerPlan: "16"
      relatedPlans: ["50", "45"]
      sensitivity: critical
      lifetime: long-lived
      format: password
      creator: {actor: sc-bootstrap pre-seed (plan.install-identity), when: before provision}
      consumers:
        - {component: "Forgejo chart init (initialOnlyNoReset: creates the account from the seed value only, AUTH-9)", namespace: forgejo}
        - {component: sc-bootstrap forge-init and forge apply, access: admin}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/forgejo/forgejo-admin.sops.yaml", notes: "SEED value only: creates the account (chart initialOnlyNoReset); invalid after forge finalize (plan 16, AUTH-9)"}
        - {kind: k8s-secret, namespace: forgejo, name: forgejo-admin, keys: [username, password]}
        - {kind: forgejo-db, notes: password hash}
        - {kind: recovery-bundle, authoritative: true, notes: "STEADY value set by forge finalize (plan 16, AUTH-9); needed by forge-init during recover before Flux decrypts"}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected, operator-change]
        procedure: procedures/rotate-forge-credentials.md
        blastRadius: Full Forgejo administration (branch protection, deploy keys, all repositories).
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [sops-git, recovery-bundle, forgejo-restore]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Rotate, Audit branch-protection and deploy-key changes, Verify main heads against the GitHub mirror and repo bundles]

    - id: SC-FORGEJO-APP-SECRETS
      title: Forgejo application secrets
      description: Forgejo SECRET_KEY, INTERNAL_TOKEN, OAUTH2 JWT_SECRET and LFS_JWT_SECRET. SECRET_KEY encrypts stored credentials (push-mirror token, 2FA) and is not rotatable in place (plan 16).
      ownerPlan: "16"
      sensitivity: high
      lifetime: long-lived
      format: app-secret-set
      creator: {actor: sc-bootstrap pre-seed (64-byte random each), when: plan.install-identity}
      consumers:
        - {component: Forgejo, namespace: forgejo}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/forgejo/forgejo-app-secrets.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: forgejo, name: forgejo-app-secrets}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-forge-credentials.md
        blastRadius: SECRET_KEY decrypts stored push-mirror credentials and 2FA secrets; JWT secrets sign sessions and LFS tokens.
        downtime: "< 5 min (Forgejo restart)"
      recovery: {from: [sops-git]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Rotate INTERNAL_TOKEN and JWT secrets immediately, Plan SECRET_KEY replacement with push-mirror re-entry and 2FA re-enrolment, Rotate SC-GITHUB-MIRROR]

    - id: SC-FORGEJO-SSH-HOST-KEY
      title: Forgejo SSH host key
      description: Ed25519 host key of Forgejo's built-in SSH server. Pinned in Flux known_hosts (ADR-0016) and in the per-execution worker known_hosts.
      ownerPlan: "16"
      relatedPlans: ["18", "19", "26"]
      sensitivity: high
      lifetime: long-lived
      format: ssh-keypair
      creator: {actor: sc-bootstrap pre-seed (ed25519), when: plan.install-identity}
      consumers:
        - {component: Forgejo SSH server, namespace: forgejo}
        - {component: "Flux source-controller, Runner and workers (public key only)", access: verify}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/forgejo/forgejo-ssh-host-key.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: forgejo, name: forgejo-ssh-host-keys}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-forge-credentials.md
        blastRadius: Impersonation of Forgejo SSH to Flux, the Runner and workers.
        downtime: none (dual-key overlap, plan 16 rotate-forge-credentials §E)
