    - id: SC-WOODPECKER-METRICS-TOKEN
      title: Woodpecker metrics bearer token
      description: WOODPECKER_PROMETHEUS_AUTH_TOKEN presented by Prometheus to Woodpecker /metrics (plan 38; alias SC-METRICS-SCRAPE-TOKENS/woodpecker). Dropped if the pinned version offers an unauthenticated metrics listener.
      ownerPlan: "20"
      relatedPlans: ["38"]
      sensitivity: low
      lifetime: long-lived
      format: random-token
      creator: {actor: sc-bootstrap pre-seed (32 bytes base64url), when: plan.install-identity}
