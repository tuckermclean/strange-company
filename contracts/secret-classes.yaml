        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/woodpecker/sc-ci-config-intents.sops.yaml", authoritative: true}
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/agent-runner-ci-intents.sops.yaml", notes: "same value"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected]
