# Strange Company secret-class register (authoritative; owning plan: plans/35-secrets.md).
# Validated by contracts/secret-classes.schema.yaml (F02) and `make secrets-lint` (plan 35 §22).
# Metadata only: no secret values.
# Placeholders: {cluster} = cluster name (CLUSTER_NAME; also the recovery-bundle install_id),
# {prefix} = object-storage bucket prefix, <ns> = namespace, <execution-id> = e.g. sc-184-x3.
# A reference such as SC-OBJECT-STORAGE/pg-backups-sc-pg means class SC-OBJECT-STORAGE, instance pg-backups-sc-pg.
# Aliases used in other plans (normalised here): SC-ETCD-S3 = SC-OBJECT-STORAGE/etcd-snapshots;
# SC-OBJECT-STORAGE-<PURPOSE> = SC-OBJECT-STORAGE/<purpose>; SC-OBJECT-STORAGE-DR = SC-OBJECT-STORAGE/dr-tests-reader;
# SC-OBJECT-STORAGE-BOOTSTRAP = SC-OBJECT-STORAGE/bootstrap-admin = SC-OBJECT-STORAGE/admin (plan 14 name; bootstrap-admin is an alias only); SC-OPERATOR-SSH = SC-SSH-OPERATOR;
# SC-BOOTSTRAP-KUBECONFIG = SC-K3S-ADMIN-KUBECONFIG; SC-FORGEJO-WEBHOOK = SC-FORGEJO-WEBHOOK-RUNNER = SC-RUNNER-WEBHOOK;
# SC-METRICS-SCRAPE-TOKENS/forgejo = SC-FORGEJO-METRICS-TOKEN, SC-METRICS-SCRAPE-TOKENS/woodpecker = SC-WOODPECKER-METRICS-TOKEN;
# SC-HERMES-DASHBOARD-OIDC = SC-OIDC-CLIENTS/hermes-dashboard. `make secrets-lint` resolves these aliases and
# fails on any other unregistered SC-* identifier in plans/, adr/, contracts/ and procedures/.
# Tier-1 paths: the FILE NAMES here are authoritative; the directory under gitops/clusters/{cluster}/ follows
# plan 18's cluster-config mechanism (review SEED-1) and every such file must be reachable from it (lint S-13).
apiVersion: strange.company/v1alpha1
kind: SecretClassRegister
metadata:
  name: strange-company
  description: Complete register of secret classes (SPEC §98, §99; master plan §9; ADR-0012; plan 35).
spec:
  classes:
    # ------------------------------------------------------------------ cluster and nodes
    - id: SC-K3S-TOKEN
      title: k3s server/agent join token
      description: Shared secret authenticating nodes joining the cluster. It also encrypts the k3s bootstrap data (CA material, secrets-encryption config) stored in etcd and in etcd snapshots, so it is required to restore a snapshot.
      ownerPlan: "07"
      relatedPlans: ["35", "47", "45", "50"]
      sensitivity: critical
      lifetime: long-lived
      format: random-token
      creator: {actor: "sc-bootstrap plan.install-identity (32 random bytes, hex)", when: before provision of the first install}
      consumers:
        - {component: k3s servers and agents (join; Ansible role k3s via /run/sc/ansible/vars.json), access: use}
        - {component: sc-bootstrap expand / recover (etcd snapshot restore), access: use}
      storage:
        - {kind: node-file, path: /var/lib/rancher/k3s/server/token, notes: root 0600 on every server}
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/k3s-token.sops.yaml", notes: "recovery recipient only; keys token, token_previous (kept 30 d = snapshot retention). Plan 07 names this file infra/secrets/k3s-token.sops.yaml; plan 35 layout is authoritative"}
        - {kind: recovery-bundle, authoritative: true}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-k3s-token
        blastRadius: New node joins and etcd-snapshot restores need the new token; snapshots taken before rotation need the OLD token, so the bundle keeps the previous generation until the last old snapshot expires (30 d).
        downtime: none (k3s token rotate plus a rolling restart of servers, verify)
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, offline-recovery-identity], procedure: procedures/total-cluster-loss.md}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Rotate with k3s token rotate, Check the node list for unknown nodes and delete them, Rebuild the recovery bundle]

    - id: SC-K3S-SERVER-CA
      title: k3s cluster CA and service-account signing keys
      description: Private keys of the k3s server, client, request-header and etcd CAs and the service-account token signing key, generated by k3s under /var/lib/rancher/k3s/server/tls.
      ownerPlan: "07"
      relatedPlans: ["34", "45"]
      sensitivity: critical
      lifetime: long-lived
      format: x509-ca
      creator: {actor: k3s server, when: first server start}
      consumers:
        - {component: kube-apiserver, access: use}
        - {component: etcd, access: use}
        - {component: kube-controller-manager (SA token signing), access: use}
      storage:
        - {kind: node-file, path: /var/lib/rancher/k3s/server/tls/, notes: root-only}
        - {kind: node-file, path: /var/lib/rancher/k3s/server/db/etcd, notes: "k3s bootstrap data in etcd, encrypted with SC-K3S-TOKEN"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-k3s-server-ca
        blastRadius: Every kubeconfig, every node certificate and every SA token becomes invalid; all clients need new credentials.
        downtime: Control-plane restart; minutes of API unavailability per server.
      recovery:
        from: [etcd-snapshot, regenerate]
        notes: Restored with an etcd snapshot (needs SC-K3S-TOKEN). On a rebuild from Git, a new CA is generated and all derived credentials are re-issued.
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Treat as full cluster compromise, Rebuild from Git per total-cluster-loss rather than rotate in place]

    - id: SC-K3S-ENCRYPTION-CONFIG
      title: k3s secrets-encryption keys
      description: AES keys in /var/lib/rancher/k3s/server/cred/encryption-config.json that encrypt Kubernetes Secrets at rest in etcd (secrets-encryption true, plan 07 07-R-4). Replicated through k3s bootstrap data.
      ownerPlan: "07"
      relatedPlans: ["35", "45"]
      sensitivity: critical
      lifetime: long-lived
      format: app-secret-set
      creator: {actor: k3s server (secrets-encryption true), when: first server start}
      consumers:
        - {component: kube-apiserver, access: decrypt}
      storage:
        - {kind: node-file, path: /var/lib/rancher/k3s/server/cred/encryption-config.json, notes: root 0600}
        - {kind: node-file, path: /var/lib/rancher/k3s/server/db/etcd, notes: bootstrap data encrypted with SC-K3S-TOKEN}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-k3s-encryption-config
        blastRadius: Confidentiality of every Secret in etcd and in etcd snapshots.
        downtime: none (k3s secrets-encrypt rotate-keys plus a rolling restart, plan 07 §19.4)
      recovery: {from: [etcd-snapshot, regenerate], notes: Restored with the snapshot's bootstrap data (needs SC-K3S-TOKEN); a rebuild from Git generates new keys.}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Rotate keys, Treat every in-cluster Secret value as exposed and rotate the classes whose storage includes k8s-secret]

    - id: SC-K3S-ADMIN-KUBECONFIG
      title: Operator kubeconfig (per-operator client certificate)
      description: Per-operator kubeconfig holding a distinct client certificate CN=sc-operator:<operator-user>, O=sc:cluster-admins-g<N> (bound to cluster-admin by ClusterRoleBinding sc-cluster-admins-g<N>), valid ≤ 30 days, signed over SSH by the k3s client CA (sc-bootstrap kubeconfig refresh; plans 07/50, review AUTH-7). /etc/rancher/k3s/k3s.yaml (system:admin) never leaves the node and is the break-glass identity. Alias SC-BOOTSTRAP-KUBECONFIG.
      ownerPlan: "50"
      relatedPlans: ["07", "15"]
      sensitivity: critical
      lifetime: long-lived
      format: kubeconfig
      creator: {actor: "sc-bootstrap kubeconfig refresh (CSR in toolbox tmpfs, signed on a server node over SSH)", when: configure phase and whenever < 7 days remain}
      consumers:
        - {component: sc-bootstrap and operator procedures in the toolbox (./bootstrap shell / exec), access: admin}
      storage:
        - {kind: local-bootstrap-dir, path: "/blackstart/{cluster}/kubeconfig", authoritative: true, notes: "mode 0600; re-issuable over SSH; one per operator"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: automatic
        maxAge: P30D
        triggers: [key-expiry, compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-k3s-admin-kubeconfig
        blastRadius: Full cluster administration for ≤ 30 days; revocable for all operators at once by bumping k3s_operator_generation (plan 07).
        downtime: none
      recovery: {from: [regenerate], notes: Re-issued over SSH from any server node with SC-SSH-OPERATOR or SC-BREAK-GLASS-CLUSTER.}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Bump k3s_operator_generation and run ./bootstrap configure --tags k3s (revokes every operator certificate of that generation), Re-issue kubeconfigs, Review the audit log for sc-operator:<name>]

    - id: SC-SSH-OPERATOR
      title: Operator SSH key for nodes
      description: Operator-supplied SSH key pair used by Ansible and sc-bootstrap to administer nodes (SPEC §7 prerequisite). Alias SC-OPERATOR-SSH.
      ownerPlan: "50"
      relatedPlans: ["08", "03"]
      sensitivity: critical
      lifetime: long-lived
      format: ssh-keypair
      creator: {actor: operator, when: before bootstrap}
      consumers:
        - {component: sc-bootstrap / Ansible / OpenTofu (public key injection), access: use}
      storage:
        - {kind: operator-offline, authoritative: true, notes: private key on the operator machine or a hardware token; mounted read-only at /run/sc/ssh/id_key}
        - {kind: bootstrap-env, notes: path reference only (SSH_PRIVATE_KEY_PATH)}
        - {kind: node-file, path: "~<admin user>/.ssh/authorized_keys", notes: public key only (plan 08 names the admin user)}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-ssh-operator
        blastRadius: Root-equivalent node administration on every node.
        downtime: none
      recovery: {from: [operator, provider-console], notes: "SC-BREAK-GLASS-CLUSTER (node user sc-breakglass) or the provider console / rescue mode re-installs a key."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Replace authorized_keys on all nodes via the break-glass key, Audit auth.log, Treat nodes as suspect if logins are unexplained]

    - id: SC-LAB-SSH
      title: Ephemeral CI lab SSH key
      description: SSH key pair generated per CI lab run (plan 05 existing-nodes lab, plan 50) and destroyed with the run.
      ownerPlan: "50"
      relatedPlans: ["05"]
      sensitivity: low
      lifetime: ephemeral
      ttl: PT6H
      format: ssh-keypair
      creator: {actor: CI lab job (ssh-keygen in the toolbox), when: start of each lab run}
      consumers:
        - {component: sc-bootstrap in the lab job, access: use}
        - {component: lab VMs (public key only), access: verify}
      storage:
        - {kind: process-memory, notes: tmpfs /run/sc/ssh of the lab job}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs]
      rotation:
        mode: per-use
        triggers: [after-use]
        procedure: procedures/rotate-secrets.md#sc-lab-ssh
        blastRadius: Disposable lab VMs of one run.
        downtime: none
      recovery: {from: [not-recoverable-by-design]}
      compromise:
        severity: sev3
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Destroy the lab VMs]

    # ------------------------------------------------------------------ infrastructure, DNS, state
    - id: SC-INFRA-PROVIDER
      title: Infrastructure provider API credentials
      description: Provider API credentials (OVH application key/secret/consumer key; none for `existing`) used by OpenTofu to provision nodes.
      ownerPlan: "04"
      relatedPlans: ["03", "06", "50", "15"]
      sensitivity: critical
      lifetime: long-lived
      format: provider-credentials
      creator: {actor: operator (provider console), when: before bootstrap}
      consumers:
        - {component: OpenTofu in toolbox (subprocess environment only), access: use}
      storage:
        - {kind: bootstrap-env, authoritative: true}
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/infra-provider.sops.yaml"}
        - {kind: recovery-bundle}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected, operator-change, provider-forced]
        procedure: procedures/rotate-secrets.md#sc-infra-provider
        blastRadius: Paid resource creation/destruction for the whole provider account.
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, offline-recovery-identity, provider-console]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Revoke the consumer key in the provider console, Inspect billing and resource inventory against tofu state, Issue new credentials and rebuild the bundle]

    - id: SC-CI-OVH-READONLY
      title: Read-only OVH credential for provider contract tests
      description: OVH API credential restricted to GET on catalogue and /me endpoints, used by plan 04's plan-only CI tests. It cannot create, modify or delete resources.
      ownerPlan: "04"
      relatedPlans: ["23", "52"]
      sensitivity: medium
      lifetime: long-lived
      format: provider-credentials
      creator: {actor: "operator (OVH console, GET-only access rules)", when: before F09}
      consumers:
        - {component: "provider-contract step of the protected cron workflow provider-contract (build lane, image filter provider-contract)", access: use}
      storage:
        - {kind: external-service, notes: "GitHub Actions repository secret during Phase 1 (ADR-0018)"}
        - {kind: sops-git, path: "secrets/ci/{cluster}/ci-ovh-readonly.sops.yaml", authoritative: true, notes: from P08}
        - {kind: woodpecker-secret, notes: "sc_ci_ovh_readonly; events [cron]; image filter provider-contract"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-ci-ovh-readonly
        blastRadius: Read-only view of the OVH account (catalogue, account metadata).
        downtime: none
      recovery: {from: [sops-git, provider-console]}
      compromise:
        severity: sev3
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Revoke in the OVH console, Verify its access rules are GET-only, Re-issue]

    - id: SC-DNS-TUNNEL
      title: Cloudflare Tunnel credential
      description: Tunnel token (or credentials JSON) that cloudflared uses to connect the named tunnel (tunnel mode, ADR-0010).
      ownerPlan: "09"
      relatedPlans: ["10", "45", "15"]
      sensitivity: high
      lifetime: long-lived
      format: api-token
      creator: {actor: sc-bootstrap via the Cloudflare API with SC-DNS-API, when: plan.install-identity}
      consumers:
        - {component: cloudflared, namespace: ingress}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/ingress/cloudflared-tunnel.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: ingress, name: cloudflared-tunnel, keys: [token]}
        - {kind: recovery-bundle}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected, recovery-drill]
        procedure: procedures/rotate-secrets.md#sc-dns-tunnel
        blastRadius: Public ingress for all hostnames; a stolen token lets an attacker run a connector for the tunnel and receive a share of public traffic.
        downtime: "< 1 min (cloudflared rollout)"
        bundleUpdateRequired: true
      recovery: {from: [sops-git, recovery-bundle, regenerate]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Rotate the tunnel token via the Cloudflare API, Remove unknown connectors from the tunnel, Reseal and merge]

    - id: SC-DNS-API
      title: DNS provider credential (toolbox)
      description: DNS provider credential used only by the toolbox (sc-bootstrap) to create tunnel and DNS records (Cloudflare Account › Cloudflare Tunnel › Edit plus Zone › DNS › Edit; bootstrap.env CLOUDFLARE_API_TOKEN). Never in the cluster (35-R-3, review AUTH-13); cert-manager uses the narrower SC-DNS-ACME. rfc2136/route53 credentials are the same class (plan 10).
      ownerPlan: "10"
      relatedPlans: ["09", "50", "15"]
      sensitivity: high
      lifetime: long-lived
      format: api-token
      creator: {actor: operator (DNS provider dashboard), when: before bootstrap}
      consumers:
        - {component: "sc-bootstrap (tunnel and DNS records, preflight PF-15/PF-20)", access: use}
      storage:
        - {kind: bootstrap-env, authoritative: true}
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/dns-api.sops.yaml"}
        - {kind: recovery-bundle}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P180D
        triggers: [schedule, compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-dns-api
        blastRadius: Tunnel configuration and every DNS record of the zone (hijack of every hostname).
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, offline-recovery-identity, provider-console]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Roll the token at the provider, Diff the zone against the expected record set, Check CT logs for unexpected certificates]

    - id: SC-DNS-ACME
      title: ACME DNS-01 solver credential
      description: Narrow DNS credential for the in-cluster cert-manager DNS-01 solver (review AUTH-13). Zone-scoped DNS Edit only; preferably scoped to a dedicated challenge zone to which _acme-challenge.<domain> is delegated by CNAME, so it cannot change production records (cert-manager follows CNAMEs, verify). No tunnel rights.
      ownerPlan: "10"
      relatedPlans: ["09", "50"]
      sensitivity: medium
      lifetime: long-lived
      format: api-token
      creator: {actor: "operator (DNS provider dashboard; bootstrap.env second token, plan 50)", when: before bootstrap}
      consumers:
        - {component: cert-manager ACME DNS-01 solver, namespace: cert-manager}
      storage:
        - {kind: bootstrap-env}
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/cert-manager/dns-api-token.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: cert-manager, name: dns-api-token, keys: [api-token]}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P180D
        triggers: [schedule, compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-dns-acme
        blastRadius: TXT records in the challenge zone (with CNAME delegation) or DNS records of the zone (without); certificate issuance for the domain.
        downtime: none
      recovery: {from: [sops-git, provider-console]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Roll the token, Check CT logs for unexpected certificates, Diff the zone]

    - id: SC-DNS-REGISTRAR
      title: Domain registrar account
      description: Login (with MFA recovery codes) of the registrar holding BASE_DOMAIN. Needed to change NS delegation away from a lost or unavailable DNS provider (review AUTH-11; SPEC §111 off-cluster material). Operator-held only, like SC-BREAK-GLASS-INFRA.
      ownerPlan: "09"
      relatedPlans: ["10", "35", "45"]
      sensitivity: critical
      lifetime: long-lived
      format: provider-credentials
      creator: {actor: operator (registrar), when: before bootstrap}
      consumers:
        - {component: "operator during DNS-provider loss (edge-ingress-failure.md, Cloudflare account or DNS loss branch)", access: admin}
      storage:
        - {kind: operator-offline, authoritative: true}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, after-use, compromise-suspected, operator-change]
        procedure: procedures/rotate-break-glass.md#infrastructure
        blastRadius: The whole domain (NS delegation, hence every hostname, certificate issuance and email).
        downtime: none
      recovery: {from: [operator, provider-console]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Reset password and MFA at the registrar, Enable registrar lock, Verify NS records and DNSSEC]

    - id: SC-TOFU-ENCRYPTION
      title: OpenTofu state encryption passphrase
      description: Passphrase for OpenTofu native state encryption (pbkdf2 key provider, plan 06). Black-start material (SPEC §15).
      ownerPlan: "06"
      relatedPlans: ["50", "45", "15"]
      sensitivity: critical
      lifetime: long-lived
      format: passphrase
      creator: {actor: "sc-bootstrap plan.install-identity (32 random bytes, base64url)", when: before remote state init}
      consumers:
        - {component: OpenTofu in toolbox (TF_ENCRYPTION env in tmpfs), access: decrypt}
      storage:
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/tofu-encryption.sops.yaml"}
        - {kind: recovery-bundle, authoritative: true}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-tofu-encryption
        blastRadius: Confidentiality of OpenTofu state (provider resource ids, possibly sensitive outputs).
        downtime: none (re-encrypt with the OpenTofu fallback key provider, plan 06 §20.3)
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, offline-recovery-identity], procedure: procedures/recover-opentofu-state.md}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Re-encrypt state with a new passphrase using the fallback provider, Rotate SC-OBJECT-STORAGE/tofu-state]

    - id: SC-OBJECT-STORAGE
      title: S3-compatible object-storage credentials (per bucket/purpose)
      description: Access-key pairs for the external object store. One instance per purpose, each scoped to the narrowest bucket, prefix and permission set the provider supports. Plan 14 is authoritative for the bucket/credential split; this register mirrors it. Where the provider cannot scope a key, the instance falls back to a broader key and the bootstrap report flags it (plan 14).
      ownerPlan: "14"
      relatedPlans: ["35", "06", "07", "12", "13", "19", "44", "45"]
      sensitivity: critical
      lifetime: long-lived
      format: s3-access-key
      creator: {actor: sc-bootstrap plan.storage-apply using SC-OBJECT-STORAGE/admin, when: P01}
      consumers:
        - {component: see instances}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/<ns>/s3-<instance>.sops.yaml", notes: in-cluster instances}
        - {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-<instance>.sops.yaml", notes: toolbox-only instances}
        - {kind: recovery-bundle, notes: bundled instances only}
      instances:
        - name: admin
          description: Operator-supplied credential able to create buckets, keys and policies. Never placed in the cluster. Used only for the storage module and credential rotation.
          scope: account-level object-storage admin
          consumers: [{component: sc-bootstrap plan.storage-apply / rotate-storage-credentials, access: admin}]
          storage: [{kind: bootstrap-env, authoritative: true}, {kind: recovery-bundle}]
          inRecoveryBundle: true
        - name: tofu-state
          description: OpenTofu backend access and bootstrap journal.
          scope: "read/write objects in {prefix}-tofu-state; no bucket delete, no versioning change"
          consumers: [{component: OpenTofu and sc-bootstrap journal in toolbox}]
          storage: [{kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-tofu-state.sops.yaml"}, {kind: recovery-bundle, authoritative: true}]
          inRecoveryBundle: true
        - name: tofu-state-ro
          description: In-cluster state-restore check (plan 06 §21). List and HEAD/GetObject metadata only.
          scope: "list + GetObject on {prefix}-tofu-state/{cluster}/(restore-tests|storage|compute)/*"
          consumers: [{component: restore-test CronJob, namespace: dr-tests}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/s3-tofu-state-ro.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: recovery
          description: Upload and read of recovery bundles, inventories, pointers and attestations. Versioning on; no DeleteObjectVersion.
          scope: "read/write {prefix}-recovery (no DeleteObjectVersion, no lifecycle change)"
          consumers: [{component: sc-bootstrap recovery-bundle / recovery-key attest}]
          storage: [{kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-recovery.sops.yaml"}, {kind: recovery-bundle, authoritative: true}]
          inRecoveryBundle: true
        - name: recovery-reader
          description: In-cluster recovery checks (bundle integrity, currency, attestation age). Never reads anything that is not already passphrase- or age-encrypted, except pointer, inventory and attestation metadata.
          scope: "list + GetObject on {prefix}-recovery/{cluster}/(bundles|attestations)/*"
          consumers: [{component: "recovery check CronJobs (restore-test-recovery-bundle, recovery-bundle-currency, recovery-key-attestation)", namespace: dr-tests}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/s3-recovery-reader.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: seed-write
          description: Upload of the seed snapshot (ADR-0005); operator-side only.
          scope: "write {prefix}-bootstrap-seed"
          consumers: [{component: sc-bootstrap seed phase}]
          storage: [{kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-seed-write.sops.yaml", authoritative: true}, {kind: recovery-bundle}]
          inRecoveryBundle: true
        - name: seed-read
          description: Read-only credential for the Flux Bucket seed source (ADR-0005); the in-cluster Secret is deleted at transfer (plan 19 T6) and the key is rotated after transfer (it stays valid for black start).
          scope: "read {prefix}-bootstrap-seed"
          consumers: [{component: Flux source-controller, namespace: flux-system}]
          storage: [{kind: k8s-secret, namespace: flux-system, name: seed-bucket-credentials, notes: "out-of-band, seed only"}, {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-seed-read.sops.yaml"}, {kind: recovery-bundle, authoritative: true}]
          inRecoveryBundle: true
        - name: pg-backups-forgejo-pg
          description: CNPG barman-cloud base backups and WAL of forgejo-pg (Secret forgejo-pg-backup-s3).
          scope: "read/write {prefix}-pg-backups/forgejo-pg/ (prefix-scoped where supported)"
          consumers: [{component: CNPG barman-cloud plugin, namespace: forgejo}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/forgejo/forgejo-pg-backup-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: pg-backups-authentik-pg
          description: CNPG backups of authentik-pg.
          scope: "read/write {prefix}-pg-backups/authentik-pg/"
          consumers: [{component: CNPG barman-cloud plugin, namespace: authentik}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/authentik/authentik-pg-backup-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: pg-backups-woodpecker-pg
          description: CNPG backups of woodpecker-pg.
          scope: "read/write {prefix}-pg-backups/woodpecker-pg/"
          consumers: [{component: CNPG barman-cloud plugin, namespace: woodpecker}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/woodpecker/woodpecker-pg-backup-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: pg-backups-sc-pg
          description: CNPG backups of sc-pg.
          scope: "read/write {prefix}-pg-backups/sc-pg/"
          consumers: [{component: CNPG barman-cloud plugin, namespace: strange-company}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/sc-pg-backup-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: longhorn-backups
          description: Longhorn backup target.
          scope: "read/write {prefix}-longhorn-backups"
          consumers: [{component: Longhorn manager, namespace: longhorn-system}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/longhorn-system/s3-longhorn-backups.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: etcd-snapshots
          description: k3s etcd-s3 snapshot upload and pruning (alias SC-ETCD-S3).
          scope: "read/write/delete objects in {prefix}-etcd-snapshots (bucket versioning protects pruned objects)"
          consumers: [{component: k3s server (etcd-s3), access: use}]
          storage: [{kind: node-file, path: /etc/rancher/k3s/config.yaml, notes: cluster file 0600 (plan 07)}, {kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-etcd-snapshots.sops.yaml"}, {kind: recovery-bundle, authoritative: true}]
          inRecoveryBundle: true
        - name: forgejo-objects
          description: Forgejo LFS, attachments, packages and OCI registry blobs.
          scope: "read/write {prefix}-forgejo-objects"
          consumers: [{component: Forgejo, namespace: forgejo}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/forgejo/s3-forgejo-objects.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: repo-backups
          description: Hourly git bundles of repositories (plan 44).
          scope: "write {prefix}-repo-backups (no delete)"
          consumers: [{component: repo-backup CronJob, namespace: forgejo}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/forgejo/s3-repo-backups.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: evidence
          description: RED/GREEN evidence, worker logs, results and context packets written by the Runner.
          scope: "read/write {prefix}-evidence (no DeleteObjectVersion)"
          consumers: [{component: agent-runner, namespace: strange-company}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/agent-runner-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: telemetry
          description: Loki/Tempo storage (small-ha).
          scope: "read/write {prefix}-telemetry"
          consumers: [{component: Loki and Tempo, namespace: monitoring}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/monitoring/s3-telemetry.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: telemetry-debug
          description: Write-only credential used by the Model Gateway to store time-limited debug captures under a TelemetryDebugGrant (plan 40 §debug capture). Prefix-scoped key on {prefix}-evidence or a separate bucket {prefix}-telemetry-debug (plan 14 decides, plan 40 Q-40-6).
          scope: "PutObject only on {prefix}-evidence/telemetry-debug/ (or {prefix}-telemetry-debug)"
          consumers: [{component: model-gateway, namespace: strange-company}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/strange-company/s3-telemetry-debug.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: drill-reader
          description: Read-only credential on the source installation's backup buckets and Forgejo objects, used by a recovery drill environment (plan 45 D3, Q-45-7, review DR-9). Never placed in the source cluster.
          scope: "read {prefix}-pg-backups, {prefix}-longhorn-backups and {prefix}-forgejo-objects of the source installation"
          consumers: [{component: "sc-bootstrap recover in a drill environment (bootstrap.drill.env)", access: use}]
          storage: [{kind: offcluster-sops, path: "secrets/offcluster/{cluster}/s3-drill-reader.sops.yaml", authoritative: true}, {kind: recovery-bundle}]
          inRecoveryBundle: true
        - name: dr-tests-results
          description: Write (no delete) of restore-test results, recovery-check evidence and canary objects (plan 14 B9 restore-tests/, canary/; checks/ added for plan 35 recovery checks, plan 14 to extend the policy).
          scope: "List/Get/Put on {prefix}-evidence/restore-tests/, /canary/ and /checks/ (no Delete)"
          consumers: [{component: "restore-test and check CronJobs, incl. plan 35 recovery checks", namespace: dr-tests}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/s3-dr-tests-results.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: objstore-audit
          description: Read-only listing and bucket-configuration read (versioning, lifecycle, Object Lock) of all ten buckets for the objstore-audit check (plan 14 §21).
          scope: "List + bucket-config read on every {prefix}-* bucket; no GetObject of contents beyond metadata"
          consumers: [{component: objstore-audit CronJob, namespace: dr-tests}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/s3-objstore-audit.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
        - name: dr-tests-reader
          description: Read-only access to backup buckets for restore-test Jobs (alias SC-OBJECT-STORAGE-DR; plan 12 Secret dr-tests/pg-restore-s3).
          scope: "read {prefix}-pg-backups, {prefix}-repo-backups, {prefix}-longhorn-backups"
          consumers: [{component: restore-test Jobs, namespace: dr-tests}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/pg-restore-s3.sops.yaml", authoritative: true}]
          inRecoveryBundle: false
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P180D
        triggers: [schedule, compromise-suspected, operator-change, provider-forced, recovery-drill]
        procedure: procedures/rotate-storage-credentials.md
        blastRadius: Per instance, only its bucket or prefix; admin = all buckets.
        downtime: none (overlapping old/new keys during rollout)
        bundleUpdateRequired: true
      recovery: {from: [sops-git, recovery-bundle, provider-console]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#object-storage
        actions: [Revoke the key at the provider, Verify bucket versioning and object integrity for the affected bucket, Rotate per rotate-storage-credentials]

    # ------------------------------------------------------------------ SOPS / age / recovery
    - id: SC-AGE-CLUSTER
      title: Cluster age identity
      description: age X25519 identity used by Flux kustomize-controller to decrypt SOPS secrets under gitops/clusters/{cluster}/ (ADR-0012). It is never committed to Git, even encrypted. In the cluster only as flux-system/sops-age, which upstream operators with cluster-wide Secret read can also read (plan 34 R-22); it does NOT decrypt tier 1b or tier 2.
      ownerPlan: "35"
      relatedPlans: ["18", "19", "45", "50"]
      sensitivity: critical
      lifetime: long-lived
      format: age-identity
      creator: {actor: sc-bootstrap plan.install-identity (age library in toolbox), when: before provision of the first install}
      consumers:
        - {component: Flux kustomize-controller, namespace: flux-system, access: decrypt}
        - {component: "sc-bootstrap (SOPS_AGE_KEY in tmpfs, opened from the bundle)", access: decrypt}
      storage:
        - {kind: k8s-secret, namespace: flux-system, name: sops-age, keys: [age.agekey], notes: "out-of-band (plan 19); during rotation holds current and next identity"}
        - {kind: recovery-bundle, authoritative: true}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines, operator-laptop-at-rest]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected, operator-change, recovery-drill]
        procedure: procedures/rotate-age-key.md#cluster-key
        blastRadius: Decryptability of every cluster SOPS file; Flux reconciliation of secret-bearing Kustomizations.
        downtime: none (old and new identities both installed during the overlap)
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle], notes: "If lost, rotate it using SC-AGE-RECOVERY (no data loss)."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#recovery-material
        actions: [Rotate the cluster key, "Rotate EVERY secret value stored in gitops/clusters/{cluster} (Git history keeps old ciphertexts)", Rebuild the bundle]

    - id: SC-AGE-RECOVERY
      title: Offline recovery age identity
      description: Offline age identity that is a recipient of every SOPS file and the only recipient of secrets/offcluster/**. Never placed in the cluster or in the bundle.
      ownerPlan: "35"
      relatedPlans: ["45", "50"]
      sensitivity: critical
      lifetime: long-lived
      format: age-identity
      creator: {actor: "sc-bootstrap plan.install-identity (printed and written once to /blackstart/{cluster}/recovery-identity.txt)", when: before provision of the first install}
      consumers:
        - {component: "operator during black start, key rotation and the quarterly attestation (toolbox, tmpfs only)", access: decrypt}
      storage:
        - {kind: operator-offline, authoritative: true, notes: paper copy plus an encrypted password manager or hardware-backed store}
        - {kind: local-bootstrap-dir, path: "/blackstart/{cluster}/recovery-identity.txt", notes: transient; the operator moves it offline and deletes it (PF-23 warns while present)}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines, operator-laptop-at-rest]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected, operator-change]
        procedure: procedures/rotate-age-key.md#recovery-key
        blastRadius: Black-start capability without the bundle; every SOPS file.
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [operator], notes: "If lost but the bundle survives, generate a new recovery key and re-encrypt using the cluster key and the bundled off-cluster values (rotate-age-key §recovery-key, lost variant)."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#recovery-material
        actions: [Rotate the recovery key, Rotate every secret value in secrets/offcluster and in the cluster SOPS files (Git history keeps old ciphertexts), Rebuild the bundle]

    - id: SC-AGE-CI
      title: CI release-credential age identity
      description: age identity that, together with the recovery identity, is the only recipient of tier 1b (secrets/ci/{cluster}/**, release credentials applied into Woodpecker by sc-bootstrap ci-secrets apply). Held only in the recovery bundle, never in the cluster, so a leaked cluster age key cannot decrypt release credentials (review SEC-4, ADR-0500).
      ownerPlan: "35"
      relatedPlans: ["23", "50"]
      sensitivity: critical
      lifetime: long-lived
      format: age-identity
      creator: {actor: "sc-bootstrap supply-chain init (generated if absent; sealed into the bundle)", when: "P11 (after control transfer, CD-19)"}
      consumers:
        - {component: "sc-bootstrap ci-secrets apply / supply-chain init / signing-key rotation (tmpfs only)", access: decrypt}
      storage:
        - {kind: recovery-bundle, authoritative: true}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines, operator-laptop-at-rest]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected, operator-change]
        procedure: procedures/rotate-age-key.md#ci-key
        blastRadius: Confidentiality of tier-1b release credentials.
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle], notes: "If lost, tier 1b is re-encrypted with the recovery identity to a new SC-AGE-CI."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#recovery-material
        actions: [Rotate SC-AGE-CI, Rotate every tier-1b value (signing key emergency revocation, registry push, GHCR, sc-release token), Rebuild the bundle]

    - id: SC-RECOVERY-PASSPHRASE
      title: Recovery bundle passphrase
      description: Passphrase protecting the recovery bundle (age scrypt recipient, work factor ≥ 18). Strange Company never stores it.
      ownerPlan: "35"
      relatedPlans: ["45", "50"]
      sensitivity: critical
      lifetime: long-lived
      format: passphrase
      creator: {actor: "operator (prompted twice; ≥ 20 characters or ≥ 5 words, plan 50 §14.3)", when: first bundle creation}
      consumers:
        - {component: "sc-bootstrap recovery-bundle (interactive prompt, or SC_RECOVERY_PASSPHRASE_FILE for automation with warning PF-24)", access: decrypt}
      storage:
        - {kind: operator-offline, authoritative: true}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines, operator-laptop-at-rest]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected, operator-change]
        procedure: procedures/rotate-secrets.md#sc-recovery-passphrase
        blastRadius: Every stored bundle version encrypted with it.
        downtime: none
        bundleUpdateRequired: true
      recovery: {from: [not-recoverable-by-design], notes: "Lost passphrase = the bundle is unusable; recovery falls back to SC-AGE-RECOVERY plus bootstrap.env, then a new bundle under a new passphrase."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#recovery-material
        actions: [Create a new bundle under a new passphrase, Treat every bundled class as compromised if a bundle copy may have leaked, Delete old bundle versions only after the new one verifies]

    - id: SC-AGE-BACKUP
      title: Repository-backup age identity
      description: age identity that encrypts repository-level backups (git bundles, plan 44, ADR-0202). Producers hold only the public recipient; restore tests hold the private identity.
      ownerPlan: "44"
      relatedPlans: ["11", "35", "45"]
      sensitivity: high
      lifetime: long-lived
      format: age-identity
      creator: {actor: sc-bootstrap plan.install-identity, when: before provision of the first install}
      consumers:
        - {component: restore-tester (decrypt), namespace: dr-tests, access: decrypt}
        - {component: repo-backup CronJob (public recipient only), namespace: forgejo, access: verify}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/dr-tests/backup-age.sops.yaml", authoritative: true, notes: keys current.agekey and previous identities still needed for retained bundles}
        - {kind: k8s-secret, namespace: dr-tests, name: backup-age}
        - {kind: recovery-bundle}
      inRecoveryBundle: true
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-age-backup
        blastRadius: Confidentiality of repository backups in {prefix}-repo-backups.
        downtime: none (new recipient for new backups; old identity kept until the last backup encrypted to it expires, 365 d)
        bundleUpdateRequired: true
      recovery: {from: [recovery-bundle, sops-git]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#object-storage
        actions: [Rotate the identity, Re-encrypt retained backups to the new recipient, Review repo-backups bucket access logs]

    # ------------------------------------------------------------------ certificates
    - id: SC-INTERNAL-CA
      title: Internal CA root key
      description: Root key and certificate of the internal CA used by the cert-manager ClusterIssuer sc-internal-ca for internal TLS (Traefik backends, Gateway, Runner API). Generated in the toolbox before seed and held in Git so that black start keeps the same root (plan 10, ADR-0152).
      ownerPlan: "10"
      relatedPlans: ["35", "45"]
      sensitivity: high
      lifetime: long-lived
      format: x509-ca
      creator: {actor: "sc-bootstrap secrets gen internal-ca (toolbox; idempotent, keeps an existing root)", when: plan.install-identity (before seed)}
      consumers:
        - {component: cert-manager CA ClusterIssuer sc-internal-ca, namespace: cert-manager}
        - {component: "every internal TLS client (public root via ConfigMap sc-internal-ca)", access: verify}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/cert-manager/sc-internal-ca-root.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: cert-manager, name: sc-internal-ca-root, keys: [tls.crt, tls.key]}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected, key-expiry]
        procedure: procedures/rotate-secrets.md#sc-internal-ca
        blastRadius: Impersonation of any internal TLS service to in-cluster clients.
        downtime: "seconds per service restart (new root distributed with overlap, plan 10)"
      recovery: {from: [sops-git]}
      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#cluster-and-node
        actions: [Generate a new root by PR (plan 10 rotation), Distribute the new public root before switching the issuer, Re-issue all internal certificates]

    - id: SC-ACME-ACCOUNT
      title: ACME account key
      description: cert-manager ACME account private key (direct-ingress mode and DNS-01 issuance).
      ownerPlan: "10"
      sensitivity: low
      lifetime: long-lived
      format: x509-client-cert
      creator: {actor: cert-manager, when: first ClusterIssuer reconcile}
      consumers:
        - {component: cert-manager, namespace: cert-manager}
      storage:
        - {kind: k8s-secret, namespace: cert-manager, name: acme-account-letsencrypt-prod, notes: "and acme-account-letsencrypt-staging (one per ClusterIssuer, plan 10)"}
      inRecoveryBundle: false
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-acme-account
        blastRadius: Certificate issuance under the account (DNS control is still required).
        downtime: none
      recovery: {from: [regenerate]}
      compromise:
        severity: sev3
        procedure: procedures/credential-compromise.md#infrastructure-and-dns
        actions: [Deactivate the account, Delete the account Secret so that cert-manager re-registers]

    # ------------------------------------------------------------------ identity
    - id: SC-AUTHENTIK-BOOTSTRAP
      title: Authentik bootstrap admin (single use)
      description: AUTHENTIK_BOOTSTRAP_PASSWORD and AUTHENTIK_BOOTSTRAP_TOKEN for akadmin. Created by sso-init, used once to configure Authentik, then destroyed; akadmin is deactivated (plan 15 ADR-0250, §14.2 A9).
      ownerPlan: "15"
      relatedPlans: ["50"]
      sensitivity: critical
      lifetime: ephemeral
      ttl: P1D
      format: password
      creator: {actor: "sc-bootstrap sso-init (random 40 chars / 64 hex)", when: P07}
      consumers:
        - {component: Authentik first start (env), namespace: authentik}
        - {component: sc-bootstrap sso-init, access: admin}
      storage:
        - {kind: ephemeral-k8s-secret, namespace: authentik, name: authentik-bootstrap, notes: imperative; deleted at sso-init A9}
        - {kind: local-bootstrap-dir, path: "/run/sc/secrets/authentik-bootstrap", notes: "tmpfs during the sso-init run only (ADR-0101); deleted at sso-init A9"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: per-use
        triggers: [after-use]
        procedure: procedures/rotate-secrets.md#sc-authentik-bootstrap
        blastRadius: Full Authentik admin until destroyed (SCAuthentikBootstrapAdminActive alerts if it survives).
        downtime: none
      recovery: {from: [not-recoverable-by-design], notes: "Not needed after sso-init; mid-bootstrap loss is handled by restore-authentik.md §Bootstrap recovery."}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Delete the token and deactivate akadmin (re-run sso-init A9), Revoke all Authentik sessions, Review Authentik events]

    - id: SC-AUTHENTIK-SECRET-KEY
      title: Authentik secret key
      description: AUTHENTIK_SECRET_KEY (cookie signing, unique ids). Changing it invalidates sessions; never rotated routinely (plan 15 15-R-3).
      ownerPlan: "15"
      sensitivity: high
      lifetime: long-lived
      format: random-token
      creator: {actor: "sc-bootstrap pre-seed (50 random bytes, base64)", when: plan.install-identity}
      consumers:
        - {component: Authentik server/worker, namespace: authentik}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/authentik/authentik-secret-key.sops.yaml", authoritative: true}
        - {kind: k8s-secret, namespace: authentik, name: authentik-secret-key, keys: [secret-key]}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-authentik-secret-key
        blastRadius: All Authentik sessions (forced re-login).
        downtime: "< 2 min (rollout)"
      recovery: {from: [sops-git]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Rotate, Force re-login]

    - id: SC-AUTHENTIK-AUDIT-TOKEN
      title: Authentik read-only audit token
      description: API token of the Authentik service account sc-audit (view users, events, blueprint instances). Used by platform-probes and the authentik-config-check Job (plan 15).
      ownerPlan: "15"
      relatedPlans: ["38", "42"]
      sensitivity: medium
      lifetime: long-lived
      format: api-token
      creator: {actor: sc-bootstrap pre-seed (64 hex); materialised by an Authentik blueprint (!Env), when: plan.install-identity}
      consumers:
        - {component: Authentik blueprint (token key), namespace: authentik}
        - {component: platform-probes, namespace: monitoring}
        - {component: authentik-config-check Job, namespace: authentik}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/authentik/authentik-sc-env.sops.yaml", authoritative: true}
