    - id: SC-WOODPECKER-USER-TOKENS
      title: Forgejo OAuth tokens held by Woodpecker
      description: Forgejo OAuth access/refresh tokens that Woodpecker stores for its users (sc-woodpecker, sc-admin, humans) and uses for clone netrc and statuses. sc-woodpecker's token carries repo-admin rights (plan 20 R-20-1).
      ownerPlan: "20"
      relatedPlans: ["16", "34"]
      sensitivity: high
      lifetime: long-lived
      format: api-token
      creator: {actor: Woodpecker server (OAuth login), when: ci-init W01/W02 and every human login}
      consumers:
        - {component: Woodpecker server, namespace: woodpecker}
        - {component: pinned clone plugin (netrc), namespace: "ci-jobs, ci-build"}
      storage:
        - {kind: external-service, notes: "woodpecker-pg (users table) and its CNPG backups in {prefix}-pg-backups"}
        - {kind: forgejo-db, notes: grant records}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes]
      rotation:
        mode: automatic
        triggers: [key-expiry, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-user-tokens
        blastRadius: Forgejo access of the token's user; for sc-woodpecker repo admin on managed repositories.
        downtime: none (refresh tokens rotate access tokens)
      recovery: {from: [regenerate], notes: Re-login through ci-init.}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
        actions: [Revoke the OAuth grants of the affected users in Forgejo, Re-run ci-init W02, Review statuses and webhooks created since exposure]

    - id: SC-WOODPECKER-AGENT
      title: Woodpecker agent credentials
      description: Per-agent tokens registered by ci-init W07 (POST /api/agents, verify) for woodpecker-agent (lane ci, pods in ci-jobs) and woodpecker-agent-build (lane build, pods in ci-build), so each can be revoked and attributed individually (plan 20). The pre-seed system-wide value is mounted only by the server, never by an agent. Woodpecker does not bind labels to tokens (plan 20 Q-20-09, plan 34 R-21).
      ownerPlan: "20"
      relatedPlans: ["23", "34"]
      sensitivity: high
      lifetime: long-lived
      format: random-token
      creator: {actor: "sc-bootstrap ci-init W07 (per-agent tokens); plan.install-identity (server-only system value)", when: P08}
      consumers:
        - {component: Woodpecker server, namespace: woodpecker, access: verify}
        - {component: see instances}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/woodpecker/agent-token-<instance>.sops.yaml", authoritative: true}
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/woodpecker/woodpecker-agent-secret.sops.yaml", notes: "server-only system value (Secret woodpecker/woodpecker-agent-secret); mounted by no agent"}
      instances:
        - name: ci
          description: "Token of woodpecker-agent (label sc-lane=ci, backend namespace ci-jobs). Secret woodpecker/woodpecker-agent-token-ci."
          consumers: [{component: woodpecker-agent, namespace: woodpecker}]
        - name: build
          description: "Token of woodpecker-agent-build (label sc-lane=build, backend namespace ci-build). Secret woodpecker/woodpecker-agent-token-build."
          consumers: [{component: woodpecker-agent-build, namespace: woodpecker}]
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P1Y
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-agent
        blastRadius: A holder of either token can start an agent that declares sc-lane=build and receive protected release workflows with their Woodpecker secrets (labels are not bound to tokens; detected by sc-ci-maint, not prevented).
        downtime: "< 5 min for the rotated agent's lane"
      recovery: {from: [sops-git, regenerate]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#ci-and-supply-chain
        actions: [Delete the agent registration (revokes its token), Remove unknown agents in Woodpecker admin, Rotate SC-RELEASE-SIGNING SC-REGISTRY-PUSH SC-GHCR-PUSH and the sc-release token if any build-lane workflow ran on an unexpected agent]

    - id: SC-WOODPECKER-RUNNER
      title: Runner Woodpecker API token
      description: Woodpecker personal token of user sc-runner, used to trigger verification pipelines and read logs (ADR-0008, ADR-0302).
      ownerPlan: "20"
