      storage:
        - {kind: external-service, notes: "woodpecker-pg and its CNPG backups in {prefix}-pg-backups"}
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: on-compromise
        triggers: [compromise-suspected]
        procedure: procedures/rotate-secrets.md#sc-woodpecker-signing
        blastRadius: Forged configuration-extension requests could make sc-ci-config serve configurations for a pipeline that does not exist; sc-ci-config still classifies trust from Forgejo state (ADR-0301).
        downtime: "< 5 min (server restart; sc-ci-config refetches the public key on verification failure)"
      recovery: {from: [cnpg-restore, regenerate]}
      compromise:
