        actions: [Rotate both copies in one PR]

    - id: SC-FORGEJO-BOT-TOKENS
      title: Forgejo machine-account API tokens
      description: Scoped personal access tokens of Forgejo machine accounts (SPEC §21 machine identity). One instance per account/purpose. Token names carry a creation timestamp (plan 16 S10).
      ownerPlan: "16"
      relatedPlans: ["26", "44", "23", "15", "17"]
      sensitivity: high
      lifetime: long-lived
      format: api-token
      creator: {actor: sc-bootstrap forge-init S10 (Forgejo admin API) or supply-chain init (plan 23), when: P05 / P11}
      consumers:
        - {component: see instances}
      storage:
        - {kind: sops-git, path: "gitops/clusters/{cluster}/secrets/<ns>/forgejo-<instance>.sops.yaml", authoritative: true}
        - {kind: forgejo-db, notes: token hash}
      instances:
        - name: sc-runner
          description: Runner API authority (PRs, statuses, labels, issues, deploy-key management) (ADR-0007). Secret strange-company/agent-runner-forgejo.
          scope: "write:repository, write:issue, read:user, read:organization; team sc-automation (repo admin, needed for deploy keys)"
          consumers: [{component: agent-runner, namespace: strange-company}]
        - name: sc-backup
          description: Repository backup CronJobs (read + bundle). Secret forgejo/forgejo-sc-backup.
          scope: "read:repository, read:organization, read:user"
          consumers: [{component: repo-backup CronJob, namespace: forgejo}]
        - name: platform-probes
          description: sc-admin read token for break-glass, forge-drift and mirror probes (plan 15/16/17). Secret monitoring/platform-probes-forgejo.
          scope: "read:admin, read:repository, read:user"
          consumers: [{component: platform-probes, namespace: monitoring}]
        - name: sc-release
          description: Promotion-PR token of bot sc-release (plan 23). Pushes branches promote/* and opens PRs; never in a push allowlist of protected branches; also used by the sc-release protected-ref self-check.
          scope: "write:repository, write:issue on strange-company/strange-company (team sc-release, write)"
          consumers: [{component: "sc-release plugin step (build lane) only", namespace: ci-build}]
          storage: [{kind: sops-git, path: "secrets/ci/{cluster}/sc-release-forgejo.sops.yaml", authoritative: true}, {kind: woodpecker-secret, notes: "sc_release_pr_token; events [tag]; image filter sc-release"}, {kind: pod-spec-env, namespace: ci-build, name: "sc-release step pod", notes: "only if 23-AC-3 shows inlining (see SC-RELEASE-SIGNING)"}]
        - name: sc-gc
          description: Token of bot sc-gc (team sc-gc, packages unit write) used by plan 43's oci-retention job to delete unreferenced container package versions; no repository write. Secret forgejo/forgejo-sc-gc.
          scope: "write:package only"
          consumers: [{component: oci-retention CronJob, namespace: forgejo}]
          storage: [{kind: sops-git, path: "gitops/clusters/{cluster}/secrets/forgejo/forgejo-sc-gc.sops.yaml", authoritative: true}]
        - name: sc-e2e-human
          description: Token of the non-admin test account sc-e2e-human that merges PRs in org sc-e2e during C10/R02 suites (plan 46). Created at suite setup, held only in the operator's toolbox session, revoked at the end of the run.
          scope: "write:repository on org sc-e2e only (team allowed to merge in sc-e2e/*); never on strange-company"
          consumers: [{component: sc-e2e suite runner (toolbox), access: use}]
          storage: [{kind: process-memory, notes: toolbox session only}]
        - name: sc-ci-config
          description: Read-only token of bot sc-ci-config used by the Woodpecker configuration extension to read .woodpecker/** at the trusted revision (plan 20, ADR-0301). Secret woodpecker/forgejo-sc-ci-config.
          scope: "read:repository (team sc-bots-read)"
          consumers: [{component: sc-ci-config, namespace: woodpecker}]
      inRecoveryBundle: false
      forbiddenIn: [git-plaintext, logs, telemetry, worker-pods, hermes, ci-verification-pipelines]
      rotation:
        mode: scheduled
        maxAge: P90D
        triggers: [schedule, compromise-suspected]
        procedure: procedures/rotate-forge-credentials.md
        blastRadius: Per instance; sc-runner = all Runner-posted statuses, PRs and deploy keys.
        downtime: "seconds (consumer reloads its token Secret)"
      recovery: {from: [sops-git, regenerate]}
      compromise:
        severity: sev1
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Delete the token in Forgejo, Re-verify all strange-company/* statuses posted since exposure, Rotate]

    - id: SC-RUNNER-WEBHOOK
      title: Forgejo to Runner webhook HMAC secret
      description: HMAC-SHA256 key signing Forgejo webhooks delivered to the Runner hooks listener (ref-movement detection, ADR-0007). Aliases SC-FORGEJO-WEBHOOK (plan 16) and SC-FORGEJO-WEBHOOK-RUNNER (earlier register name).
      ownerPlan: "26"
