      compromise:
        severity: sev2
        procedure: procedures/credential-compromise.md#identity-and-forge
        actions: [Rotate host key and known_hosts in one PR]

    - id: SC-FORGEJO-METRICS-TOKEN
      title: Forgejo metrics bearer token
