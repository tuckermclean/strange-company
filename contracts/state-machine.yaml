      actors: [hermes, human]
      modes: [verification-first]
      guards: [G_DISPATCH_PREREQUISITES, G_NO_ACTIVE_EXECUTION, G_CONFLICT_REJECTED, G_JUDGE_APPROVED, G_PRODUCER_ROLE_ALLOWED, G_ATTEMPTS_REMAIN]
      effects: ["E_CREATE_EXECUTION:producer"]
      countsAttempt: true
      description: Adjudication upheld the judge; production retries.
    - id: T126
      from: [PRODUCING]
      to: JUDGING
      event: producer_result_accepted
      actors: [runner]
      modes: [verification-first]
      guards: [G_EXECUTION_ACCEPTED, G_PRODUCTION_SCOPE_VALID, G_JUDGE_ARTIFACT_INTACT]
      effects: [E_RECORD_IMPLEMENTATION_COMMIT, "E_POST_STATUS:pending", "E_TRIGGER_VERIFICATION:judge"]
      description: Produced output accepted; evaluate the approved judge.
    - id: T127
      from: [JUDGING]
      to: GREEN_VERIFIED
      event: judging_classified
      actors: [ci, runner]
      modes: [verification-first]
      guards: [G_EVIDENCE_AUTHENTIC, G_HEAD_UNCHANGED, "G_VERIFICATION_OUTCOME:judging_pass"]
      effects: ["E_RECORD_EVIDENCE:judge", "E_ENSURE_PR:ready", "E_POST_STATUS:pending"]
      description: The judge passed (actor runner only for runner-local judges such as research acceptance criteria).
    - id: T128
      from: [JUDGING]
      to: JUDGE_APPROVED
      event: judging_classified
      actors: [ci, runner]
      modes: [verification-first]
      guards: [G_EVIDENCE_AUTHENTIC, "G_VERIFICATION_OUTCOME:judging_fail", G_ATTEMPTS_REMAIN]
      effects: ["E_RECORD_EVIDENCE:judge", "E_COUNT_FAILURE:merit"]
      failureClass: merit
      description: The produced answer failed the judge.
    - id: T129
      from: [JUDGING]
      to: NEEDS_HUMAN
      event: judging_classified
      actors: [ci, runner]
      modes: [verification-first]
      guards: [G_EVIDENCE_AUTHENTIC, "G_VERIFICATION_OUTCOME:judging_fail", G_ATTEMPTS_EXHAUSTED]
      effects: ["E_RECORD_EVIDENCE:judge", "E_COUNT_FAILURE:merit", E_RECORD_RESUME_STATE, "E_NOTIFY_HUMAN:retries_exhausted"]
      failureClass: merit
      description: Judging retries exhausted.
    - id: T130
      from: [JUDGING]
      to: NEEDS_HUMAN
      event: judging_classified
      actors: [ci, runner]
      modes: [verification-first]
      guards: [G_EVIDENCE_AUTHENTIC, "G_VERIFICATION_OUTCOME:tamper_detected"]
      effects: ["E_RECORD_EVIDENCE:judge", "E_COUNT_FAILURE:policy", E_QUARANTINE_HEAD, "E_POST_STATUS:failure", E_RECORD_RESUME_STATE, "E_NOTIFY_HUMAN:policy_violation"]
      failureClass: policy
      description: Judge artifact or out-of-class paths changed.

    # ---- watchdog
    - id: T140
      from: [RED_VERIFYING, RED_VERIFIED, TEST_NEEDS_WORK, TEST_SPEC_CONFLICT, GREEN_VERIFYING, GREEN_VERIFIED, CHANGES_REQUESTED, JUDGE_VALIDATING, JUDGE_APPROVED, JUDGING]
      to: NEEDS_HUMAN
      event: stall_timeout
      actors: [runner]
      modes: [test-first, verification-first]
      guards: []
      effects: [E_CANCEL_ACTIVE_EXECUTION, E_CANCEL_PENDING_VERIFICATION, E_RECORD_RESUME_STATE, "E_NOTIFY_HUMAN:stalled"]
      description: A state exceeded its escalateAfter; autonomy stops and a human is notified.

  # ------------------------------------------------------------------ execution machine
  execution:
    states: [QUEUED, STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
    terminalStates: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
    transitions:
      - from: QUEUED
        to: STARTING
        trigger: dispatched
        description: "Dispatcher claimed the row (FOR UPDATE SKIP LOCKED), minted credentials and created the Job."
      - from: QUEUED
        to: CANCELLED
        trigger: cancel_requested
        description: "Task cancelled, blocked or escalated before a Job existed."
      - from: QUEUED
        to: FAILED
        trigger: dispatch_refused
        failureClasses: [budget, policy, infrastructure]
        description: "Re-check at dispatch failed (emergency stop or budget -> budget; policy unavailable -> policy; dependency down beyond retry -> infrastructure)."
      - from: QUEUED
        to: FAILED
        trigger: queue_timeout
        failureClasses: [infrastructure]
        description: "QUEUE_TIMEOUT - the execution waited longer than spec.retry.infrastructure.queueTimeout for a worker slot or heavy-slot units (the Job is not unsuspended while waiting, plan 26). Infrastructure class: refunded, requeue bounded by maxConsecutive."
      - from: STARTING
        to: RUNNING
        trigger: packet_fetched
        description: "First authenticated GET /v1/worker/packet."
      - from: STARTING
        to: FAILED
        trigger: start_failed
        failureClasses: [infrastructure]
        description: "START_TIMEOUT (STARTING > watchdog.startTimeoutSeconds; the Job deadline cannot expire first because the Job is unsuspended only when slot units are free), IMAGE_PULL, JOB_LOST."
      - from: STARTING
        to: CANCELLED
        trigger: cancel_requested
        description: "Cancelled while starting."
      - from: RUNNING
        to: SUCCEEDED
        trigger: result_accepted
        description: "Ingestion accepted a completed, blocked, test_spec_conflict or already_satisfied result."
      - from: RUNNING
        to: FAILED
        trigger: result_rejected
        failureClasses: [policy, infrastructure]
        description: "Violation (policy) or schema-invalid result (infrastructure)."
      - from: RUNNING
        to: FAILED
        trigger: worker_failed
        failureClasses: [infrastructure, policy, budget, merit]
        description: "Worker reported failed; class from the failure reason table (plan 29 §15.2)."
      - from: RUNNING
        to: FAILED
        trigger: result_missing
        failureClasses: [infrastructure]
        description: "Pod finished without a result, or the job or pod vanished."
      - from: RUNNING
        to: CANCELLED
        trigger: cancel_requested
        description: "Task-level cancel, block or escalation (no failure class). A QUEUED execution cancelled by an emergency stop records class budget, code EMERGENCY_STOP."
      - from: RUNNING
        to: TIMED_OUT
        trigger: deadline_exceeded
        failureClasses: [infrastructure]
        description: "Profile deadline or harness timeout after the worker started - infrastructure class, capped by maxConsecutiveTimeouts (plan 29 §15.2)."

  # ------------------------------------------------------------------ human projection
  humanProjection:
    - {humanState: Needs Human, label: status/needs-human, states: [NEEDS_HUMAN, JUDGE_AWAITING_APPROVAL, ALREADY_SATISFIED, NEEDS_INVESTIGATION], priority: 0}
    - {humanState: Needs Human, label: status/needs-human, states: [TEST_SPEC_CONFLICT], when: open_conflict.awaiting_human_approval, priority: 1}
    - {humanState: Blocked, label: status/blocked, states: [BLOCKED], priority: 2}
    - {humanState: Done, label: status/done, states: [DONE, CANCELLED], priority: 3}
    - {humanState: Review, label: status/review, states: [REVIEW, AWAITING_MERGE], priority: 4}
    - {humanState: Ready, label: status/ready, states: [SPECIFIED], when: no_execution_dispatched, priority: 5}
    - {humanState: In Progress, label: status/in-progress, states: [SPECIFIED, TEST_AUTHORING, RED_VERIFYING, RED_VERIFIED, TEST_NEEDS_WORK, TEST_SPEC_CONFLICT, IMPLEMENTING, GREEN_VERIFYING, GREEN_VERIFIED, CHANGES_REQUESTED, JUDGE_AUTHORING, JUDGE_VALIDATING, JUDGE_APPROVED, PRODUCING, JUDGING], priority: 6}
