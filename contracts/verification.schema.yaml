          approval: {alertAfter: 72h}
      humanAuthority:
        forgejoTeams: [Owners, engineers]
        machineAccounts: [sc-runner, sc-woodpecker, sc-renovate, sc-backup, sc-admin, sc-ci-config]
        maxCommandsPerTaskPerHour: 10
