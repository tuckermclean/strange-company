        requiredStatusContexts: ["ci/woodpecker/pr/ci", strange-company/tdd-provenance, strange-company/review, strange-company/release-provenance]
        reviewRequired: true
        humanApprovalsRequired: 1
        elevatedApprovals: 2
        agentPullRequestApprovals: 1
        operatorPullRequestApprovals: 0
        singleOperatorCoolingOff: 24h
        nonTaskPullRequests: success-human-authored
