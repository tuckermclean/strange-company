$schema: https://json-schema.org/draft/2020-12/schema
$id: https://strange.company/contracts/version-locks/v1alpha1
title: VersionLocks
description: |
  Schemas of the repository's version lock files and lab definitions (plan 01 §6.3, §8.2;
  ADR-0106). Every pinned version, digest and checksum lives in exactly one of these
  files; `make locks-check` validates each file against the `$defs` entry matching its
  `kind` and then applies the cross-file rules of plan 01 §6.3 (which this schema cannot
  express: Flux CLI = Flux controllers, kubectl minor = k3s minor = platform Kubernetes
  minor, every rendered chart/image appears in the platform lock).

  Files and kinds:
  - `versions/platform.lock.yaml`        PlatformVersionLock (plan 01, 18)
  - `versions/k3s.lock.yaml`             K3sVersionLock (plan 07; includes the CoreDNS image plan 09 renders)
  - `versions/compat.yaml`               CompatibilityMatrix (plans 07, 48)
  - `versions/internal-images.lock.yaml` InternalImageLock (plan 23)
  - `versions/lab-images.lock.yaml`      LabImageLock (plan 05)
  - `infra/lab/lab.yaml`                 LabSpec (plan 05)
  - `toolbox/tools.lock.yaml`            ToolboxLock (plan 02)
  - `toolbox/image.lock`                 ToolboxImageLock (plan 02; flat key: value file)

  Owned by plan 01. Version numbers in the examples are illustrative.
oneOf:
  - $ref: '#/$defs/PlatformVersionLock'
  - $ref: '#/$defs/K3sVersionLock'
  - $ref: '#/$defs/CompatibilityMatrix'
  - $ref: '#/$defs/InternalImageLock'
  - $ref: '#/$defs/LabImageLock'
  - $ref: '#/$defs/LabSpec'
  - $ref: '#/$defs/ToolboxLock'
  - $ref: '#/$defs/ToolboxImageLock'
$defs:
  apiVersion:
    const: strange.company/v1alpha1
  metadata:
    type: object
    additionalProperties: false
    properties:
      name: {type: string, minLength: 1}
      description: {type: string}
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  sha256Hex:
    type: string
    pattern: '^[0-9a-f]{64}$'
  sha512Hex:
    type: string
    pattern: '^[0-9a-f]{128}$'
  semver:
    description: Exact version, optional leading v; no ranges.
    type: string
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'
  k8sMinor:
    type: string
    pattern: '^1\.[0-9]{2}$'
  imageRef:
    description: Image reference pinned by digest (tag optional, for humans only).
    type: string
    pattern: '^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$'
  selection:
    type: object
    additionalProperties: false
    required: [selectedBy, verifiedAt]
    properties:
      selectedBy:
        description: Short id of the owning plan's selection rule.
        type: string
        pattern: '^[a-z0-9-]+:[A-Za-z0-9.<>=_+-]+$'
      verifiedAt:
        description: Date of the last re-verification test run for version-sensitive behavior.
        type: string
        format: date
  archSha256:
    type: object
    additionalProperties: false
    required: [amd64]
    properties:
      amd64: {$ref: '#/$defs/sha256Hex'}
      arm64: {$ref: '#/$defs/sha256Hex'}

  PlatformVersionLock:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: PlatformVersionLock}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [kubernetes, flux, charts, images]
        properties:
          kubernetes:
            type: object
            additionalProperties: false
            required: [minor]
            properties:
              minor: {$ref: '#/$defs/k8sMinor'}
          flux:
            type: object
            additionalProperties: false
            required: [version, selectedBy, verifiedAt]
            properties:
              version: {$ref: '#/$defs/semver'}
              selectedBy: {$ref: '#/$defs/selection/properties/selectedBy'}
              verifiedAt: {type: string, format: date}
          charts:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [name, source, version, usedBy]
              properties:
                name: {type: string, pattern: '^[a-z0-9][a-z0-9-]*$'}
                source:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [oci]
                      properties:
                        oci: {type: string, pattern: '^oci://'}
                    - type: object
                      additionalProperties: false
                      required: [helm, chart]
                      properties:
                        helm: {type: string, pattern: '^https://'}
                        chart: {type: string}
                version: {$ref: '#/$defs/semver'}
                digest: {$ref: '#/$defs/digest'}
                usedBy: {type: string, pattern: '^gitops/'}
                selectedBy: {type: string}
                verifiedAt: {type: string, format: date}
              if:
                properties: {source: {required: [oci]}}
              then:
                required: [digest]
          images:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [name, ref, usedBy]
              properties:
                name: {type: string}
                ref: {$ref: '#/$defs/imageRef'}
                tag: {type: string}
                usedBy: {type: string}

  K3sVersionLock:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: K3sVersionLock}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [k3s, etcdctl, coredns]
        properties:
          k3s:
            type: object
            additionalProperties: false
            required: [version, kubernetesMinor, sha256, selectedBy, verifiedAt]
            properties:
              version:
                description: k3s release, e.g. v1.34.1+k3s1.
                type: string
                pattern: '^v1\.[0-9]{2}\.[0-9]+\+k3s[0-9]+$'
              kubernetesMinor: {$ref: '#/$defs/k8sMinor'}
              sha256: {$ref: '#/$defs/archSha256'}
              airgapImagesSha256: {$ref: '#/$defs/archSha256'}
              selectedBy: {type: string}
              verifiedAt: {type: string, format: date}
          etcdctl:
            type: object
            additionalProperties: false
            required: [version, sha256]
            properties:
              version: {$ref: '#/$defs/semver'}
              sha256: {$ref: '#/$defs/archSha256'}
          coredns:
            description: CoreDNS image rendered by plan 09 (bundled CoreDNS is replaced, plan 07 07-R-3).
            type: object
            additionalProperties: false
            required: [image]
            properties:
              image: {$ref: '#/$defs/imageRef'}
              tag: {type: string}

  CompatibilityMatrix:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: CompatibilityMatrix}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [components]
        properties:
          components:
            description: Component name → Kubernetes minors supported by the pinned version (from upstream support matrices).
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required: [version, kubernetesMinors, source]
              properties:
                version: {type: string}
                kubernetesMinors:
                  type: array
                  minItems: 1
                  items: {$ref: '#/$defs/k8sMinor'}
                source: {type: string, format: uri}
          facts:
            description: Recorded third-party behavior facts (e.g. k3s.etcdLearnerJoin), each with evidence.
            type: object
            additionalProperties:
              type: object
              additionalProperties: false
              required: [value, evidence, verifiedAt]
              properties:
                value: {type: [boolean, string, number]}
                evidence: {type: string}
                verifiedAt: {type: string, format: date}

  InternalImageLock:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: InternalImageLock}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [release, images]
        properties:
          release: {$ref: '#/$defs/semver'}
          sourceCommit: {type: string, pattern: '^[0-9a-f]{40}$'}
          images:
            type: object
            minProperties: 1
            propertyNames: {pattern: '^[a-z0-9][a-z0-9-]*$'}
            additionalProperties: {$ref: '#/$defs/imageRef'}

  LabImageLock:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: LabImageLock}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [images]
        properties:
          images:
            type: object
            minProperties: 1
            propertyNames: {enum: [debian-13, ubuntu-24.04]}
            additionalProperties:
              type: object
              additionalProperties: false
              required: [serial, amd64]
              properties:
                serial: {type: string, minLength: 1}
                amd64:
                  type: object
                  additionalProperties: false
                  required: [url]
                  properties:
                    url: {type: string, pattern: '^https://'}
                    sha256: {$ref: '#/$defs/sha256Hex'}
                    sha512: {$ref: '#/$defs/sha512Hex'}
                  anyOf:
                    - required: [sha256]
                    - required: [sha512]

  LabSpec:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: LabSpec}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [substrates, internalNetwork, sshPortBase]
        properties:
          internalNetwork:
            description: Private L2 segment between lab VMs (plan 05 §14.6).
            type: string
            pattern: '^([0-9]{1,3}\.){3}0/24$'
          sshPortBase:
            description: host-loopback SSH forward for node-0N is sshPortBase + N.
            type: integer
            minimum: 1024
            maximum: 65000
          substrates:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required: [nodes, vcpu, memory, disk, diskDevice]
              properties:
                nodes: {type: integer, minimum: 1, maximum: 3}
                vcpu: {type: integer, minimum: 1, maximum: 8}
                memory: {type: string, pattern: '^[1-9][0-9]*Gi$'}
                disk: {type: string, pattern: '^[1-9][0-9]*Gi$'}
                diskDevice: {enum: [virtio-blk, scsi-hd-ssd]}

  ToolboxLock:
    type: object
    additionalProperties: false
    required: [apiVersion, kind, spec]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: ToolboxLock}
      metadata: {$ref: '#/$defs/metadata'}
      spec:
        type: object
        additionalProperties: false
        required: [baseImages, debianSnapshot, aptPackages, tools, pythonRequirements, ansibleCollections]
        properties:
          baseImages:
            type: object
            additionalProperties: false
            required: [debian, golang]
            properties:
              debian: {$ref: '#/$defs/baseImage'}
              golang: {$ref: '#/$defs/baseImage'}
          debianSnapshot:
            type: string
            pattern: '^[0-9]{8}T[0-9]{6}Z$'
          aptPackages:
            type: object
            additionalProperties: false
            required: [runtime, ci]
            properties:
              runtime: {type: array, items: {type: string, pattern: '^[a-z0-9][a-z0-9.+-]*$'}}
              ci: {type: array, items: {type: string, pattern: '^[a-z0-9][a-z0-9.+-]*$'}}
          tools:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [name, set, version, selectedBy, sha256, versionCommand, versionRegex, verifiedAt]
              properties:
                name: {type: string, pattern: '^[a-z0-9][a-z0-9_-]*$'}
                set: {enum: [runtime, ci]}
                version: {type: string, pattern: '^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.+-]+)?$'}
                selectedBy: {type: string}
                url:
                  description: Download URL template with {version} and {arch}. Absent for `go install` tools.
                  type: string
                  pattern: '^https://'
                goInstall:
                  description: Go module path for tools built with `go install <module>@<version>`.
                  type: string
                sha256: {$ref: '#/$defs/archSha256'}
                install:
                  type: object
                  additionalProperties: false
                  properties:
                    extract: {type: string}
                    to: {type: string, pattern: '^/'}
                versionCommand: {type: array, minItems: 1, items: {type: string}}
                versionRegex: {type: string}
                verifiedAt: {type: string, format: date}
              oneOf:
                - required: [url]
                - required: [goInstall]
          pythonRequirements: {const: toolbox/requirements.txt}
          ansibleCollections:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [name, version, url, sha256]
              properties:
                name: {type: string, pattern: '^[a-z0-9_]+\.[a-z0-9_]+$'}
                version: {$ref: '#/$defs/semver'}
                url: {type: string, pattern: '^https://'}
                sha256: {$ref: '#/$defs/sha256Hex'}
  baseImage:
    type: object
    additionalProperties: false
    required: [ref, digest]
    properties:
      ref: {type: string}
      digest: {$ref: '#/$defs/digest'}

  ToolboxImageLock:
    description: Flat file read by the POSIX wrapper with sed (plan 02 §9.3). An empty digest means "always build".
    type: object
    additionalProperties: false
    required: [apiVersion, kind, inputsId, toolboxImage, toolboxDigest, ciImage, ciDigest]
    properties:
      apiVersion: {$ref: '#/$defs/apiVersion'}
      kind: {const: ToolboxImageLock}
      inputsId:
        description: Git object id over the toolbox inputs (plan 02 §14.2 step 5); empty before the first release.
        type: string
        pattern: '^([0-9a-f]{40}|[0-9a-f]{64})?$'
      toolboxImage: {type: string, pattern: '^[a-z0-9.-]+(/[a-z0-9._-]+)+$'}
      toolboxDigest: {type: string, pattern: '^(sha256:[0-9a-f]{64})?$'}
      ciImage: {type: string, pattern: '^[a-z0-9.-]+(/[a-z0-9._-]+)+$'}
      ciDigest: {type: string, pattern: '^(sha256:[0-9a-f]{64})?$'}
      platforms:
        description: Published platforms; MVP publishes linux/amd64 only (plan 02 §19).
        type: string
        pattern: '^linux/amd64(,linux/arm64)?$'
      sourceCommit: {type: string, pattern: '^([0-9a-f]{40})?$'}
      publishedAt: {type: [string, 'null'], format: date-time}
    allOf:
      - if: {properties: {toolboxDigest: {minLength: 1}}}
        then: {properties: {inputsId: {minLength: 40}, ciDigest: {minLength: 1}}}
examples:
  - apiVersion: strange.company/v1alpha1
    kind: PlatformVersionLock
    spec:
      kubernetes: {minor: '1.34'}
      flux: {version: 2.7.2, selectedBy: 'flux:latest-minor-supporting-k8s', verifiedAt: '2026-10-01'}
      charts:
        - name: cert-manager
          source: {oci: oci://quay.io/jetstack/charts/cert-manager}
          version: 1.19.1
          digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
          usedBy: gitops/platform/cert-manager
        - name: forgejo
          source: {oci: oci://code.forgejo.org/forgejo-helm/forgejo}
          version: 14.0.3
          digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
          usedBy: gitops/platform/forgejo
      images:
        - name: cloudflared
          ref: docker.io/cloudflare/cloudflared:2026.9.1@sha256:3333333333333333333333333333333333333333333333333333333333333333
          tag: 2026.9.1
          usedBy: gitops/platform/cloudflared
  - apiVersion: strange.company/v1alpha1
    kind: K3sVersionLock
    spec:
      k3s:
        version: v1.34.1+k3s1
        kubernetesMinor: '1.34'
        sha256: {amd64: '4444444444444444444444444444444444444444444444444444444444444444'}
        selectedBy: 'k3s:latest-patch-of-supported-minor'
        verifiedAt: '2026-10-01'
      etcdctl: {version: v3.6.5, sha256: {amd64: '5555555555555555555555555555555555555555555555555555555555555555'}}
      coredns: {image: docker.io/coredns/coredns:1.12.4@sha256:6666666666666666666666666666666666666666666666666666666666666666, tag: 1.12.4}
  - apiVersion: strange.company/v1alpha1
    kind: CompatibilityMatrix
    spec:
      components:
        longhorn: {version: 1.10.0, kubernetesMinors: ['1.32', '1.33', '1.34'], source: 'https://longhorn.io/docs/1.10.0/best-practices/'}
      facts:
        k3s.etcdLearnerJoin: {value: true, evidence: 'out/e2e-lab/expand/member-list.txt (lab-ha nightly 2026-10-01)', verifiedAt: '2026-10-01'}
  - apiVersion: strange.company/v1alpha1
    kind: InternalImageLock
    spec:
      release: v0.3.0
      sourceCommit: 0123456789abcdef0123456789abcdef01234567
      images:
        agent-runner: git.example.com/strange-company/agent-runner@sha256:7777777777777777777777777777777777777777777777777777777777777777
  - apiVersion: strange.company/v1alpha1
    kind: LabImageLock
    spec:
      images:
        debian-13:
          serial: '20261001-2250'
          amd64:
            url: https://cloud.debian.org/images/cloud/trixie/20261001-2250/debian-13-genericcloud-amd64-20261001-2250.qcow2
            sha512: '88888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888888'
        ubuntu-24.04:
          serial: '20261001'
          amd64:
            url: https://cloud-images.ubuntu.com/releases/24.04/release-20261001/ubuntu-24.04-server-cloudimg-amd64.img
            sha256: '9999999999999999999999999999999999999999999999999999999999999999'
  - apiVersion: strange.company/v1alpha1
    kind: LabSpec
    spec:
      internalNetwork: 10.77.0.0/24
      sshPortBase: 2200
      substrates:
        lab-small: {nodes: 1, vcpu: 2, memory: 4Gi, disk: 20Gi, diskDevice: virtio-blk}
        lab-ha: {nodes: 3, vcpu: 2, memory: 4Gi, disk: 20Gi, diskDevice: scsi-hd-ssd}
        lab-seed: {nodes: 1, vcpu: 4, memory: 8Gi, disk: 40Gi, diskDevice: virtio-blk}
  - apiVersion: strange.company/v1alpha1
    kind: ToolboxLock
    spec:
      baseImages:
        debian: {ref: 'docker.io/library/debian:trixie-slim', digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
        golang: {ref: 'docker.io/library/golang:1.25-trixie', digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}
      debianSnapshot: 20261001T000000Z
      aptPackages:
        runtime: [bash, ca-certificates, curl, git, openssh-client, python3, tini, libnss-wrapper]
        ci: [make, shellcheck, qemu-system-x86, cloud-image-utils]
      tools:
        - name: opentofu
          set: runtime
          version: 1.11.0
          selectedBy: 'tofu:latest-stable>=1.11'
          url: https://github.com/opentofu/opentofu/releases/download/v{version}/tofu_{version}_linux_{arch}.tar.gz
          sha256: {amd64: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc}
          install: {extract: tofu, to: /opt/sc/bin/tofu}
          versionCommand: [tofu, version, -json]
          versionRegex: '"terraform_version":\s*"1\.11\.0"'
          verifiedAt: '2026-10-01'
      pythonRequirements: toolbox/requirements.txt
      ansibleCollections:
        - {name: ansible.posix, version: 2.1.0, url: 'https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/ansible-posix-2.1.0.tar.gz', sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd}
  - apiVersion: strange.company/v1alpha1
    kind: ToolboxImageLock
    inputsId: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
    toolboxImage: ghcr.io/example-org/strange-company-toolbox
    toolboxDigest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    ciImage: ghcr.io/example-org/strange-company-ci
    ciDigest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    platforms: linux/amd64
    sourceCommit: 0123456789abcdef0123456789abcdef01234567
    publishedAt: '2026-10-13T12:00:00Z'
  - apiVersion: strange.company/v1alpha1
    kind: ToolboxImageLock
    inputsId: ''
    toolboxImage: ghcr.io/example-org/strange-company-toolbox
    toolboxDigest: ''
    ciImage: ghcr.io/example-org/strange-company-ci
    ciDigest: ''
x-invalid-examples:
  - reason: image pinned by tag only (floating reference)
    value:
      apiVersion: strange.company/v1alpha1
      kind: PlatformVersionLock
      spec:
        kubernetes: {minor: '1.34'}
        flux: {version: 2.7.2, selectedBy: 'flux:latest-minor-supporting-k8s', verifiedAt: '2026-10-01'}
        charts: []
        images:
          - {name: cloudflared, ref: 'docker.io/cloudflare/cloudflared:2026.9.1', usedBy: gitops/platform/cloudflared}
  - reason: OCI chart without digest
    value:
      apiVersion: strange.company/v1alpha1
      kind: PlatformVersionLock
      spec:
        kubernetes: {minor: '1.34'}
        flux: {version: 2.7.2, selectedBy: 'flux:latest-minor-supporting-k8s', verifiedAt: '2026-10-01'}
        charts:
          - {name: cert-manager, source: {oci: 'oci://quay.io/jetstack/charts/cert-manager'}, version: 1.19.1, usedBy: gitops/platform/cert-manager}
        images: []
  - reason: chart version range instead of an exact version
    value:
      apiVersion: strange.company/v1alpha1
      kind: PlatformVersionLock
      spec:
        kubernetes: {minor: '1.34'}
        flux: {version: 2.7.2, selectedBy: 'flux:x', verifiedAt: '2026-10-01'}
        charts:
          - {name: longhorn, source: {helm: 'https://charts.longhorn.io', chart: longhorn}, version: '^1.10', usedBy: gitops/platform/longhorn}
        images: []
  - reason: K3s lock without the CoreDNS entry
    value:
      apiVersion: strange.company/v1alpha1
      kind: K3sVersionLock
      spec:
        k3s: {version: v1.34.1+k3s1, kubernetesMinor: '1.34', sha256: {amd64: '4444444444444444444444444444444444444444444444444444444444444444'}, selectedBy: x, verifiedAt: '2026-10-01'}
        etcdctl: {version: v3.6.5, sha256: {amd64: '5555555555555555555555555555555555555555555555555555555555555555'}}
  - reason: tool without a checksum
    value:
      apiVersion: strange.company/v1alpha1
      kind: ToolboxLock
      spec:
        baseImages:
          debian: {ref: x, digest: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
          golang: {ref: y, digest: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'}
        debianSnapshot: 20261001T000000Z
        aptPackages: {runtime: [bash], ci: []}
        tools:
          - {name: jq, set: runtime, version: 1.8.1, selectedBy: 'jq:latest-1.x', url: 'https://github.com/jqlang/jq/releases/download/jq-{version}/jq-linux-{arch}', versionCommand: [jq, --version], versionRegex: 'jq-1\.8\.1', verifiedAt: '2026-10-01'}
        pythonRequirements: toolbox/requirements.txt
        ansibleCollections: []
  - reason: published toolbox digest without the inputs id it was built from
    value:
      apiVersion: strange.company/v1alpha1
      kind: ToolboxImageLock
      inputsId: ''
      toolboxImage: ghcr.io/example-org/strange-company-toolbox
