      credentials: {secrets_dir: /var/run/sc/secrets, deploy_key_file: deploy-key, known_hosts_file: known_hosts, gateway_token_file: gateway-token, harness_secrets_dir: /var/run/sc/harness-secrets, egress_token_file: egress-token, deploy_key: "-----BEGIN OPENSSH PRIVATE KEY-----"}
