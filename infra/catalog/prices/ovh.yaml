      specs: {cpu: 6, memory: 12GB, storage: {size: 100GB, class: nvme}}
      regions: [BHS, DE, EU-SOUTH-MIL, EU-WEST-RBX, GRA, SBG, SGP, SYD, UK, WAW, YNM]
      monthlyPrice: '9.99'
