# OVH price catalogue (plan 03 section 14.5, plan 04 section 9.2). Prices are copied from OVH's public order
# catalogue on the day of entry (CD-71): ovhSubsidiary=FR, currency EUR, taxRate 20 %. The catalogue lists
# `price` before tax (the 20 % VAT is a separate `tax` field), so every entry is taxIncluded: false.
# Monthly VPS prices are the `renew` pricing, interval 1 month, mode `default`; the installation fee is 0.
# The Public Cloud monthlyPrice is derived (hourlyPrice x 730 h); OVH bills b3-16 hourly.
apiVersion: strange.company/v1alpha1
kind: InfraPriceCatalog
metadata:
  name: ovh
  version: 2026.10.31
spec:
  provider: ovh
  currency: EUR
  entries:
