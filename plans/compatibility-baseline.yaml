      versionSensitiveAssumptions:
        - "*_file fields of email, Slack, Discord and webhook integrations (42-AC-5)"
        - receiver_name label on alertmanager_notifications_total / _failed_total (42-AC-6, Q-42-4)
        - /api/v2/alerts accepted from Flux notification-controller
      notes: Image tag of kube-prometheus-stack 92.7.0.

    - name: kube-state-metrics
      baselineVersion: v2.20.0
      line: 2.20.x
      evidence:
        status: verified
        source: https://github.com/kubernetes/kube-state-metrics/releases/tag/v2.20.0
        checked: "2026-10-14"
      planRefs: [plans/38-prometheus.md, plans/42-alerting-notifications.md, plans/18-flux.md]
      versionSensitiveAssumptions:
        - kube_cronjob_status_last_successful_time (42-AC-12)
        - custom-resource-state metrics (kube_customresource_created, Flux gotk_resource_info, CNPG certificate expiry)
      notes: kube-prometheus-stack 92.7.0 subchart 8.6.0.

    - name: Prometheus blackbox exporter
      baselineVersion: v0.29.0
      line: 0.29.x
      chart: {name: prometheus-blackbox-exporter, repository: "https://prometheus-community.github.io/helm-charts", version: 11.20.0}
      evidence:
        status: verified
        source: https://github.com/prometheus/blackbox_exporter/releases/tag/v0.29.0
        checked: "2026-10-14"
      planRefs: [plans/38-prometheus.md]
      versionSensitiveAssumptions:
        - http_2xx and tcp_connect modules for the internal probes
      notes: Released 2026-10-13; the previous line is 0.28.x (2025-12-06).

    - name: Grafana
      baselineVersion: v13.2.4
      line: 13.2.x
      chart: {name: grafana, repository: "https://grafana-community.github.io/helm-charts", version: 13.6.0}
      evidence:
        status: verified
        source: https://github.com/grafana/grafana/releases/tag/v13.2.4
        checked: "2026-10-14"
      planRefs: [plans/39-grafana.md, plans/15-authentik.md]
      versionSensitiveAssumptions:
