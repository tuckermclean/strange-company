      notes: >-
        The Grafana OSS chart is now published from grafana-community/helm-charts (chart 13.6.0, appVersion 13.2.4).
        Plan 39 anticipated a repository move and re-verifies it.

    - name: OpenTelemetry Collector (contrib)
      baselineVersion: v0.162.0
      line: 0.162.x
      chart: {name: opentelemetry-collector, repository: "https://open-telemetry.github.io/opentelemetry-helm-charts", version: 0.176.0}
      evidence:
        status: verified
