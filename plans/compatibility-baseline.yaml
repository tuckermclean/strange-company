# Stage-0 compatibility baseline (CD-29, ADR-0022; external review PR #138 finding #3).
#
# For every third-party component the plans depend on, this file records the exact
# version or release line the plans were reasoned against, with the evidence date.
# It supersedes the version "selection rules" stated in the plans (ADR-0022).
#
# - Implementation pins any release inside `line`. Patch updates inside the line
#   are free; plan release-age soaks (Renovate `minimumReleaseAge`, "≥ 14 days old")
#   still apply to them.
# - A release outside `line` (newer minor or major) is a plan-amendment task: update
#   this file, re-run the affected plans' (verify) acceptance criteria, review it like
#   an architecture change.
# - `lineKind: major` is used only where a component ships a new minor with almost
#   every release; each such entry gives its reason in `notes`.
#
# Validated by contracts/compatibility-baseline.schema.yaml (tools/stage0/validate.py C03).
apiVersion: strange.company/v1alpha1
kind: CompatibilityBaseline
metadata:
  name: stage0
  checkedAt: "2026-10-14"
  decision: CD-29
  adr: adr/0022-stage0-compatibility-baseline.md
spec:
  components:
    # ------------------------------------------------------------------ cluster
    - name: k3s / Kubernetes
      baselineVersion: v1.36.5+k3s1
      line: 1.36.x
      evidence:
        status: verified
        source: https://update.k3s.io/v1-release/channels
        checked: "2026-10-14"
      planRefs: [plans/07-k3s.md, plans/48-upgrade.md, plans/37-admission-policy.md, plans/36-network-policy.md, plans/38-prometheus.md, plans/51-capacity-and-scheduling.md, plans/33-budget-enforcement.md, plans/09-networking.md]
      versionSensitiveAssumptions:
        - config.yaml.d drop-in merge order; cluster-init ignored once etcd data exists (07-AC-3, 07-AC-4)
        - tls-san change regenerates the serving certificate on restart (07-AC-21)
        - secrets-encryption snapshots unreadable without the token (07-AC-12); secrets-encrypt rotate-keys (k3s ≥ 1.28)
        - leaf certificates renewed within 90 days of expiry at service start (07-AC-17)
        - etcd learners on join (07-AC-20); etcd-expose-metrics serves http :2381 (38-AC-5); etcdsnapshotfiles.k3s.cattle.io CRD; `k3s etcd-snapshot ls --output json`
        - PSA admission config via kube-apiserver-arg or pod-security-admission-config-file (07-AC-24, 37-AC-3); per-controller ServiceAccount credentials
        - ValidatingAdmissionPolicy GA (≥ 1.30), CEL quantity/strings libraries and cost limits on the pinned minor (37-AC-1, 37-AC-5)
        - kube-router named-port support and LOCAL source acceptance (36-AC-3, 36-AC-4)
        - CoreDNS `rewrite … answer auto` in the bundled CoreDNS (09-AC-6); kubelet ConfigMap sync latency (plan 33)
        - LimitRange defaults for extended resources (51-AC-7)
      notes: >-
        Newest minor on the k3s `stable` channel (v1.36.5+k3s1, released 2026-09-30). 1.37 (v1.37.1+k3s1) is only on
        `latest` and is outside the supported Kubernetes ranges of Flux 2.9 (1.34–1.36), cert-manager 1.21 (1.33–1.36)
        and CNPG 1.30 (1.34–1.36), so plan 07 §19.1 (b) also selects 1.36. Embedded components of v1.36.5+k3s1: etcd
        v3.6.14-k3s3, containerd v2.3.4-k3s1.36, runc v1.4.2, flannel v0.28.4, CoreDNS v1.14.7, local-path-provisioner
        v0.0.37, metrics-server v0.9.0 (k3s release notes). etcdutl and envtest assets derive from this entry.

    - name: kubectl
      baselineVersion: v1.36.5
      line: 1.36.x
      evidence:
        status: verified
        source: https://github.com/kubernetes/kubernetes/releases/tag/v1.36.5
        checked: "2026-10-14"
      planRefs: [plans/02-bootstrap-toolbox.md, plans/01-repository.md, plans/51-capacity-and-scheduling.md]
      versionSensitiveAssumptions:
        - skew 0 with the k3s minor (locks-check cross-file rule)
        - registry.k8s.io/kubectl image exists for the pinned version (plan 51 heavy-slot-advertiser)
      notes: Derived from the k3s / Kubernetes entry; same minor, latest patch.

    - name: Flux
      baselineVersion: v2.9.6
      line: 2.9.x
      evidence:
        status: verified
        source: https://github.com/fluxcd/flux2/releases/tag/v2.9.6
        checked: "2026-10-14"
      planRefs: [plans/18-flux.md, plans/19-seed-handoff.md, plans/33-budget-enforcement.md, plans/35-secrets.md, plans/02-bootstrap-toolbox.md]
      versionSensitiveAssumptions:
        - Bucket source semantics used by the seed (19-AC-4)
        - kustomize-controller StrictPostBuildSubstitutions feature gate name (19-AC-17)
        - "`flux diff kustomization` exit codes and SOPS skip (19-AC-18)"
        - healthCheckExprs (Flux ≥ 2.5) for the CNPG Cluster gate (18 Q2)
        - kustomize build without load restrictor (18 Q5); helm-controller values merge order (18-AC-12)
        - notification-controller alertmanager Provider path handling; DecryptionFailed event surface (plan 35)
        - controllers run under PSA restricted; prune only own inventory (33-AC-12)
      notes: >-
        Flux 2.9 supports Kubernetes 1.34–1.36 (release notes). Since Flux 2.8 helm-controller embeds Helm v4 and
        defaults HelmRelease to server-side apply with kstatus health checking; plans 18/54 reasoning about
        helm-controller drift detection and remediation must be re-verified against that behavior. Flux 2.9 removed
        image.toolkit/v1beta2 and notification.toolkit/v1beta2 CRD versions. The flux CLI equals this version.

    - name: Helm
      baselineVersion: v4.3.0
      line: 4.3.x
      evidence:
        status: verified
        source: https://github.com/helm/helm/releases/tag/v4.3.0
        checked: "2026-10-14"
      planRefs: [plans/02-bootstrap-toolbox.md, plans/54-strange-company-chart.md]
      versionSensitiveAssumptions:
        - same Helm major as the pinned Flux helm-controller (v4 since Flux 2.8)
        - chart apiVersion v2 and helm-unittest plugin compatibility
      notes: Helm 3.22.0 is still released in parallel; plan 02's rule selects the v4 major because Flux ≥ 2.8 uses Helm v4.

    - name: cert-manager
      baselineVersion: v1.21.2
      line: 1.21.x
      evidence:
        status: verified
        source: https://cert-manager.io/docs/releases/
        checked: "2026-10-14"
      planRefs: [plans/10-tls-certificates.md, plans/48-upgrade.md, plans/23-supply-chain.md]
      versionSensitiveAssumptions:
        - metric names certmanager_certificate_expiration_timestamp_seconds / ready_status (10-AC-9)
        - webhook serving certificate is self-renewing
        - publisher signature practice (plan 23 upstream-signatures.yaml)
      notes: cert-manager 1.21 supports Kubernetes 1.33–1.36. cmctl derives from this entry.

    - name: CloudNativePG operator
      baselineVersion: v1.30.1
      line: 1.30.x
      chart: {name: cloudnative-pg, repository: "https://cloudnative-pg.github.io/charts", version: 0.29.1}
      evidence:
        status: verified
        source: https://cloudnative-pg.io/docs/devel/supported_releases
        checked: "2026-10-14"
      planRefs: [plans/12-cnpg.md, plans/10-tls-certificates.md, plans/38-prometheus.md, plans/42-alerting-notifications.md, plans/44-backup.md, plans/45-recovery.md, plans/48-upgrade.md]
      versionSensitiveAssumptions:
        - enablePDB field; postgresql.synchronous dataDurability preferred (CNPG ≥ 1.25)
        - declarative offline in-place major upgrade (CNPG ≥ 1.26)
        - certificate lifetimes and status.certificates.expirations field (10-AC-11)
        - refusal to archive into a non-empty WAL path (generation scheme, plan 12)
        - in-tree Barman Cloud removal announced for 1.31 (not confirmed on the supported-releases page)
      notes: >-
        CNPG 1.30 (released 2026-06-29, EOL ~Dec 2026) supports Kubernetes 1.34–1.36 and PostgreSQL 14–18. 1.31.0
        is scheduled for ~Sep 2026 but not released on 2026-10-14; adopting it is a plan amendment (and plan 12's
        in-tree Barman removal note must be re-checked then). kubectl-cnpg derives from this entry.

    - name: CNPG Barman Cloud plugin
      baselineVersion: v0.15.1
      line: 0.15.x
      chart: {name: plugin-barman-cloud, repository: "https://cloudnative-pg.github.io/charts", version: 0.8.1}
      evidence:
        status: verified
        source: https://github.com/cloudnative-pg/plugin-barman-cloud/releases/tag/v0.15.1
        checked: "2026-10-14"
      planRefs: [plans/12-cnpg.md, plans/14-object-storage.md, plans/42-alerting-notifications.md, plans/44-backup.md]
      versionSensitiveAssumptions:
        - isWALArchiver toggle for emergency detach; .ready WAL recycling after re-attach
        - last-backup and first-recoverability-point metrics (plan 42 recording rules)
        - barman-cloud-wal-archive S3 client behavior against the provider (OC-17)
      notes: Matches plan 12's observation (0.15.x).

    - name: PostgreSQL
      baselineVersion: "18.6"
      line: 18.x
      lineKind: major
      evidence:
        status: verified
        source: https://www.postgresql.org/support/versioning/
        checked: "2026-10-14"
      planRefs: [plans/12-cnpg.md, plans/48-upgrade.md, plans/44-backup.md]
      versionSensitiveAssumptions:
        - wal_compression lz4 supported by the image build
      notes: >-
        PostgreSQL minors are bug-fix only, so the line is the major. 18 is the newest major CNPG 1.30 supports and has
        ≥ 1 minor release (plan 48 §9.1). PostgreSQL 18 is supported until 2030-11-14.

    - name: Longhorn
      baselineVersion: v1.11.3
      line: 1.11.x
      chart: {name: longhorn, repository: "https://charts.longhorn.io", version: 1.11.3}
      evidence:
        status: verified
        source: https://github.com/longhorn/longhorn/releases/tag/v1.11.3
        checked: "2026-10-14"
      planRefs: [plans/13-longhorn.md, plans/38-prometheus.md, plans/36-network-policy.md, plans/39-grafana.md, plans/48-upgrade.md]
      versionSensitiveAssumptions:
        - no downgrade support (13-R-4, Q-13-1)
        - longhornctl check preflight (13-AC-4)
        - setting names nodeDrainPolicy values, snapshotMaxCount, deletingConfirmationFlag, autoSalvage; defaultSettings sync on upgrade (13-AC-14)
        - BackupTarget CR replaces backup-target setting; backups.longhorn.io label key (13-AC-9)
        - Volume spec.fromBackup URL form and status.restoreRequired
        - online CSI expansion of V1 volumes; live engine upgrade of single-replica volumes
        - longhorn_* metric names (13-AC-10); webhook ports 9501/9502
      notes: >-
        Plan 13's rule requires patch ≥ .2: 1.13.0 (2026-09-29) and 1.12.1 (2026-08-14) do not qualify, so the line
        is 1.11 (1.11.3, 2026-07-01). Longhorn 1.11 requires Kubernetes ≥ 1.34. When 1.12.2 ships, moving to 1.12 is
        a plan amendment.

    - name: Traefik
      baselineVersion: v3.7.14
      line: 3.7.x
      chart: {name: traefik, repository: "https://traefik.github.io/charts", version: 41.7.1}
      evidence:
        status: verified
        source: https://github.com/traefik/traefik-helm-chart/releases/tag/v41.7.1
        checked: "2026-10-14"
      planRefs: [plans/09-networking.md, plans/38-prometheus.md, plans/37-admission-policy.md]
      versionSensitiveAssumptions:
        - providers.kubernetesCRD allowCrossNamespace false with provider-qualified middleware references (09-AC-12)
        - chart value key names (09-AC-12); metrics service port 9100
        - pods start under PSA restricted (37-AC-43)
      notes: Chart 41.7.1 ships appVersion v3.7.14 (Traefik release 2026-10-07). k3s's bundled Traefik is not used.

    - name: cloudflared
      baselineVersion: "2026.10.0"
      line: 2026.10.x
      evidence:
        status: verified
        source: https://github.com/cloudflare/cloudflared/releases/tag/2026.10.0
        checked: "2026-10-14"
      planRefs: [plans/09-networking.md, plans/38-prometheus.md, plans/39-grafana.md]
      versionSensitiveAssumptions:
        - "`tunnel --no-autoupdate run` with TUNNEL_TOKEN; --metrics on port 2000"
        - cloudflared_tunnel_ha_connections metric name (Q-39-4)
      notes: >-
        Calendar-versioned (year.month.patch); the line is the month. Released 2026-10-05; plan 09's 14-day soak is
        met on 2026-10-19 (2026.9.3 is the newest soaked release today).

    - name: kured
      baselineVersion: "1.23.0"
      line: 1.23.x
      chart: {name: kured, repository: "https://kubereboot.github.io/charts", version: 6.1.0}
      evidence:
        status: verified
        source: https://github.com/kubereboot/kured/releases/tag/1.23.0
        checked: "2026-10-14"
      planRefs: [plans/08-node-security.md, plans/47-ha-expansion.md]
      versionSensitiveAssumptions:
        - flag names for window, lock and drain timeout (re-verified at GATE-H01)
        - reboot sentinel /var/run/reboot-required
      notes: small-ha only.

    # ------------------------------------------------------------------ forge, identity, CI
    - name: Forgejo
      baselineVersion: v15.0.10
      line: 15.0.x
      lineKind: lts
      evidence:
        status: verified
        source: https://forgejo.org/releases/
        checked: "2026-10-14"
      planRefs: [plans/16-forgejo.md, plans/17-github-mirror.md, plans/20-woodpecker.md, plans/26-agent-runner.md, plans/29-task-state-machine.md, plans/43-retention-gc.md, plans/44-backup.md, plans/55-forge-workflow.md, plans/22-verification-policy.md, plans/25-context.md]
      versionSensitiveAssumptions:
        - branch protection apply_to_admins, push_whitelist_deploy_keys and deploy-key namespace restriction (16-AC-18, 16-AC-34)
        - protected-tag semantics for deploy keys (17-AC-4, 55-AC-1)
        - "[webhook] ALLOWED_HOST_LIST semantics; [mirror] ENABLED=false stops push mirrors (45-AC-4)"
        - push-mirror pruning scope and credential storage (17-AC-3, 17-AC-11)
        - "OIDC source registration via `forgejo admin auth add-oauth` flags (16-AC-31)"
        - API paths used by Runner, verification and retention (26-AC-40, 29-AC-31, compare behind_by, packages API)
        - gitea_* metric prefix; doctor/regenerate commands; storage MINIO_BUCKET_LOOKUP key
        - "`has_actions` field / [actions] ENABLED (16-AC-6); OAuth REFRESH_TOKEN_EXPIRATION_TIME default"
      notes: >-
        15.x is the LTS line, supported until 2027-07-15. v16.0.6 is the current non-LTS stable (supported until
        2026-10-29) and is not used. LTS→LTS majors are human-initiated plan amendments.

    - name: forgejo-helm chart
      baselineVersion: "17.3.0"
      line: 17.x
      lineKind: major
      evidence:
        status: verified
        source: https://code.forgejo.org/forgejo-helm/forgejo-helm/releases/tag/v17.3.0
        checked: "2026-10-14"
      planRefs: [plans/16-forgejo.md, plans/18-flux.md]
      versionSensitiveAssumptions:
        - appVersion is the Forgejo LTS (15.0.10 in 17.3.0)
        - "Bitnami `common` library subchart only, `type: library` (CD-26, 16-AC-36); dependency repository is oci://ghcr.io/visualon/bitnamicharts"
        - admin passwordMode option name; oauth item keys converted to kebab-case flags
      notes: >-
        The chart major follows the chart's own breaking changes; within 17.x a release is acceptable only if its
        appVersion stays in the Forgejo entry's line. 17.3.0 (2026-10-13) changes OAuth handling for Forgejo 16
        group/feature maps; re-run 16-AC-31 when pinning.

    - name: Authentik
      baselineVersion: "2026.8.3"
      line: 2026.8.x
      chart: {name: authentik, repository: "https://charts.goauthentik.io", version: 2026.8.3}
      evidence:
        status: verified
        source: https://github.com/goauthentik/authentik/releases/tag/version%2F2026.8.3
        checked: "2026-10-14"
      planRefs: [plans/15-authentik.md, plans/38-prometheus.md, plans/39-grafana.md, plans/24-hermes.md]
      versionSensitiveAssumptions:
        - blueprint models (metaapplyblueprint, token `key`), flow slugs and initial-setup behavior (15-AC-2, 15-AC-29, 15-AC-30)
        - sub_mode user_uuid stability across secret-key rotation
        - embedded outpost managed identifier; recovery API and `ak create_recovery_key` argument units (Q-15-06)
        - metrics port 9300, health path /-/health/live/, task-failure metric name
        - no Redis (≥ 2025.10); chart's Bitnami postgresql subchart disabled
      notes: Chart and app versions are aligned. 2026.8.3 matches plan 15's 2026-10-13 observation.

    - name: Woodpecker server and agent
      baselineVersion: v3.19.0
      line: 3.19.x
      chart: {name: woodpecker, repository: "https://github.com/woodpecker-ci/helm", version: 3.7.5}
      evidence:
        status: verified
        source: https://github.com/woodpecker-ci/woodpecker/releases/tag/v3.19.0
        checked: "2026-10-14"
      planRefs: [plans/20-woodpecker.md, plans/23-supply-chain.md, plans/36-network-policy.md, plans/37-admission-policy.md, plans/39-grafana.md, plans/51-capacity-and-scheduling.md, plans/34-security.md]
      versionSensitiveAssumptions:
        - exclusive config extension, signed extension requests with server ed25519 key (ADR-0301)
        - extension calls not retried; running pipelines marked killed on restart
        - per-agent tokens via POST /api/agents; WOODPECKER_AGENT_SECRET behavior with registered agents (20-AC-4)
        - WOODPECKER_FORGEJO_* forge variables; EXPERT_WEBHOOK_HOST
        - workflow agent_id field; pipeline.sender for manual events; per-workflow pod label (Q-20-10)
        - secret injection mechanism recorded as woodpecker.secretInjection (20-AC-38, 23-AC-3)
        - log deletion endpoint or native log retention (Q-20-04); Kubernetes backend priority-class option
        - woodpecker_* metric names (20-AC-25); /healthz
      notes: >-
        Chart 3.7.5 ships appVersion 3.19.0 (release 2026-10-08), matching plan 20. The chart's OCI location is not
        verified here (plan 20 §9.1). woodpecker-cli in the ci image
        equals this version.

    - name: Woodpecker plugin-git
      baselineVersion: "2.10.1"
      line: 2.10.x
      evidence:
        status: verified
        source: https://github.com/woodpecker-ci/plugin-git/releases/tag/2.10.1
        checked: "2026-10-14"
      planRefs: [plans/20-woodpecker.md]
      versionSensitiveAssumptions:
        - compatible with the pinned Woodpecker server (clone step)
      notes: Clone image digest is pinned in policy/ci.yaml cloneImage.

    - name: Renovate
      baselineVersion: "44.158.3"
      line: 44.x
      lineKind: major
      evidence:
        status: verified
        source: https://github.com/renovatebot/renovate/releases/tag/44.158.3
        checked: "2026-10-14"
      planRefs: [plans/23-supply-chain.md, plans/48-upgrade.md, plans/01-repository.md]
      versionSensitiveAssumptions:
        - platform forgejo (fallback gitea) against the Forgejo API
        - custom managers for every lock kind; minimumReleaseAge; vulnerabilityAlerts
      notes: >-
        Renovate ships several minor releases per day (44.150–44.158 on 2026-10-14 alone), so the line is the major.
        Its output is always a reviewed PR; a Renovate major is a plan amendment.

    # ------------------------------------------------------------------ observability
    - name: kube-prometheus-stack
      baselineVersion: "92.7.0"
      line: 92.x
      lineKind: major
      evidence:
        status: verified
        source: https://github.com/prometheus-community/helm-charts/releases/tag/kube-prometheus-stack-92.7.0
        checked: "2026-10-14"
      planRefs: [plans/38-prometheus.md, plans/42-alerting-notifications.md, plans/39-grafana.md, plans/48-upgrade.md]
      versionSensitiveAssumptions:
        - grafana.enabled false with forceDeployDashboards; defaultRules.additionalRuleLabels; nodeExporter namespaceOverride
        - kubeEtcd endpoints over http :2381
        - alertmanager.alertmanagerSpec.configSecret key
        - prometheus-operator-crds chart at the stack's operator version
      notes: >-
        92.7.0 (2026-10-14) ships Prometheus Operator v0.94.1, Prometheus v3.15.0, Alertmanager v0.34.1,
        kube-state-metrics subchart 8.6.0 (app v2.20.0) and node-exporter subchart 4.60.0. The chart major marks
        breaking values changes and minors arrive several times a week, so the line is the major; a chart bump
        that moves Prometheus, Alertmanager or kube-state-metrics outside their own lines is still an amendment.

    - name: Prometheus
      baselineVersion: v3.15.0
      line: 3.15.x
      evidence:
        status: verified
        source: https://github.com/prometheus/prometheus/releases/tag/v3.15.0
        checked: "2026-10-14"
      planRefs: [plans/38-prometheus.md, plans/42-alerting-notifications.md]
      versionSensitiveAssumptions:
        - retentionSize bounds blocks and WAL (38-AC-8); local-path does not enforce PVC capacity
        - promtool unit-test format (plan 42)
      notes: Default image of kube-prometheus-stack 92.7.0. promtool in the ci image equals this version.

