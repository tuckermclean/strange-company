# CI policy (plan 20 section 9.2, kind CIPolicy; contract contracts/ci-policy.schema.yaml).
# spec.tddDiscipline is plan 52 section 8.3 verbatim and is read by `make tdd-discipline-check`.
# The other spec fields are plan 20 section 9.2. cloneImage and verify.installerImage are digest-pinned by the
# contract, but no image has been built or pinned yet (versions/platform.lock.yaml, plan 23), so they carry
# the contract's all-5 and all-6 PLACEHOLDER digests until plan 20 deploys Woodpecker.
apiVersion: strange.company/v1alpha1
kind: CIPolicy
metadata: {name: platform}
spec:
  managedOwners: [strange-company, projects, sc-e2e]
  protectedBranches: [main]
  releaseTagPattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
  releaseBranches: []
  imageRegistries: ["git.${BASE_DOMAIN}/strange-company/", "ghcr.io/<owner>/", "docker.io/woodpeckerci/"]
  cloneImage: "docker.io/woodpeckerci/plugin-git:2.10.1@sha256:5555555555555555555555555555555555555555555555555555555555555555"
  stepSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    allowPrivilegeEscalation: false
    privileged: false
    seccompProfile: {type: RuntimeDefault}
    capabilities: {drop: [ALL]}
  lanes:
    ci:
      defaults: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 3Gi, ephemeral-storage: 4Gi}}
      max: {requests: {cpu: "2", memory: 3Gi}, limits: {memory: 3Gi, ephemeral-storage: 6Gi}}
      constrained: {limits: {memory: 2Gi}}
      heavySlotUnits: 1
      workspacePvcMax: 8Gi
    build:
      fromPlan: "23"
      heavySlotUnits: 8
      workspacePvcMax: 10Gi
      sequentialStepsOnly: true
  repoSettings: {timeoutMinutes: 45, maxTimeoutMinutes: 90, requireApproval: forks, allowPullRequests: true, cancelPreviousEvents: [pull_request]}
  crons:
    - {repo: strange-company/strange-company, name: nightly, branch: main, schedule: "0 0 2 * * *"}
  verify:
    installerImage: "git.${BASE_DOMAIN}/strange-company/sc-verify@sha256:6666666666666666666666666666666666666666666666666666666666666666"
    defaultWorkflow: {stepImageFrom: validation.yaml}
  retention: {logDays: 30}
  offclusterLane: {provider: github-actions, workflow: e2e, maxWaitMinutes: 90}
  tddDiscipline:
    excludedBranches: ["agent/*", "renovate/*"]
    behaviorPaths: ["src/**", "charts/**", "gitops/platform/**", "gitops/layers/**", "gitops/profiles/**", "infra/**",
                    "toolbox/**", "images/**", "harnesses/**", "policy/**", "contracts/**", "Makefile", "mk/**", "bootstrap"]
    testPaths: ["**/*_test.go", "**/testdata/**", "test/**", "charts/*/tests/**", "src/internal/contracts/testdata/**"]
    redTargets: [test, contracts, policy-check, gitops-validate, chart-test, test-ansible-k3s, tofu-validate,
                 lint-alerts, lint-metrics, profiles-check, locks-check, secrets-lint, layout-check,
                 toolbox-check]
    redTargetFallbacks:
      toolbox-check: "sh test/e2e/wrapper/run.sh"
    exemptionClasses:
      docs-only:                {paths: ["**/*.md", "adr/**", "plans/**", "procedures/**"]}
      ci-config:                {paths: [".github/**", ".woodpecker/**", "policy/ci.yaml"]}
      dependency-update:        {paths: ["src/go.mod", "src/go.sum", "versions/**", "toolbox/*.lock*", "toolbox/requirements.txt", "infra/tofu/**/.terraform.lock.hcl"]}
      generated-regeneration:   {paths: ["gitops/clusters/*/flux-system/gotk-components.yaml", "bootstrap.env.example"]}
      revert:                   {subjectRegex: '^Revert "'}
      contract-definition:      {paths: ["contracts/**"], requires: "x-invalid-examples added or changed"}
      policy-tuning:            {paths: ["policy/**"], requires: "policy-check passes; values only"}
