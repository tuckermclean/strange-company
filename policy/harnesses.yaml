# Harness registry (plan 28 section 9.1, section 18; decision D6).
# The image digests below are placeholders (repeated hex digits) until plan 23's first trusted build
# replaces them with real, signed digests. `claude` is disabled until R01; every fake-<scenario> entry
# is test-only and shares one harness-fake image.
apiVersion: strange.company/v1alpha1
kind: HarnessRegistry
metadata: {name: default}
spec:
  testRepositories: [sc-e2e/fake-target]
  harnesses:
    claude:
      displayName: Claude Code
      adapter: claude-code
      image: git.example.org/strange-company/harness-claude-code@sha256:1111111111111111111111111111111111111111111111111111111111111111
      cliVersion: 0.0.0-placeholder
      apiFamilies: [anthropic-messages]
      supportedRoles: [researcher, planner, tester, implementer, reviewer]
      gateway:
        baseUrlEnv: {anthropic-messages: ANTHROPIC_BASE_URL}
        tokenDelivery: {mode: env, envVar: ANTHROPIC_API_KEY}
      capabilities: {terminalResultEvent: true, permissionDenialReport: true, toolAllowlist: true, ignoresRepoConfig: true, reportsUsage: true}
      defaults:
        permissionMode: dontAsk
        allowedTools: [Read, Edit, Write, Glob, Grep, "Bash(go test *)", "Bash(go build *)", "Bash(go vet *)", "Bash(make test*)", "Bash(git status)", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)"]
        disallowedTools: [WebFetch, WebSearch, Task, NotebookEdit, "mcp__*", "Bash(git push *)", "Bash(git commit *)", "Bash(git fetch *)", "Bash(git pull *)", "Bash(git remote *)", "Bash(git config *)", "Bash(curl *)", "Bash(wget *)", "Bash(ssh *)"]
        extraArgs: [--bare, --strict-mcp-config, --no-session-persistence]
        environment:
          CLAUDE_CODE_ENABLE_TELEMETRY: "0"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
      signature: {keyRef: cosign:strange-company/release, required: true}
      enabled: false
      stage: production
    fake-success:
      displayName: Fake harness, scenario success
      adapter: fake
      image: git.example.org/strange-company/harness-fake@sha256:3333333333333333333333333333333333333333333333333333333333333333
      cliVersion: 0.1.0
      apiFamilies: [fake]
      supportedRoles: [researcher, planner, tester, implementer, reviewer]
      gateway:
        baseUrlEnv: {fake: SC_FAKE_GATEWAY_URL}
        tokenDelivery: {mode: env, envVar: SC_FAKE_GATEWAY_TOKEN}
      capabilities: {terminalResultEvent: true, permissionDenialReport: false, toolAllowlist: false, ignoresRepoConfig: true}
      fake: {scenario: success}
