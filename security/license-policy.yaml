# Licence policy (plan 23 sections 9 and 14.11; operator decision CD-42).
# Read by `make licenses-check` (sc-lint licenses). An SPDX id in neither list fails like a denied one.
# An exception names one module version and arrives only through a reviewed PR (plan 23 section 14.11).
apiVersion: strange.company/v1alpha1
kind: LicensePolicy
metadata: {name: strange-company}
spec:
  projectLicense: AGPL-3.0-or-later
  allow:
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - 0BSD
    - Zlib
    - Apache-2.0
    - MPL-2.0
    - CC0-1.0
    - Unlicense
    - LGPL-2.1-or-later
    - LGPL-3.0-or-later
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - AGPL-3.0-or-later
  deny:
    - GPL-2.0-only
    - LGPL-2.1-only
    - SSPL-1.0
    - BUSL-1.1
    - Elastic-2.0
    - Commons-Clause
    - CC-BY-NC-4.0
    - CC-BY-NC-SA-4.0
  exceptions:
    # licensecheck v0.3.1 matches both licences of this module's single LICENSE file (MIT, then the
    # Apache-2.0 notice) but at 85 % total coverage, below the 90 % threshold of plan 23 section 14.11,
    # so it would be NOASSERTION. Both licences are allowed above. Found by F02 slice S4.
    - module: go.yaml.in/yaml/v3
      version: v3.0.5
      license: MIT AND Apache-2.0
      reason: licensecheck v0.3.1 matches MIT and Apache-2.0 at 85 % coverage because of the surrounding notice prose; both licences are allowed
      approvedBy: tuckermclean
      created: "2026-10-17"
