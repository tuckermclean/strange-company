$schema: https://json-schema.org/draft/2020-12/schema
$id: https://strange.company/contracts/fx-invalid-example-passes/v1alpha1
title: Fixture
description: Negative fixture for sc-contracts (01-AC-21); the only defect is the one named by the directory.
type: object
required: [name]
additionalProperties: false
properties:
  name: {type: string, minLength: 1}
  at: {type: string, format: date-time}
examples:
  - {name: a}
x-invalid-examples:
  - reason: Claims to be invalid but is a valid instance.
    value: {name: a}
