apiVersion: strange.company/v1alpha1
kind: TofuPlanGuard
metadata:
  name: ovh-vps-apply
spec:
  rootModule: infra/tofu/compute/ovh-vps
  allowedProviders:
    - registry.opentofu.org/ovh/ovh
  forbidReplace: true
  resources:
    - type: ovh_vps
      paid: true
      allowedActions: [no-op, read, create, update]
      maxCount: expectedNodeCount
      priceProductFrom: plan[0].plan_code
