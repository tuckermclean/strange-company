apiVersion: strange.company/v1alpha1
kind: TofuPlanGuard
metadata:
  name: storage
spec:
  rootModule: infra/tofu/storage
  allowedProviders:
    - registry.opentofu.org/hashicorp/aws
  resources:
    - type: aws_s3_bucket
      paid: false
      allowedActions: [no-op, read, create, update, delete]
      maxCount: 10
