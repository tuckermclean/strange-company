# x-invalid-examples[3] of contracts/ci-policy.schema.yaml: A ci-lane workspace cap above the CD-06 limit.
"apiVersion": "strange.company/v1alpha1"
"kind": "CIPolicy"
"metadata":
  "name": "platform"
"spec":
  "managedOwners":
  - "strange-company"
  "protectedBranches":
  - "main"
  "releaseTagPattern": "^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
  "imageRegistries":
  - "ghcr.io/example/"
  "cloneImage": "docker.io/woodpeckerci/plugin-git:2.6.0@sha256:5555555555555555555555555555555555555555555555555555555555555555"
  "stepSecurityContext":
    "runAsNonRoot": true
    "runAsUser": 65532
    "allowPrivilegeEscalation": false
    "privileged": false
    "seccompProfile":
      "type": "RuntimeDefault"
    "capabilities":
      "drop":
      - "ALL"
  "lanes":
    "ci":
      "heavySlotUnits": 1
      "workspacePvcMax": "20Gi"
    "build":
      "heavySlotUnits": 8
      "workspacePvcMax": "10Gi"
  "repoSettings":
    "timeoutMinutes": 45
    "maxTimeoutMinutes": 90
    "requireApproval": "forks"
  "verify":
    "installerImage": "git.example.org/strange-company/sc-verify@sha256:6666666666666666666666666666666666666666666666666666666666666666"
  "retention":
    "logDays": 30
