# x-invalid-examples[3] of contracts/model-routing.schema.yaml: API family without a request allowlist (a denylist-only Gateway would forward provider-hosted tools and URL sources; review COST-1).
"apiVersion": "strange.company/v1alpha1"
"kind": "ModelRouting"
"metadata":
  "name": "default"
"spec":
  "providers":
    "deepseek":
      "displayName": "DeepSeek"
      "enabled": true
      "stage": "production"
      "upstream":
        "baseUrl": "https://api.deepseek.com/v1"
      "credential":
        "kind": "api-key"
        "secretKey": "deepseek"
        "authScheme": "bearer"
      "apiFamilies":
        "openai-chat-completions":
          "usageDialect": "deepseek-chat"
          "outputCapField": "max_tokens"
  "models":
    "deepseek/deepseek-v4-flash":
      "provider": "deepseek"
      "apiModel": "deepseek-v4-flash"
      "apiFamily": "openai-chat-completions"
      "maxOutputTokens": 8192
      "contextWindowTokens": 128000
      "outputCapCoversReasoning": true
      "responseModelMatch":
        "exact":
        - "deepseek-v4-flash"
      "enabled": true
  "tiers":
    "clerical":
      "candidates": []
    "bargain":
      "candidates":
      - "deepseek/deepseek-v4-flash"
    "standard":
      "candidates": []
    "frontier":
      "candidates": []
  "roles":
    "researcher":
      "defaultTier": "bargain"
      "allowedTiers":
      - "bargain"
      "ladder": null
    "planner":
      "defaultTier": "bargain"
      "allowedTiers":
      - "bargain"
      "ladder": null
    "tester":
      "defaultTier": "bargain"
      "allowedTiers":
      - "bargain"
      "ladder": null
    "implementer":
      "defaultTier": "bargain"
      "allowedTiers":
      - "bargain"
      "ladder": null
    "reviewer":
      "defaultTier": "bargain"
      "allowedTiers":
      - "bargain"
      "ladder": null
  "escalationLadders":
    "none":
    - "tier": "bargain"
      "meritFailuresBeforeEscalation": 1
  "orchestrator":
    "tier": "bargain"
    "apiFamilies":
    - "openai-chat-completions"
    "maxConcurrentRequests": 4
  "infrastructureFallback":
    "enabled": false
    "maxFallbacksPerTask": 0
