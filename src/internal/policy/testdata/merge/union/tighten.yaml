apiVersion: strange.company/v1alpha1
kind: RepositoryPolicy
metadata: {name: fixture}
spec:
  testPaths: ["tests/**"]
  protectedPaths: ["vendor/**", "policy/**"]
  protectedBranches: [develop]
  discoveryConfig:
    wholeFiles: ["custom.cfg"]
    semanticKeys:
      - {path: "**/app.json", format: json, keys: [scripts.build]}
  staticChecks:
    skipMarkers:
      go: ['\bmySkip\(']
      shell: ['exit 0 # skip']
  humanAuthority:
    machineAccounts: [sc-extra]
