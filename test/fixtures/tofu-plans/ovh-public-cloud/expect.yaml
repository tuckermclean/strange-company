  - {file: region-mismatch.json, nodes: 1, want: GUARD_REGION_MISMATCH}
  - {file: ssh-key-mismatch.json, nodes: 1, want: GUARD_SSH_KEY_MISMATCH}
  - {file: replace.json, nodes: 1, want: GUARD_REPLACE_FORBIDDEN}
  - {file: extra-resource-type.json, nodes: 1, want: GUARD_UNEXPECTED_RESOURCE}
  - {file: destroy-valid.json, nodes: 1, destroy: true, want: pass}
  - {file: destroy-stray-create.json, nodes: 1, destroy: true, want: GUARD_ACTION_FORBIDDEN}
