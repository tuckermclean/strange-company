      versionCommand: [helm, version, --short]
      versionRegex: '^v{version}\+'
      verifiedAt: 2026-10-17
    - name: flux
      set: runtime
      version: "2.9.6"                      # baseline: Flux v2.9.6
      selectedBy: "baseline:flux"
      # sha256 source: flux_2.9.6_checksums.txt (vendor); GitHub asset digest agrees
      url: https://github.com/fluxcd/flux2/releases/download/v{version}/flux_{version}_linux_{arch}.tar.gz
      sha256:
        amd64: "b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5"
