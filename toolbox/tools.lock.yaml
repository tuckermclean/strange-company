apiVersion: strange.company/v1alpha1
kind: ToolboxLock
metadata:
  name: toolbox
  description: Toolbox and ci image inputs (plan 02 section 9.2, 9.4). Every sha256 was checked against the vendor's published checksum or signature, never trusted from the first download alone; the source is the comment above each entry.
spec:
  tools:
    - name: opentofu
      set: runtime
      version: "1.13.1"                      # baseline: OpenTofu v1.13.1
      selectedBy: "baseline:opentofu"
      # sha256 source: tofu_1.13.1_SHA256SUMS (vendor); GitHub asset digest agrees
      url: https://github.com/opentofu/opentofu/releases/download/v{version}/tofu_{version}_linux_{arch}.tar.gz
      sha256:
        amd64: "378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69"
        arm64: "9c1ef375aa1852db0b2888aa921b640c71f8140d4682aa4fec99378a64fa7dc3"
      install: {extract: tofu, to: /opt/sc/bin/tofu}
      versionCommand: [tofu, version, -json]
      versionRegex: '"terraform_version":\s*"{version}"'
      verifiedAt: 2026-10-17
    - name: kubectl
      set: runtime
      version: "1.36.5"                      # baseline: kubectl v1.36.5
      selectedBy: "baseline:kubectl"
      # sha256 source: kubectl.sha256 beside the binary on dl.k8s.io (vendor)
      url: https://dl.k8s.io/release/v{version}/bin/linux/{arch}/kubectl
      sha256:
        amd64: "33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e"
        arm64: "88fc1aca8fd0c1b44fe379f67c39bd6858bdfc50241dc55775f84d0f5b31da3a"
      install: {to: /opt/sc/bin/kubectl}
      versionCommand: [kubectl, version, --client]
      versionRegex: '^Client Version: v{version}$'
      verifiedAt: 2026-10-17
    - name: helm
      set: runtime
      version: "4.3.0"                      # baseline: Helm v4.3.0
      selectedBy: "baseline:helm"
      # sha256 source: helm-v4.3.0-linux-{arch}.tar.gz.sha256sum on get.helm.sh (vendor)
      url: https://get.helm.sh/helm-v{version}-linux-{arch}.tar.gz
      sha256:
        amd64: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
        arm64: "31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08"
